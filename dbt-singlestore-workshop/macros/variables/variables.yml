version: 2

macros:
  - name: get_incr_load_start
    description: |
      Start of an incremental load window. Defaults to run_started_at minus 7 days; override with env var INCR_LOAD_START.
      Usage:
      - Daily incremental runs: keep the default to load recent changes only
      - Full refresh: override with an early date (e.g. '2020-01-01') for a complete historical load
      - Historical backfill: set a specific start date for a partial historical load

  - name: get_incr_load_end
    description: |
      End of an incremental load window. Defaults to 9999-12-31; override with env var INCR_LOAD_END.
      Usage:
      - Normal runs: keep the default to load all records up to the future
      - Historical backfill: set a specific end date to limit the load to a period

  - name: get_local_run_started_at
    description: "Start of the dbt run in local time"
