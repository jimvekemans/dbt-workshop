# Macro Documentation

macros:
  - name: perform_database_maintenance
    description: |
      Automates database maintenance by revoking all grants and dropping orphaned objects (tables/views) created by dbt for a specified database.

      Parameters:
        - database_name (required): The name of the database to maintain.
        - dry_run (optional, default: False): If True, logs actions without executing them.

      Functionality:
        1. Finds all objects created by target.user in the specified database.
        2. Identifies objects not present in the dbt manifest (orphaned).
        3. Collects all grants on these orphaned objects.
        4. Generates and executes (or logs) REVOKE statements for each grant.
        5. Generates and executes (or logs) DROP statements for each orphaned object.
        6. Logs the number of grants revoked and objects dropped.

      Usage Example:
        dbt run-operation perform_database_maintenance --args \'{"database_name": "my_db", "dry_run": true}\'

  - name: sync_grants_with_singlestore
    description: |
      Synchronizes database grants for dbt models with the project configuration, revoking any grants present in the database but not in the project.

      Parameters:
        - dry_run (optional, default: False): If True, logs actions without executing them.

      Functionality:
        1. Collects grants from dbt model configs and from the database.
        2. Compares project grants with database grants.
        3. Identifies grants in the database that are not in the project config.
        4. Generates and executes (or logs) REVOKE statements for these extra grants.
        5. Logs the number of grants revoked.

      Usage Example:
        dbt run-operation sync_grants_with_singlestore --args \'{"dry_run": true}\'

  - name: import_dependencies
    description: |
      Imports upstream dependencies (ref and source) into a model.

      Generates a set of import CTEs for the top of the model (including 'with' and the separating commas).

      # Argument
      An array of dependencies:
        * a string -> simple ref with the model name as alias, materialize hint on
        * a dictionary:
          * `dependency`: name of the dependency (a ref by default, same name for the CTE)
          * `source` (optional): the source name of a source dependency
          * `alias` (optional): the CTE name
          * `materialize_off` (optional, default `true`): set to `false` to drop the `with (materialize = off)` hint for this dependency (e.g. for complex views)
          * `respect_empty` (optional, default `true`): set to `false` to avoid the `limit 0` subquery around the ref/source on `dbt build --empty` (`ref().render()`). Only use it when the model fails with `--empty` on SingleStore error 1749

      # Example
      ```
      {% raw %}
      {{ import_dependencies(
          [
              "leeftijd",
              {"dependency": "datum"},
              {"dependency": "da_datum", "alias": "andere_datum"},
              {"dependency": "hub_burger", "source": "edw_dv_rdv"},
              {"dependency": "hub_organisatie", "source": "edw_dv_rdv", "alias": "organisatie"},
              {"dependency": "da_organisatie", "materialize_off": false},
          ]
      ) }}
      {% endraw %}
      select * from andere_datum
      ```

      ## Generated SQL

      ```
      with
      leeftijd as       ( select with (materialize = off) * from `edw_dv_bdv`.`leeftijd` )
      , datum as        ( select with (materialize = off) * from `edw_dv_bdv`.`datum` )
      , andere_datum as ( select with (materialize = off) * from `im_dimensional`.`da_datum` )
      , hub_burger as   ( select with (materialize = off) * from `edw_dv_rdv`.`hub_burger` )
      , organisatie as  ( select with (materialize = off) * from `edw_dv_rdv`.`hub_organisatie` )
      , da_organisatie as ( select * from `im_dimensional`.`da_organisatie` )
      select count(*)
      from andere_datum
      ```

  - name: import_generate_cte
    description: |
      Generates one import CTE for an upstream dependency (ref or source).

      This mostly happens through 'import_dependencies', but it can be called on its own for more control per dependency.

      By default we add "with (materialize = off)" so SingleStore does not needlessly materialize whole source tables.

      # Argument
      One dependency (`item`):
        * a string -> simple ref with the model name as alias, materialize hint on
        * a dictionary:
          * `dependency`: name of the dependency (a ref by default, same name for the CTE)
          * `source` (optional): the source name of a source dependency
          * `alias` (optional): the CTE name
          * `materialize_off` (optional, default `true`): set to `false` to drop the `with (materialize = off)` hint for this dependency (e.g. for complex views)
          * `respect_empty` (optional, default `true`): set to `false` to avoid the `limit 0` subquery around the ref/source on `dbt build --empty` (`ref().render()`). Only use it when the model fails with `--empty` on SingleStore error 1749

      # Example
      ```
      {% raw %}
      {{ import_generate_cte("leeftijd") }}
      , {{ import_generate_cte({"dependency": "hub_burger", "source": "edw_dv_rdv"}) }}
      , {{ import_generate_cte({"dependency": "da_organisatie", "materialize_off": false}) }}
      {% endraw %}
      ```

      ## Generated SQL

      ```
      leeftijd as          ( select with (materialize = off) * from `edw_dv_bdv`.`leeftijd` )
      , hub_burger as      ( select with (materialize = off) * from `edw_dv_rdv`.`hub_burger` )
      , da_organisatie as  ( select * from `im_dimensional`.`da_organisatie` )
      ```

  - name: cleanup_user_models
    description: |
      This macro cleans the models created during development (pu-prefixed objects).
      Call the macro with the run-operation command:
      `$ dbt run-operation cleanup_user_models`

      If you want to keep your recent pu-models and drop old models then use this command:
      `$ dbt run-operation cleanup_user_models --args \'{keep_younger_than_days: 7}\'`
