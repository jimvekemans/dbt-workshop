# Project-level vdp configuration, layered over the built-in defaults key by key.

[core]
# The workshop environments (DBT_DEPLOY_TARGET = dev | val | prd). vdp knows them as the aliases of LDV, ABT and PRD,
# so the sections below override those environments' defaults, `vdp env show` prints LDV for `dev`, and `{env}` renders
# the canonical `ldv`; `{env_short}` renders the workshop name (`dev`).
default_environment = "dev"
dotenv = ".devcontainer/.env"

# Where the SingleStore password comes from, highest priority first:
#   1. the workshop Vault (service `vault`), but only when the AppRole ids are set: KEYVAULT_ROLE_ID and
#      KEYVAULT_SECRET_ID in .devcontainer/.env (or in the process environment). Without them Vault is skipped quietly:
#      nothing is contacted, nothing is printed, and a stopped vault container changes nothing.
#   2. .devcontainer/.env (a SINGLESTORE_PASS there, as before)
#   3. the process environment (Airflow tasks and CI jobs pass SINGLESTORE_PASS this way)
# So a .env with a password and no AppRole ids behaves exactly as it always did, and a .env with only the AppRole ids
# (plus SINGLESTORE_HOST, SINGLESTORE_USER, DBT_DEPLOY_TARGET) gets the password from Vault when a command starts.
# `{env_short}` is dev | val | prd. Vault holds the password at vdp/<env>/dbt (key SINGLESTORE_PASS); the user name stays
# in .env. Mount, policy and AppRoles: infrastructure/vault/. Check with `vdp env show` (a layer "vault kv-workshop:..."
# for SINGLESTORE_PASS) or `vdp env doctor`.
[secrets]
vault_mount = "kv-workshop"
precedence = ["vault:vdp/{env_short}/dbt", "dotenv", "env"]

# The workshop Vault runs in dev mode on workshop_net: plain HTTP, no CA. `dev` is LDV, `val` is ABT. The AppRole id
# variables are the defaults' first entries, written out so the project says which ones it reads.
[environments.dev]
vault_url = "http://vault:8200"
ca_certificate = ""
role_id_vars = ["KEYVAULT_ROLE_ID"]
secret_id_vars = ["KEYVAULT_SECRET_ID"]

[environments.val]
vault_url = "http://vault:8200"
ca_certificate = ""
role_id_vars = ["KEYVAULT_ROLE_ID"]
secret_id_vars = ["KEYVAULT_SECRET_ID"]

[environments.prd]
vault_url = "http://vault:8200"
ca_certificate = ""
role_id_vars = ["KEYVAULT_ROLE_ID"]
secret_id_vars = ["KEYVAULT_SECRET_ID"]

# `vdp sources add` and `vdp sources rewrite` work on the physical dev databases the devcontainer connects to.
[sources]
databases = ["dev_landing", "dev_edw_dv_rdv", "dev_edw_dv_bdv", "dev_im_dimensional"]

# Databases carry the environment as a prefix. Sources are written with the expression instead of the literal `dev_`,
# so a generated source is valid in every environment, and hand-written sources using the expression can be maintained.
[sources.database_prefix]
physical = "dev_"
jinja = "{{ env_var('DBT_DEPLOY_TARGET', 'dev') }}_"

[qa]
# `{env_short}` is dev | val | prd, the prefix of the physical databases (`{env}` would be ldv | abt | prd).
run_results_table = "{env_short}_vdp_mgmt.dbt_run_results"
