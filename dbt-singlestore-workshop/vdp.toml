# Project-level vdp configuration, layered over the built-in defaults key by key.

[core]
# The workshop environments (DBT_DEPLOY_TARGET = dev | val | prd). vdp knows them as the aliases of LDV, ABT and PRD,
# so the sections below override those environments' defaults, `vdp env show` prints LDV for `dev`, and `{env}` renders
# the canonical `ldv`; `{env_short}` renders the workshop name (`dev`).
default_environment = "dev"
dotenv = ".devcontainer/.env"

# Local sources only: no secret store in the workshop.
[secrets]
precedence = ["dotenv", "env"]

# The workshop stack has neither Vault nor TLS. `dev` is LDV, `val` is ABT.
[environments.dev]
vault_url = ""
ca_certificate = ""

[environments.val]
vault_url = ""
ca_certificate = ""

[environments.prd]
vault_url = ""
ca_certificate = ""

# `vdp sources add` and `vdp sources rewrite` work on the physical dev databases the devcontainer connects to.
[sources]
databases = ["dev_landing", "dev_edw_dv_rdv", "dev_edw_dv_bdv", "dev_im_dimensional"]

# Databases carry the environment as a prefix. Sources are written with the expression instead of the literal `dev_`,
# so a generated source is valid in every environment, and hand-written sources using the expression can be maintained.
[sources.database_prefix]
physical = "dev_"
jinja = "{{ env_var('DBT_DEPLOY_TARGET', 'dev') }}_"

[qa]
# `{env_short}` is dev | val | prd, the prefix of the physical databases (`{env}` would be ldv | abt | prd).
run_results_table = "{env_short}_vdp_mgmt.dbt_run_results"
