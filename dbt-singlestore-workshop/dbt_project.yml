# ----------------------------------------------------------------------------------------
# Miscellaneous parameters
# ----------------------------------------------------------------------------------------
query-comment:
  comment: "run by {{ target.user }}"
  append: false

quoting:
  database: true
  schema: true
  identifier: true

flags:
  use_colors: false
  send_anonymous_usage_stats: false
  require_generic_test_arguments_property: true
