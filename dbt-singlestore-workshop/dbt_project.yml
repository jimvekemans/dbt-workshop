name: dbt_swf
version: "1.0.0"

profile: "dbt_swf"

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
asset-paths: ["assets"]
packages-install-path: "dbt_packages"
clean-targets:
  - "target"
  - "logs"
  - "{% if env_var('SINGLESTORE_USER', 'pu_username').startswith('pu') %}artifacts{% else %}logs{% endif %}"

models:
  dbt_swf:
    +materialized: view
    edw_dv_bdv:
      +database: edw_dv_bdv
      +tags: edw_dv_bdv
      +docs:
        node_color: "#2c13ba"
    im_dimensional:
      +database: im_dimensional
      +tags: im_dimensional
      +docs:
        node_color: "#1d5e09"

on-run-end:
  - "{% if env_var('LOG_RUN_RESULTS', '') == 'TRUE' and target.name == 'run'%}{{ log_dbt_results(results) }}{% endif %}"

data_tests:
  dbt_swf:
    # GLOBAL severity switch: warn by default, overridable in yml files or individual tests to error. Operations can flip
    # every test without an explicit severity at once per environment, without a deploy: DBT_TEST_SEVERITY=error
    # (Airflow Variable `dbt_env_vars`).
    # LOCAL switches live on the tests themselves, e.g. the dev-data tests in models/edw_dv_bdv/sources_olist.yml:
    #   severity: "{{ env_var('DBT_SEVERITY_DEV_DATA', 'warn' if env_var('DBT_DEPLOY_TARGET', 'dev') == 'dev' else 'error') }}"
    # Note: on dbt Fusion `--warn-error` does not turn a warn-severity test into a failure (dbt Core does), so in the
    # daily load the severity decides.
    +severity: "{{ env_var('DBT_TEST_SEVERITY', 'warn') }}"

# ----------------------------------------------------------------------------------------
# Runtime variables
# Full documentation: https://docs.getdbt.com/docs/configuring-your-project/variables
# ----------------------------------------------------------------------------------------
vars:
  dbt_date:
    "dbt_date:time_zone": "Europe/Brussels"
  dbt_swf:
    # Start of the dbt run in local time
    local_run_started_at: "{{run_started_at.astimezone(modules.pytz.timezone(var('dbt_date')['dbt_date:time_zone'])).strftime('%Y-%m-%d %H:%M:%S') }}"

    # Drift audit (macros/ops/audit_environment_drift.sql; gate in dbt_release, report-only in dbt_daily_load):
    # relations a model builds must be created/altered by one of these accounts, anything else is a change outside Git
    drift_audit_service_accounts: ["svc_ci_dbt", "svc_dev_dbt", "svc_val_dbt", "svc_prd_dbt"]
    # whose grants a missing privilege is compared with ("svc_dev_dbt has them, so CI and dev stay green")
    drift_audit_reference_user: "svc_dev_dbt"
    # platform metadata (run log tables) and system schemas are not audited
    drift_audit_ignore_databases: ["dev_vdp_mgmt", "val_vdp_mgmt", "prd_vdp_mgmt", "information_schema"]

# ----------------------------------------------------------------------------------------
# Miscellaneous parameters
# ----------------------------------------------------------------------------------------
query-comment:
  comment: "run by {{ target.user }}"
  append: false

quoting:
  database: true
  schema: true
  identifier: true

flags:
  use_colors: false
  send_anonymous_usage_stats: false
  require_generic_test_arguments_property: true
