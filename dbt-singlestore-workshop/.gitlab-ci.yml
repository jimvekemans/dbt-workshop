# Runner: docker executor, pull policy if-not-present (the default job image is a local image) and the host docker
# socket mounted into job containers, so build_image and the deploy jobs talk to the host daemon. No registry.
image:
  name: dbt-singlestore-base:1.11.11
  docker:
    user: root

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"
  DOCKER_API_VERSION: "1.44"
  # Literal defaults: GitLab does not expand shell-style ${VAR:-default} in `variables:` (it yields an empty value, which
  # made every dbt job fail with "Missing required field in singlestore profile: database").
  SINGLESTORE_HOST: "singlestore"
  SINGLESTORE_USER: "svc_ci_dbt"
  SINGLESTORE_PASS: "CiServicePwd2026!"

stages: [verify, tag, build, deploy]

.git-setup:
  script:
    - git config --global user.email "gitlab-ci@workshop.local"
    - git config --global user.name "GitLab CI"
    - git config --global --add safe.directory "*"
    - git fetch --force --prune --tags --update-head-ok origin

# dbt packages: downloaded once per version of packages.yml and kept in the runner's cache (dbt_packages/), so a job does
# not depend on the internet connection of the moment; a failed download is tried twice more.
.deps:
  script:
    - '[ -n "$(ls -A dbt_packages 2>/dev/null)" ] || dbt deps || { sleep 5; dbt deps; } || { sleep 15; dbt deps; }'

cache:
  key:
    files: [packages.yml]
  paths: [dbt_packages/]

# Verification runs in vdp_ci as svc_ci_dbt. VERIFY_SCHEMA is set per job; branch names are made schema-safe in the shell.
# A red verify must not leave half-built tables behind (they break the next run, e.g. after the release revert).
.verify:
  stage: verify
  variables:
    DBT_DEPLOY_TARGET: "dev"
  before_script:
    - !reference [.git-setup, script]
  after_script:
    - |
      dbt run-operation drop_nodes --vars "SCHEMA: ${VERIFY_SCHEMA//[\/-]/_}" --target ci || true

# Full build of everything (release branches, MRs to main).
.verify-full:
  extends: .verify
  script:
    - git checkout $CI_COMMIT_SHA
    - !reference [.deps, script]
    - |
      dbt build --vars "SCHEMA: $VERIFY_SCHEMA" --target ci --fail-fast
    - |
      dbt run-operation drop_nodes --vars "SCHEMA: $VERIFY_SCHEMA" --target ci

# Merge requests to dev are rehearsed in two steps, both in vdp_ci with the branch name as table prefix (VERIFY_SCHEMA) and
# both cleaned up by `.verify`'s after_script, also when they fail. State comes from the target branch (dev_* databases):
# the project of origin/dev is compiled into artifacts/, the merge request is merged on top of it, and `state:modified`
# is what differs from that.
.rehearsal-prepare:
  script:
    - git checkout origin/dev
    - !reference [.deps, script]
    - dbt compile --target-path artifacts --target run
    - git checkout $CI_COMMIT_SHA
    - git merge origin/dev --no-commit --no-ff || true
    - dbt clean

# 1. Structure: the client's own command. An empty build of the changed tables and their direct dependants, no checks:
#    cheap, and a change that cannot even be built stops here.
verify_structure:
  extends: .verify
  variables:
    VERIFY_SCHEMA: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  script:
    - !reference [.rehearsal-prepare, script]
    - |
      dbt build --select state:modified+,+state:modified state:modified+1 --empty --state artifacts --defer --vars "SCHEMA: ${VERIFY_SCHEMA//[\/-]/_}" --target=ci --exclude-resource-type test
    - |
      dbt run-operation drop_nodes --vars "SCHEMA: ${VERIFY_SCHEMA//[\/-]/_}" --target=ci
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'

# 2. Data and checks: the changed tables and everything built on them, with rows, and every data check on them.
verify_feature_to_dev:
  extends: .verify
  needs: [verify_structure]
  variables:
    VERIFY_SCHEMA: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  script:
    - !reference [.rehearsal-prepare, script]
    - |
      dbt build --select state:modified+ --state artifacts --defer --vars "SCHEMA: ${VERIFY_SCHEMA//[\/-]/_}" --target ci
    - |
      dbt run-operation drop_nodes --vars "SCHEMA: ${VERIFY_SCHEMA//[\/-]/_}" --target ci
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'

verify_release:
  extends: .verify-full
  variables:
    VERIFY_SCHEMA: ci_release_verify
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\/[0-9]{4}-Q[1-4]$/ && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

# Tagging: both tag jobs compute $new_tag, then push it with the same script.
.tag-push:
  script:
    - echo "Creating tag $new_tag"
    - git tag -f "$new_tag"
    - git push "http://root:${GITLAB_PUSH_TOKEN:-$CI_JOB_TOKEN}@gitlab.local/${CI_PROJECT_PATH}.git" "$new_tag"

tag_dev:
  stage: tag
  script:
    - !reference [.git-setup, script]
    - git checkout dev
    - git pull origin dev
    - latest_tag=$(git tag -l 'v*.*.*' | sort -V | tail -n 1)
    - latest_tag="${latest_tag:-v1.0.0}"
    - IFS=. read -r major minor patch <<< "$latest_tag"
    - last_merge_msg=$(git log -1 --pretty=%s)
    - |
      if [[ "$last_merge_msg" == *"feature/"* || "$last_merge_msg" == feat* ]]; then
        new_tag="${major}.$((minor + 1)).0"
      else
        new_tag="${major}.${minor}.$((patch + 1))"
      fi
    - !reference [.tag-push, script]
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"'

tag_main:
  stage: tag
  script:
    - !reference [.git-setup, script]
    - git checkout main
    - git pull origin main
    - release_name=$(git log -1 --pretty=%s | grep -oP "release/\K[^ ']+" || echo "")
    - |
      if [ -z "$release_name" ]; then
        latest_rel=$(git tag -l | grep -E '^[0-9]{4}-Q[1-4]\.' | sort -V | tail -n 1 | awk -F. '{print $1}')
        release_name="${latest_rel:-$(date +%Y)-Q1}"
      fi
    - existing_tag=$(git tag -l "${release_name}.*" | sort -V | tail -n 1)
    - |
      if [ -z "$existing_tag" ]; then
        new_tag="${release_name}.0"
      else
        new_tag="${release_name}.$((${existing_tag##*.} + 1))"
      fi
    - !reference [.tag-push, script]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

# Image: dbt-vdp:<tag> on the host daemon (no push). Airflow runs exactly this tag.
.build-image:
  stage: build
  image: docker:27.3.1-cli
  script:
    - docker build --build-arg GIT_TAG="$CI_COMMIT_TAG" --build-arg GIT_COMMIT="$CI_COMMIT_SHA" -t "dbt-vdp:$CI_COMMIT_TAG" .

build_image:
  extends: .build-image
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(v[0-9]+\.[0-9]+\.[0-9]+|[0-9]{4}-Q[1-4]\.[0-9]+)$/'

# Artifacts of a version (the target/ folder, as the client's pipeline stores it): the catalogue artifacts and the
# documentation site of the project at this tag, packed as target.tar.gz and uploaded to the generic package registry of
# this GitLab project as package dbt-artifacts, version <tag>. Runs in the default job image (it has dbt and curl) as the
# CI account svc_ci_dbt, which can only reach the dev_* databases: that is why the names in the catalogue are compiled for
# DBT_DEPLOY_TARGET=dev, whatever the version. allow_failure: a catalogue upload that goes wrong must not stop a release.
publish_artifacts:
  stage: build
  needs: [build_image]
  allow_failure: true
  variables:
    DBT_DEPLOY_TARGET: "dev"
  script:
    - !reference [.deps, script]
    - dbt compile --target collibra --target-path target/collibra
    - dbt docs generate --target run --target-path target/dbt-docs
    - tar -czf target.tar.gz target
    - |
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file target.tar.gz \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dbt-artifacts/${CI_COMMIT_TAG}/target.tar.gz"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(v[0-9]+\.[0-9]+\.[0-9]+|[0-9]{4}-Q[1-4]\.[0-9]+)$/'

# Deploy of $CI_COMMIT_TAG to $DEPLOY_ENV: 1. DAGs into the state volume, 2. static dbt docs site (scripts/docs_overview.sh
# first writes its front page, models/__overview__.md), 3. Airflow variable,
# 4. the artifact of the environment (see below).
# DBT_SVC_PASS is the environment service user's password (CI/CD variable overrides the fixture default per job).
.deploy:
  stage: deploy
  image: docker:27.3.1-cli
  needs: [build_image, publish_artifacts]
  variables:
    DBT_SVC_PASS: "CiServicePwd2026!"
  script:
    - IMG="dbt-vdp:$CI_COMMIT_TAG"
    - |
      docker run --rm -u root -v "workshop_${DEPLOY_ENV}:/state" "$IMG" sh -c '
        find /state/dags -mindepth 1 -delete &&
        mkdir -p /state/dags/utils &&
        cp -r airflow/dags/. /state/dags/ && cp -r airflow/utils/. /state/dags/utils/ &&
        find /state/dags -name __pycache__ -prune -exec rm -rf {} + ; chmod -R a+rwX /state/dags'
    - |
      docker run --rm -u root --network workshop_net -v "workshop_${DEPLOY_ENV}:/state" \
        -e DBT_DEPLOY_TARGET="$DEPLOY_ENV" -e DEPLOY_ENV -e CI_COMMIT_TAG -e SINGLESTORE_HOST \
        -e SINGLESTORE_USER="svc_${DEPLOY_ENV}_dbt" -e SINGLESTORE_PASS="$DBT_SVC_PASS" "$IMG" sh -c '
        mkdir -p /state/docs && find /state/docs -mindepth 1 -delete &&
        { bash scripts/docs_overview.sh || echo "front page not generated"; } &&
        dbt docs generate --target run --output-dir /state/docs && chmod -R a+rwX /state/docs'
    - docker exec "workshop-airflow-${DEPLOY_ENV}" airflow variables set dbt_image_tag "$CI_COMMIT_TAG"
    # 4. The artifact of the environment: the tarball of publish_artifacts again, as package dbt-artifacts-env, version
    #    <env>, plus deployed.json that says which exact version it is. docker:cli has no curl, the project image has: the
    #    step runs there, on workshop_net, to reach GitLab. It comes last and is not fatal: the deploy itself is done, and
    #    a failed upload must not block deploy_prd (which needs deploy_val).
    - |
      docker run --rm -u root --network workshop_net \
        -e CI_JOB_TOKEN -e CI_API_V4_URL -e CI_PROJECT_ID -e CI_COMMIT_TAG -e CI_COMMIT_SHA -e DEPLOY_ENV "$IMG" sh -c '
        set -e
        cd /tmp
        api="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic"
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --output target.tar.gz \
          "$api/dbt-artifacts/$CI_COMMIT_TAG/target.tar.gz"
        printf "{\"version\": \"%s\", \"commit\": \"%s\", \"environment\": \"%s\", \"sha256\": \"%s\", \"deployed_at\": \"%s\"}\n" \
          "$CI_COMMIT_TAG" "$CI_COMMIT_SHA" "$DEPLOY_ENV" "$(sha256sum target.tar.gz | cut -d" " -f1)" \
          "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deployed.json
        for f in target.tar.gz deployed.json; do
          curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
            "$api/dbt-artifacts-env/$DEPLOY_ENV/$f"
        done' || echo "WARNING: the artifact of environment ${DEPLOY_ENV} was not stored (is publish_artifacts green?)"

.dev-tag-rule: &dev_tag '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
.release-tag-rule: &release_tag '$CI_COMMIT_TAG =~ /^[0-9]{4}-Q[1-4]\.[0-9]+$/'

deploy_dev:
  extends: .deploy
  variables: {DEPLOY_ENV: dev}
  environment: dev
  rules:
    - if: *dev_tag

deploy_val:
  extends: .deploy
  variables: {DEPLOY_ENV: val}
  environment: val
  rules:
    - if: *release_tag

deploy_prd:
  extends: .deploy
  needs: [build_image, publish_artifacts, deploy_val]
  variables: {DEPLOY_ENV: prd}
  environment: prd
  rules:
    - if: *release_tag
      when: manual
