# Runner: docker executor, pull policy if-not-present (the default job image is a local image) and the host docker
# socket mounted into job containers, so build_image and the deploy jobs talk to the host daemon. No registry.
image:
  name: dbt-singlestore-base:1.11.11
  docker:
    user: root

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"
  DOCKER_API_VERSION: "1.44"
  # Literal defaults: GitLab does not expand shell-style ${VAR:-default} in `variables:` (it yields an empty value, which
  # made every dbt job fail with "Missing required field in singlestore profile: database").
  SINGLESTORE_HOST: "singlestore"
  SINGLESTORE_USER: "svc_ci_dbt"
  SINGLESTORE_PASS: "CiServicePwd2026!"

stages: [verify, tag, build, deploy]

.git-setup:
  script:
    - git config --global user.email "gitlab-ci@workshop.local"
    - git config --global user.name "GitLab CI"
    - git config --global --add safe.directory "*"
    - git fetch --force --prune --tags --update-head-ok origin

# Verification runs in vdp_ci as svc_ci_dbt. VERIFY_SCHEMA is set per job; branch names are made schema-safe in the shell.
# A red verify must not leave half-built tables behind (they break the next run, e.g. after the release revert).
.verify:
  stage: verify
  variables:
    DBT_DEPLOY_TARGET: "dev"
  before_script:
    - !reference [.git-setup, script]
  after_script:
    - |
      dbt run-operation drop_nodes --vars "SCHEMA: ${VERIFY_SCHEMA//[\/-]/_}" --target ci || true

# Full build of everything (release branches, MRs to main).
.verify-full:
  extends: .verify
  script:
    - git checkout $CI_COMMIT_SHA
    - dbt deps
    - |
      dbt build --vars "SCHEMA: $VERIFY_SCHEMA" --target ci --fail-fast
    - |
      dbt run-operation drop_nodes --vars "SCHEMA: $VERIFY_SCHEMA" --target ci

# Slim CI: state from the target branch (dev_* databases), then only modified nodes and their children, deferred.
verify_feature_to_dev:
  extends: .verify
  variables:
    VERIFY_SCHEMA: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  script:
    - git checkout origin/dev
    - dbt deps
    - dbt compile --target-path artifacts --target run
    - git checkout $CI_COMMIT_SHA
    - git merge origin/dev --no-commit --no-ff || true
    - dbt clean
    - |
      dbt build --select state:modified+ --state artifacts --defer --vars "SCHEMA: ${VERIFY_SCHEMA//[\/-]/_}" --target ci
    - |
      dbt run-operation drop_nodes --vars "SCHEMA: ${VERIFY_SCHEMA//[\/-]/_}" --target ci
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'

verify_release:
  extends: .verify-full
  variables:
    VERIFY_SCHEMA: ci_release_verify
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\/[0-9]{4}-Q[1-4]$/ && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

# Tagging: both tag jobs compute $new_tag, then push it with the same script.
.tag-push:
  script:
    - echo "Creating tag $new_tag"
    - git tag -f "$new_tag"
    - git push "http://root:${GITLAB_PUSH_TOKEN:-$CI_JOB_TOKEN}@gitlab.local/${CI_PROJECT_PATH}.git" "$new_tag"

tag_dev:
  stage: tag
  script:
    - !reference [.git-setup, script]
    - git checkout dev
    - git pull origin dev
    - latest_tag=$(git tag -l 'v*.*.*' | sort -V | tail -n 1)
    - latest_tag="${latest_tag:-v1.0.0}"
    - IFS=. read -r major minor patch <<< "$latest_tag"
    - last_merge_msg=$(git log -1 --pretty=%s)
    - |
      if [[ "$last_merge_msg" == *"feature/"* || "$last_merge_msg" == feat* ]]; then
        new_tag="${major}.$((minor + 1)).0"
      else
        new_tag="${major}.${minor}.$((patch + 1))"
      fi
    - !reference [.tag-push, script]
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"'

tag_main:
  stage: tag
  script:
    - !reference [.git-setup, script]
    - git checkout main
    - git pull origin main
    - release_name=$(git log -1 --pretty=%s | grep -oP "release/\K[^ ']+" || echo "")
    - |
      if [ -z "$release_name" ]; then
        latest_rel=$(git tag -l | grep -E '^[0-9]{4}-Q[1-4]\.' | sort -V | tail -n 1 | awk -F. '{print $1}')
        release_name="${latest_rel:-$(date +%Y)-Q1}"
      fi
    - existing_tag=$(git tag -l "${release_name}.*" | sort -V | tail -n 1)
    - |
      if [ -z "$existing_tag" ]; then
        new_tag="${release_name}.0"
      else
        new_tag="${release_name}.$((${existing_tag##*.} + 1))"
      fi
    - !reference [.tag-push, script]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

# Image: dbt-vdp:<tag> on the host daemon (no push). Airflow runs exactly this tag.
.build-image:
  stage: build
  image: docker:27.3.1-cli
  script:
    - docker build --build-arg GIT_TAG="$CI_COMMIT_TAG" --build-arg GIT_COMMIT="$CI_COMMIT_SHA" -t "dbt-vdp:$CI_COMMIT_TAG" .

build_image:
  extends: .build-image
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(v[0-9]+\.[0-9]+\.[0-9]+|[0-9]{4}-Q[1-4]\.[0-9]+)$/'

# Deploy of $CI_COMMIT_TAG to $DEPLOY_ENV: 1. DAGs into the state volume, 2. static dbt docs site, 3. Airflow variable.
# DBT_SVC_PASS is the environment service user's password (CI/CD variable overrides the fixture default per job).
.deploy:
  stage: deploy
  image: docker:27.3.1-cli
  needs: [build_image]
  variables:
    DBT_SVC_PASS: "CiServicePwd2026!"
  script:
    - IMG="dbt-vdp:$CI_COMMIT_TAG"
    - |
      docker run --rm -u root -v "workshop_${DEPLOY_ENV}:/state" "$IMG" sh -c '
        find /state/dags -mindepth 1 -delete &&
        mkdir -p /state/dags/utils &&
        cp -r airflow/dags/. /state/dags/ && cp -r airflow/utils/. /state/dags/utils/ &&
        find /state/dags -name __pycache__ -prune -exec rm -rf {} + ; chmod -R a+rwX /state/dags'
    - |
      docker run --rm -u root --network workshop_net -v "workshop_${DEPLOY_ENV}:/state" \
        -e DBT_DEPLOY_TARGET="$DEPLOY_ENV" -e SINGLESTORE_HOST -e SINGLESTORE_USER="svc_${DEPLOY_ENV}_dbt" \
        -e SINGLESTORE_PASS="$DBT_SVC_PASS" "$IMG" sh -c '
        mkdir -p /state/docs && find /state/docs -mindepth 1 -delete &&
        dbt docs generate --target run --output-dir /state/docs && chmod -R a+rwX /state/docs'
    - docker exec "workshop-airflow-${DEPLOY_ENV}" airflow variables set dbt_image_tag "$CI_COMMIT_TAG"

.dev-tag-rule: &dev_tag '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
.release-tag-rule: &release_tag '$CI_COMMIT_TAG =~ /^[0-9]{4}-Q[1-4]\.[0-9]+$/'

deploy_dev:
  extends: .deploy
  variables: {DEPLOY_ENV: dev}
  environment: dev
  rules:
    - if: *dev_tag

deploy_val:
  extends: .deploy
  variables: {DEPLOY_ENV: val}
  environment: val
  rules:
    - if: *release_tag

deploy_prd:
  extends: .deploy
  needs: [build_image, deploy_val]
  variables: {DEPLOY_ENV: prd}
  environment: prd
  rules:
    - if: *release_tag
      when: manual
