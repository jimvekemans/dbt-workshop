# dbt-bouncer applies these patterns with re.match (anchored at the start of the model's code), so a pattern that
# should match anywhere has to start with `.*`; (?is) = ignore case, and `.` also matches line breaks.
manifest_checks:
  - name: check_model_has_semi_colon
  - name: check_model_hard_coded_references
  - name: check_model_code_does_not_contain_regexp_pattern
    regexp_pattern: '(?is).*\bto_char\s*\('
    description: "Model uses to_char: see the dbt style guide"
  - name: check_model_code_does_not_contain_regexp_pattern
    regexp_pattern: '(?is).*\bstr_to_date\s*\('
    description: "Model uses str_to_date: see the dbt style guide"
