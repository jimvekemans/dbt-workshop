version: 2

models:
  - name: stg_carrier_events
    description: >
      Carrier scans, one row per scan (event_id). The carrier changes its message format on one day: scans that
      arrived before the switch-over moment (env var DBT_CARRIER_V2_FROM, default: never) are read with the old
      format, later ones with the new format. read_as says which reader was used; is_readable is false when a scan
      could not be read (shipment, event type or time missing), e.g. because it arrived in a format the moment did
      not expect. Operators set the moment without a deploy through the Airflow Variable dbt_env_vars.
    config:
      meta:
        owner_team: platform
    columns:
      - name: event_id
        data_tests:
          - not_null:
              config: {severity: error, tags: [critical]}
          - unique:
              config: {severity: error, tags: [critical], where: "is_readable"}
      - name: shipment_id
      - name: order_id
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["picked_up", "in_transit", "delivered"]
              config: {severity: error, tags: [critical], where: "is_readable"}
      - name: event_ts
      - name: read_as
        description: "Which format reader was used: 'old format' or 'new format'."
      - name: is_readable
        description: "True when shipment_id, event_type and event_ts are all filled."
      - name: _ingested_at
