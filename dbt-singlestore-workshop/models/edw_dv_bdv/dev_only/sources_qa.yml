version: 2

# DEV-only source: the QA team's test-account registry exists in analytics_dev only. The source is disabled outside
# LDV/ABT, so PRD never parses a ref to it, never runs its tests and never queries a table it does not have.
sources:
  - name: qa
    description: "QA test-account registry (DEV only): accounts the QA smoke tests place orders with."
    database: analytics_dev
    schema: analytics_dev
    config:
      enabled: "{{ env_var('DBT_DEPLOY_TARGET', 'LDV') in ['LDV', 'ABT'] }}"
    tables:
      - name: _qa_test_accounts
        columns:
          - name: account_id
