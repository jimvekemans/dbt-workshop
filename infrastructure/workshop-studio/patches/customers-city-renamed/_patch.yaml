title: "De kolom met de stad in de klantentabel gewoon 'city' noemen"
message: 'refactor: customers table calls the city column city'
ops:
- path: models/im_dimensional/dim_olist_customers.sql
  find: "    customer_zip_code_prefix,\n    customer_city,\n    customer_state,\n    _ingested_at\nfrom customers"
  replace: "    customer_zip_code_prefix,\n    customer_city as city,\n    customer_state,\n    _ingested_at\nfrom customers"
