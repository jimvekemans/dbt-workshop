version: 2

models:
  - name: stg_olist_payments
    description: "Domain A staging: one row per payment."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_sequential]
          config:
            severity: error
  - name: dim_olist_payments
    description: "Domain A dimension at payment grain (order_betaald_totaal repeats per payment row)."
  - name: mart_olist_payment_performance
    description: "Finance data product: revenue per order month."
    columns:
      - name: bestel_jaar_maand
        data_tests:
          - not_null
