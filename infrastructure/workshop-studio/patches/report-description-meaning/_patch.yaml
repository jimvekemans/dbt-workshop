title: "In de beschrijving van het managementrapport zeggen in welke maand een bestelling meetelt"
message: 'docs: the management report counts an order in the month it was placed'
ops:
  - path: models/im_dimensional/olist_management.yml
    find: 'description: "Management data product: order volume and delivery performance per order month (carrier scans)."'
