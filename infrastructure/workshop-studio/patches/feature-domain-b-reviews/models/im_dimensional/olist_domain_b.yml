version: 2

models:
  - name: stg_olist_reviews
    description: "Domain B staging: one row per delivered review (not deduplicated)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [review_id, order_id]
          config:
            severity: error
  - name: dim_olist_reviews
    description: "Domain B dimension: reviews with NPS category."
  - name: mart_olist_customer_satisfaction
    description: "Marketing data product: NPS per order month."
    columns:
      - name: bestel_jaar_maand
        data_tests:
          - not_null
