id: E2_core_column_rename
layer: engineering
status: narrative
title: "Core team renames a column Domain A uses"
summary: "A breaking change to the shared fact is caught by state:modified+ - if the downstream models are in the state."
focus: [dbt.fct_olist_orders, team.core, team.domain_a]
detect: "verify_feature_to_dev (state:modified+) fails on Domain A models."
inject:
  narrative: "The Core team renames fct_olist_orders.x_bestel_datum_dakey to bestel_datum_dakey in a feature branch."
  sim:
    team.core: {health: warn, note: "breaking change in MR"}
    dbt.fct_olist_orders: {health: warn, note: "column renamed"}
    ci.verify: {health: fail, note: "state:modified+ fails downstream"}
impact:
  - {node: dbt.mart_olist_payment_performance, health: fail, note: "column not found"}
  - {node: dbt.mart_olist_customer_satisfaction, health: fail, note: "column not found"}
  - {node: team.domain_a, health: warn}
  - {node: team.domain_b, health: warn}
steps:
  - title: "Detect in the MR pipeline"
    explain: "`dbt build --select state:modified+` builds the changed model and everything downstream - the squads' models fail before the MR can merge."
    code: "dbt build --select state:modified+ --state artifacts --defer --target=ci"
    zoom: platform
    highlight: [ci.verify, dbt.fct_olist_orders]
  - title: "Communicate the contract and deprecate in two steps"
    explain: "Release 1 adds the new column next to the old one and announces the deprecation. Squads migrate. Release 2 drops the old column."
    code: |
      -- release 1:  x_bestel_datum_dakey, x_bestel_datum_dakey as bestel_datum_dakey
      -- release 2:  bestel_datum_dakey only
    highlight: [team.core, team.domain_a, team.domain_b]
    sim:
      team.core: {health: ok, note: ""}
      dbt.fct_olist_orders: {health: ok, note: ""}
      ci.verify: {health: ok, note: ""}
      dbt.mart_olist_payment_performance: {health: ok, note: ""}
      dbt.mart_olist_customer_satisfaction: {health: ok, note: ""}
      team.domain_a: {health: ok}
      team.domain_b: {health: ok}
