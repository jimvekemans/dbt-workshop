id: strict-where-it-matters
group: sources
title: Rommelige testdata mag in development, nooit in productie
promise: Dezelfde check waarschuwt enkel tijdens het uitproberen en stopt de load waar echte klanten van afhangen.
minutes: 4
feature: "Checks die strenger zijn waar het telt"
status: next
why: "Eén strengheid voor alles legt de nachten van de testers stil of laat een ongeldig klantnummer tot in productiefacturen geraken."
tech: ["test severity", "DBT_SEVERITY_DEV_DATA"]
environment: dev
related: []
reality: "Van de ruim 5.000 checks kan ongeveer één op drie een load stoppen; de rest waarschuwt enkel. Toen vier checks enkel in productie mislukten, werden ze uitgezet zodat de load weer slaagde."

quiz:
  situation: Testers vullen de webshop in development met verzonnen bestellingen, sommige met een ongeldig klantnummer. In productie komen enkel echte bestellingen binnen.
  question: Hoe streng is de check op klantnummers?
  options:
    - label: Overal streng maken, ook in development
      impact: Een ongeldig nummer geraakt nooit in productie. Maar elke nacht in development stopt en de testers kunnen niets uitproberen.
      tone: warn
    - label: Overal soepel maken, enkel met een waarschuwing
      impact: De testers kunnen verder, maar een ongeldig nummer kan tot in de echte webshop geraken en de boekhouding factureert een klant die niet bestaat.
      tone: bad
    - label: In development soepel en in validatie en productie streng maken
      impact: De testers kunnen verder en een slecht nummer stopt de load waar echte klanten van afhangen. Dezelfde check, op twee plaatsen anders ingesteld.
      tone: good
      platform: true
  takeaway: Streng waar echte klanten van afhangen, soepel waar mensen oefenen.
  minutes: 2

problem:
  headline: Ofwel zitten de testers geblokkeerd, ofwel geraakt slechte data in productie
  story: |
    Testers vullen de webshop in development met verzonnen bestellingen, en sommige hebben ongeldige
    klantnummers. Is de check op klantnummers overal streng, dan stopt elke nacht in development en kan niemand iets
    uitproberen. Is hij overal soepel, dan kan een ongeldig nummer tot in de echte webshop geraken, en factureert de
    boekhouding een klant die niet bestaat.
  cost: Testers verliezen dagen aan stilgelegde nachten, of de boekhouding stuurt een factuur naar een klant die niet bestaat.
  visual:
    type: compare
    left:
      title: Overal streng
      state: bad
      items:
        - Oefenbestellingen leggen elke oefennacht stil.
        - Testers wachten, of zetten de check uit.
    right:
      title: Overal soepel
      state: bad
      items:
        - Een ongeldig klantnummer geraakt in de echte webshop.
        - De boekhouding merkt het pas bij de facturatie.
    caption: Eén strengheid voor development en productie is fout voor minstens één van de twee.

idea:
  headline: Dezelfde check is soepel in development en streng in productie
  points:
    - In development is een mislukte check enkel een waarschuwing, dus de nachtelijke load gaat door.
    - In validatie (de [[omgeving]] om na te kijken) en productie (de echte webshop) stopt dezelfde check de load, voor slechte bestellingen zich verspreiden.
    - Enkel in development worden ongeldige bestellingen ook opzijgezet, zodat de rapporten daar proper blijven.
  visual:
    type: flow
    nodes:
      - {id: orders, label: Bestellingen komen binnen, state: ok, note: "Sommige met ongeldige klantnummers"}
      - {id: check, label: Check op klantnummers, state: fix, note: "Dezelfde regel, strengheid per plek"}
      - {id: dev, label: In development, state: warn, note: "Waarschuwt, de load gaat door"}
      - {id: prod, label: In validatie en productie, state: ok, note: "Stopt de load"}
      - {id: load, label: De nachtelijke load, state: idle, note: "Gaat door in development, stopt elders"}
    links: [[orders, check], [check, dev], [check, prod], [dev, load], [prod, load]]
    caption: Eén regel, één keer geschreven, met twee manieren van reageren.

code:
  - title: Eén check, twee niveaus van strengheid
    file: models/edw_dv_bdv/sources_olist.yml
    file_label: De beschrijving van de feed met bestellingen
    from: "# DYNAMIC LOCAL SEVERITY"
    to: "severity: \"{{ env_var('DBT_SEVERITY_DEV_DATA'"
    max_lines: 8
    notes:
      - line: "warn in dev, error in"
        says: Dezelfde check waarschuwt in development en stopt elders de nachtelijke load.
      - line: "# val/prd. DBT_SEVERITY_DEV_DATA overrides"
        says: Een operator kan hem voor één run toch strenger of soepeler zetten.
      - line: regexp
        says: "De regel: een geldig klantnummer telt 32 tekens, cijfers en letters van a tot f."
  - title: In development worden ongeldige bestellingen opzijgezet
    file: models/edw_dv_bdv/dev_only/stg_olist_orders.sql
    file_label: De bestellingentabel in development
    from: "from raw_source r"
    to: "quarantine malformed customer ids"
    max_lines: 4
    notes:
      - line: "from raw_source r"
        says: Elke ruwe bestelling wordt hier eerst gelezen.
      - line: "quarantine malformed customer ids"
        says: Enkel bestellingen met een geldig klantnummer gaan door naar de rapporten.

demo:
  intro: Development en validatie krijgen allebei bestellingen met enkele ongeldige klantnummers. We runnen in beide dezelfde nachtelijke load.
  setup:
    - {action: feed.condition, feed: orders, set: {dirty_pct: 5}}
    - {action: feed.deliver, days: 3}
    - {action: feed.condition, env: val, feed: orders, set: {dirty_pct: 5}}
    - {action: feed.deliver, env: val, days: 3}
  steps:
    - id: dev
      title: In development waarschuwt de check
      say: De ongeldige klantnummers worden gevonden en de nachtelijke load gaat verder.
      button: Nachtelijke load runnen in development
      inputs: []
      do:
        - {action: airflow.run_dag, dag: dbt_daily_load, expect: success}
      show:
        - type: number
          title: Ongeldige bestellingen die binnenkwamen
          query: "select count(*) from {{ db('landing') }}.raw_olist_orders where customer_id not regexp '^[0-9a-f]{32}$'"
          unit: bestellingen
          compare_to:
            query: "select count(*) from {{ db('edw_dv_bdv') }}.stg_olist_orders where customer_id not regexp '^[0-9a-f]{32}$'"
            label: Ongeldige bestellingen in de rapporten
        - {type: tasks, dag: dbt_daily_load, title: De nachtelijke load in development}
        - {type: run_history, limit: 1, title: Wat de checks vonden in development, caption: "Eén check gaf een waarschuwing die alle ongeldige bestellingen hierboven dekt. In development is een mislukte check enkel een waarschuwing, dus de nachtelijke load gaat door."}
      outcome:
        check: "select count(*) from {{ db('edw_dv_bdv') }}.stg_olist_orders where customer_id not regexp '^[0-9a-f]{32}$'"
        good_when: zero
        good: De check gaf een waarschuwing en de nachtelijke load is afgerond. Geen enkele ongeldige bestelling is in de rapporten geraakt.
        not_quite: "{{ value }} ongeldige bestellingen zijn in de rapporten geraakt: ze werden niet opzijgezet."
    - id: val
      title: In validatie stopt dezelfde check de load
      say: Dezelfde soort rommelige bestellingen komt binnen, maar nu is de check streng.
      button: Nachtelijke load runnen in validatie
      inputs: []
      do:
        - {action: airflow.run_dag, env: val, dag: dbt_daily_load, expect: failed}
      show:
        - type: number
          env: val
          title: Ongeldige bestellingen die binnenkwamen
          caption: Hier kwamen dezelfde soort ongeldige bestellingen binnen, en geen enkele is in de rapporten geraakt, want de nacht stopte eerst.
          query: "select count(*) from {{ db('landing') }}.raw_olist_orders where customer_id not regexp '^[0-9a-f]{32}$'"
          unit: bestellingen
          compare_to:
            query: "select count(*) from {{ db('edw_dv_bdv') }}.stg_olist_orders where customer_id not regexp '^[0-9a-f]{32}$'"
            label: Ongeldige bestellingen in de rapporten
        - {type: tasks, env: val, dag: dbt_daily_load, title: De nachtelijke load in validatie, caption: "Dezelfde soort bestellingen stopt hier de nachtelijke load: 1 stap mislukt."}
        - {type: run_history, env: val, limit: 1, title: Wat de checks vonden in validatie, caption: "In validatie is dezelfde mislukte check een probleem dat de nacht stopt."}
        - {type: result, title: Wat er gebeurd is}
      outcome: "Dezelfde check die in development enkel waarschuwde, stopt hier de nachtelijke load: 1 stap mislukt."
