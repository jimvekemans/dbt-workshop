id: same-toolbox
group: changes
title: Iedereen werkt met dezelfde toolbox
promise: Elke developer heeft dezelfde tools in de toolbox, en de rapportbouwer komt overeen met productie.
minutes: 3
feature: "Eén toolbox voor elke developer"
status: today
tech: ["dbt-singlestore-dev image", "devcontainer.json", "dbt-singlestore-base"]
environment: dev
related:
  - id: own-workbench
    why: Elke developer krijgt ook een privékopie van de tabellen om wijzigingen in uit te proberen. De toolbox is de set tools die daar gebruikt wordt.
reality: "Elke developer opent het project van bij de start in dezelfde toolbox. Na enkele maanden kregen de tools daarin een vaste versie. Bij een upgrade van de engine kreeg iedereen de boodschap zijn toolbox te vernieuwen."

quiz:
  situation: Een nieuwe collega start op maandag en zet de tools voor het rapporteren op haar laptop. Haar eerste voorstel werkt bij haar, maar de automatische testrun weigert het.
  question: Hoe krijgt elke developer dezelfde tools?
  options:
    - label: Een lijst met installatiestappen en versies rondsturen
      impact: Elke collega installeert zelf, dus elke laptop blijft een beetje anders. Een nieuwere tool op één laptop merkt niemand op tot een wijziging mislukt.
      tone: warn
    - label: Het project openen in één kant-en-klare set tools
      impact: Een nieuwe collega installeert niets. Elke tool heeft één versie, en de testrun en productie starten van dezelfde basis, dus de rapportbouwer komt overeen.
      tone: good
      platform: true
    - label: Iedereen de nieuwste versie van elke tool laten nemen
      impact: Nieuwer is niet gelijk. Een laptop kan nieuwer zijn dan de testrun, en dan weigert die een wijziging die bij de developer wel werkt.
      tone: bad
  takeaway: Als iedereen met dezelfde tools werkt, kan een verschil in tools niet meer de oorzaak van een fout zijn.
  minutes: 2

problem:
  headline: Een rapport werkt bij één developer en loopt mis bij alle anderen
  story: |
    Elke developer installeert de tools met de hand, dus elke laptop is een beetje anders. Een nieuwe collega is de
    eerste dagen bezig met tools installeren en herstellen. Haar eerste [[voorstel]] werkt op haar laptop, maar de
    automatische [[testrun]] weigert het. Haar rapportbouwer is nieuwer dan die van de testrun. Niemand kan zeggen
    welke kant gelijk heeft zonder beide opstellingen met de hand te vergelijken.
  cost: Een nieuwe collega levert dagenlang niets op, en het team verliest een namiddag bij elk verschil in tools.
  visual:
    type: timeline
    days:
      - {label: "Ma 09:00", state: ok, note: "Een nieuwe collega start"}
      - {label: "Ma 17:00", state: warn, note: "Nog bezig met tools installeren"}
      - {label: "Di 17:00", state: warn, note: "De tools draaien eindelijk"}
      - {label: "Wo 10:00", state: bad, note: "Een wijziging werkt enkel op haar laptop"}
      - {label: "Wo 15:00", state: bad, note: "De testrun weigert ze"}
    marker: {after: 2, label: "Een nieuwere tool op één laptop"}
    caption: De tools verschillen van laptop tot laptop, en niemand merkt het tot een wijziging mislukt.

idea:
  headline: Iedereen start vanuit één toolbox
  points:
    - De toolbox is één ingepakte kopie van elke tool, en elke tool heeft één vaste versie.
    - Developers openen het project erin, dus een nieuwe collega heeft elke tool geïnstalleerd zonder iets te doen.
    - De automatische testrun en het package dat in productie draait, zijn op dezelfde basis gebouwd, dus de rapportbouwer en de databaseconnector komen overeen.
  visual:
    type: flow
    nodes:
      - {id: toolbox, label: Toolbox, state: fix, note: "Elke tool, één versie"}
      - {id: developer, label: Developer, state: ok, note: "Opent het project erin"}
      - {id: rehearsal, label: Automatische testrun, state: ok, note: "Start van dezelfde basis"}
      - {id: production, label: Productie, state: ok, note: "Dezelfde rapportbouwer en connector"}
    links: [[toolbox, developer], [toolbox, rehearsal], [toolbox, production]]
    caption: Een verschil in tools kan niet ontstaan, want er is maar één set.

code:
  - title: Elke developer opent het project in dezelfde toolbox
    file: .devcontainer/devcontainer.json
    file_label: De instellingen van de developertoolbox
    from: '"image": "dbt-singlestore-dev:1.11.11",'
    to: '"workspaceFolder"'
    max_lines: 12
    notes:
      - line: '"image"'
        says: Eén regel noemt de toolbox, met haar versienummer.
      - line: '"runArgs"'
        says: De toolbox sluit aan op het privénetwerk van de workshop, zodat ze de database van development bereikt.
      - line: '"workspaceFolder"'
        says: Het project verschijnt in de toolbox, klaar om in te werken.
  - title: Elke tool wordt één keer geïnstalleerd, bij het builden van de toolbox
    file: dev-image/Dockerfile
    file_label: Het recept van de developertoolbox
    from: "RUN --mount=type=bind,source=src/sqlfmt"
    to: "ln -s"
    max_lines: 12
    notes:
      - line: "python3 -m venv"
        says: Voor de developertools wordt een aparte plek gemaakt.
      - line: "pip install"
        says: De layoutrobot, de regelchecker en de checks voor het opslaan worden erin geïnstalleerd.
      - line: "ln -s"
        says: Elke tool wordt beschikbaar gemaakt voor iedereen die de toolbox opent.
  - title: De automatische testrun start van dezelfde basis
    file: .gitlab-ci.yml
    file_label: De instructies voor de automatische testrun
    from: "name: dbt-singlestore-base:1.11.11"
    to: "user: root"
    max_lines: 12
    notes:
      - line: "name: dbt-singlestore-base:1.11.11"
        says: De testrun start van het basispackage met de rapportbouwer en de connector.
      - line: "docker:"
        says: De testrun draait in een kopie van dat basispackage.
      - line: "user: root"
        says: De testrun heeft alleen binnen die kopie alle rechten.

demo:
  intro: >-
    Twee verse toolboxen worden geopend zoals twee nieuwe collega's dat op hun eerste ochtend zouden doen, en hun tools
    staan naast elkaar. Daarna wordt een toolbox vergeleken met het package dat in productie draait.
  setup: []
  steps:
    - id: open
      title: Twee verse toolboxen openen
      say: Twee nieuwe, lege toolboxen worden gestart, en elke tool in elk ervan meldt haar versie.
      button: Twee toolboxen openen
      inputs: []
      do:
        - {action: image.versions, image: toolbox, compare_with: toolbox, expect_same: [report_builder, connector, layout_robot, rule_checker, helper_tool, pre_save_checks]}
      show:
        - {type: result, from_action: image.versions, title: "De tools in twee verse toolboxen", caption: "Eén regel per tool, de eerste toolbox naast de tweede. Op elke regel staat hetzelfde."}
      outcome: Twee verse toolboxen bevatten dezelfde tools, en niemand installeerde iets met de hand.
    - id: compare
      title: Een toolbox vergelijken met productie
      say: Een toolbox wordt vergeleken met het package dat in productie draait.
      button: Vergelijken met productie
      inputs: []
      do:
        - {action: image.versions, image: toolbox, compare_with: production, expect_same: [report_builder, connector]}
      show:
        - {type: result, from_action: image.versions, title: "De toolbox naast productie", caption: "Productie heeft enkel de rapportbouwer en de databaseconnector nodig. De andere tools dienen om code te schrijven, dus ze zitten niet in het package."}
      outcome: De regels met "hetzelfde" zijn de tools die productie nodig heeft, en ze komen overeen met de toolbox. De andere tools bestaan enkel in de toolbox.
