id: E4_daily_load_during_release
layer: engineering
status: narrative
title: "Daily load runs during a release"
summary: "Two DAGs write the same tables at the same time unless dbt_release pauses the daily load."
focus: [airflow.daily_load, airflow.release]
detect: "dbt_release's pause step; overlapping dbt runs."
inject:
  narrative: "Someone triggers dbt_daily_load by hand while dbt_release is mid-flight."
  sim:
    airflow.daily_load: {health: warn, note: "triggered during release"}
    airflow.release: {health: warn, note: "paused daily load was triggered anyway"}
impact:
  - {node: db.prod, health: warn, note: "concurrent writers"}
steps:
  - title: "dbt_release pauses the daily load"
    explain: "The first task pauses dbt_daily_load, dbt_vdp and dbt_vdp_new and fails loudly if the pause fails. A manual trigger needs manual_run_override=true on purpose."
    code: "airflow dags pause dbt_daily_load"
    highlight: [airflow.daily_load, airflow.release]
  - title: "accumulated_state survives failures"
    explain: "Each release step merges its artifacts into accumulated_state; a re-run skips succeeded nodes. unpause_daily_load runs even when a step failed (all_done); cleanup only on success."
    code: "dbt build --state accumulated_state --exclude 'tag:on-demand result:success'"
    sim:
      airflow.daily_load: {health: ok, note: ""}
      airflow.release: {health: ok, note: ""}
      db.prod: {health: ok, note: ""}
