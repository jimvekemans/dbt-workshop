id: S7_web_customer_key
layer: sources
title: "Two teams, two definitions of customer_id"
summary: "The web-analytics team moves its customer_ref to the new web account - the person. The webapp team's customer_id is issued per order. The join between the two teams' data quietly stops matching."
star: true
focus: [channel.web, channel.webapp, dbt.mart_web_conversion]
detect: "assert_web_checkouts_attributed (critical): fewer than 90% of a month's checkouts match an order."
requires:
  - {action: check_sql, env: dev, statement: "SELECT COUNT(*) FROM raw_web_events WHERE visitor_id LIKE 'bot-%'", expect: 0, hint: "E8 left crawler traffic in the LDV landing table (the naive journeys model runs out of memory on it): press Reset first"}
  - {action: check_gitlab_file, ref: dev, path: models/im_dimensional/web/mart_web_conversion.sql, not_contains: "customer_unique_id", hint: "the fix is already in dev: press Reset first"}
inject:
  narrative: "The web shop gets a new login service. The web-analytics team now fills customer_ref with the web ACCOUNT id - a person. They did not rename the field, and to them nothing changed: it is still 'the customer'. But in Olist the webapp's customer_id is issued per ORDER; the person is customer_unique_id. Marketing's conversion mart joins the two on 'customer id'."
  sim:
    channel.web: {health: warn, note: "customer_ref = web account (person)", knobs.schema_variant: v2}
    dbt.mart_web_conversion: {health: fail, note: "34% of checkouts attributed"}
  live:
    - {action: set_channel, env: dev, channel: web, schema_variant: v2}
    - {action: trickle, env: dev, days: 7}
    - {action: airflow_trigger, env: dev, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
impact:
  - {node: exposure.marketing_nps_dashboard, health: fail, note: "conversion rate halves overnight"}
  - {node: consumer.marketing, health: warn, note: "asks why the campaign stopped converting"}
steps:
  - title: "Detect: the checkouts stop matching orders"
    explain: "Every logged-in checkout is followed by an order a moment later. assert_web_checkouts_attributed fails when fewer than 90% of a month's checkouts can be matched - people did not stop buying, the join broke. Without the test this is a 'campaign that stopped converting'."
    code: "dbt test --select assert_web_checkouts_attributed"
    zoom: platform
    highlight: [dbt.mart_web_conversion, exposure.marketing_nps_dashboard]
    expect: {node: dbt.mart_web_conversion, health: fail}
  - title: "Analyse: same name, two definitions"
    explain: "Both teams say 'customer id'. The webapp means one id per order (Olist customer_id), the web team now means the person (Olist customer_unique_id). The mart hashes customer_ref like the webapp's key (md5 = customer_hkey): v1 rows match, v2 rows never do. Joining on the person instead has its own trap: a person with two orders inside the attribution window fans out."
    code: |
      select e.customer_ref, c1.customer_id is not null as is_webshop_customer_id,
             c2.customer_unique_id is not null as is_person
      from stg_web_events e
      left join dim_olist_customers c1 on c1.customer_id = e.customer_ref
      left join (select distinct customer_unique_id from dim_olist_customers) c2 on c2.customer_unique_id = e.customer_ref
      where e.event_type = 'checkout' order by e.event_ts desc limit 10;
    zoom: sources
    highlight: [team.web, team.webapp, channel.web, channel.webapp]
  - title: "Fix: resolve to the one key both teams agree on"
    explain: "Resolve every customer_ref to customer_unique_id (look up the per-order id; the account id already is the person), join on that, and count distinct checkouts and orders. Write both definitions into the source contract (sources_web.yml) - that is where the next engineer looks. Bugfix branch -> MR -> dev."
    code: |
      coalesce(c.customer_unique_id, e.customer_ref) as customer_unique_id   -- v1: look up the person; v2: is the person
      ... on o.customer_unique_id = c.customer_unique_id and o.order_purchase_timestamp between ...
    zoom: platform
    highlight: [git.feature, git.dev, dbt.mart_web_conversion]
    sim:
      git.feature: {health: ok}
      dbt.mart_web_conversion: {health: warn, note: "fix merged, not rebuilt yet"}
    live:
      - {action: gitlab_branch, name: bugfix/web-customer-key, ref: dev}
      - {action: gitlab_commit_patch, patch: fix-web-customer-key, branch: bugfix/web-customer-key}
      - {action: gitlab_mr_merge, source: bugfix/web-customer-key, target: dev, patch: fix-web-customer-key, timeout: 900}
  - title: "Rebuild: one definition downstream"
    explain: "tag_dev + publish_dev_artifacts bring the fix to LDV; the next daily load attributes v1 and v2 checkouts alike. PRD gets it with the next release - in time, if the web team's switch is announced there."
    code: "airflow dags trigger dbt_daily_load --conf '{\"manual_run_override\": true}'"
    zoom: consumers
    highlight: [exposure.marketing_nps_dashboard, dbt.mart_web_conversion]
    sim:
      channel.web: {health: ok, note: "customer_ref v2 documented"}
      dbt.mart_web_conversion: {health: ok, note: ""}
      exposure.marketing_nps_dashboard: {health: ok, note: ""}
      consumer.marketing: {health: ok, note: ""}
    live:
      - {action: gitlab_pipeline_wait, tag_of: dev, expect: success, timeout: 900}
      - {action: airflow_trigger, env: dev, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
    # ok = dbt_build passed, including the critical assert_web_checkouts_attributed. (The mart stays 'warn' on the map
    # while the channel sends customer_ref v2: the map ripples a channel fault downstream.)
    expect: {node: airflow.daily_load, health: ok}
