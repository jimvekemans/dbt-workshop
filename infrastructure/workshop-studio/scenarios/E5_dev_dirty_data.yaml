id: E5_dev_dirty_data
layer: engineering
title: "Dirty data that only exists in DEV"
summary: "QA's smoke tests leave test orders in LDV. Tests written for PRD fail on them; filters written for DEV would slow PRD down. Dynamic test severity and model swapping keep each environment honest."
star: true
focus: [landing.raw_olist_orders, dbt.stg_olist_orders, db.dev]
detect: "Customer-id format and business-clock tests on raw_olist_orders warn in LDV (and would fail there with PRD rules)."
inject:
  narrative: "The QA team's nightly smoke test places 25 test orders in the DEV webshop - with QA test accounts ('qa-account-001') and stamped with the wall clock, years after the 2017 business clock. They land in analytics_dev like any order. PRD never sees them."
  sim:
    landing.raw_olist_orders: {health: warn, note: "LDV: 25 QA smoke-test orders"}
    db.dev: {health: warn, note: "QA test data"}
  live:
    - {action: sql, env: dev, statement: "CALL sp_qa_smoke_test(25)", undo: "CALL sp_qa_cleanup()"}
    - {action: airflow_trigger, env: dev, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
impact:
  - {node: airflow.daily_load, health: warn, note: "LDV: green with warnings"}
steps:
  - title: "Detect: warnings in LDV, not failures"
    explain: "Two source tests catch the QA orders: the customer-id format (32 hex characters) and 'no purchase after the business clock'. Their severity is an env-var switch in Jinja: warn in LDV/ABT, error in PRD/CBT, and DBT_SEVERITY_DEV_DATA overrides both. The project-wide default is a switch too: +severity: \"{{ env_var('DBT_TEST_SEVERITY', 'warn') }}\". (On dbt Fusion, --warn-error does not promote a warn-severity test: the severity decides.)"
    code: |
      # models/edw_dv_bdv/sources_olist.yml - LOCAL switch
      config:
        severity: "{{ env_var('DBT_SEVERITY_DEV_DATA', 'warn' if env_var('DBT_DEPLOY_TARGET', 'LDV') in ['LDV', 'ABT'] else 'error') }}"
        tags: [critical]
      # dbt_project.yml - GLOBAL switch
      data_tests:
        dbt_swf:
          +severity: "{{ env_var('DBT_TEST_SEVERITY', 'warn') }}"
    zoom: platform
    highlight: [landing.raw_olist_orders]
    expect: {node: landing.raw_olist_orders, health: warn}
  - title: "Model swap: the DEV variant filters, the PRD variant stays lean"
    explain: "Two models are named stg_olist_orders; exactly one is enabled per environment, so refs and the DAG never change. The DEV variant anti-joins the QA account registry - a table that exists in DEV only, read through a source that is disabled outside LDV/ABT. Put that filter in the shared model and PRD pays an extra join on every load for rows it never has, and refs a table it does not have."
    code: |
      -- models/edw_dv_bdv/dev_only/stg_olist_orders.sql   (LDV / ABT)
      {{ config(enabled=env_var('DBT_DEPLOY_TARGET', 'LDV') not in ['PRD', 'CBT'], ...) }}
      ... left join {{ source('qa', '_qa_test_accounts') }} qa on qa.account_id = r.customer_id
      where qa.account_id is null
      -- models/edw_dv_bdv/stg_olist_orders.sql            (PRD / CBT)
      {{ config(enabled=env_var('DBT_DEPLOY_TARGET', 'LDV') in ['PRD', 'CBT'], ...) }}
    zoom: platform
    highlight: [dbt.stg_olist_orders, landing.raw_olist_orders, db.dev]
    # the LDV load of the injection stayed green: QA orders filtered by the DEV variant, the source tests only warned
    expect: {node: airflow.daily_load, health: ok}
  - title: "What the PRD rules would do to LDV"
    explain: "Flip the local switch for LDV only (Airflow Variable dbt_env_vars, exported before every dbt task): the same tests now fail, dbt skips everything downstream, and the DEV pipeline stops on data that PRD never has."
    code: "airflow variables set dbt_env_vars '{\"DBT_SEVERITY_DEV_DATA\": \"error\"}'   # airflow-dev only"
    zoom: platform
    highlight: [airflow.levers, landing.raw_olist_orders, airflow.daily_load]
    sim:
      airflow.levers: {health: warn, note: "LDV dbt_env_vars={DBT_SEVERITY_DEV_DATA: error}"}
      landing.raw_olist_orders: {health: fail, note: "LDV: strict rules fail on QA orders"}
      airflow.daily_load: {health: fail, note: "LDV: dbt_build failed"}
    live:
      - {action: airflow_variable, env: dev, key: dbt_env_vars, value: {DBT_SEVERITY_DEV_DATA: error}}
      - {action: airflow_trigger, env: dev, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
    expect: {node: landing.raw_olist_orders, health: fail}
  - title: "Back to DEV rules - PRD stays strict"
    explain: "Delete the Variable. The PRD daily load runs the same tests with severity error, on data without QA orders: green. Each environment gets the rules that fit its data, from one code base."
    code: |
      airflow variables delete dbt_env_vars        # airflow-dev
      airflow dags trigger dbt_daily_load          # airflow-prod
    zoom: platform
    highlight: [airflow.levers, db.prod, landing.raw_olist_orders]
    sim:
      airflow.levers: {health: ok, note: "no lever set"}
      landing.raw_olist_orders: {health: ok, note: ""}
      airflow.daily_load: {health: ok, note: ""}
      db.dev: {health: ok, note: ""}
    live:
      - {action: airflow_variable, env: dev, key: dbt_env_vars, delete: true}
      - {action: airflow_trigger, env: prod, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
    expect: {node: landing.raw_olist_orders, health: ok}
