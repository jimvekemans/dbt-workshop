id: C2_marketing_new_metric
layer: consumers
status: narrative
title: "Marketing wants a new metric mid-sprint"
summary: "The request is small; the release cadence makes it slow. Shows the cost of a quarterly release."
focus: [consumer.marketing, team.domain_b, git.feature]
detect: "A request in the sprint, not a failure."
inject:
  narrative: "Marketing asks for 'NPS per state' on the dashboard for next week's campaign."
  sim:
    consumer.marketing: {health: warn, note: "needs NPS per state"}
impact:
  - {node: team.domain_b, health: warn, note: "unplanned work"}
steps:
  - title: "Scope negotiation"
    explain: "Can it be answered from the existing mart (customer_state is already on the fact)? Is it urgent enough to justify a hotfix release?"
    zoom: consumers
    highlight: [consumer.marketing, team.domain_b]
  - title: "Feature branch -> dev -> next quarterly release"
    explain: "LDV has it within days; PRD gets it with the next release/YYYY-Qx unless a hotfix release is agreed."
    code: "git checkout -b feature/nps-per-state origin/dev"
    highlight: [git.feature, git.dev, git.release]
    sim:
      git.feature: {health: ok}
      consumer.marketing: {health: ok, note: "in LDV now, PRD next quarter"}
      team.domain_b: {health: ok, note: ""}
