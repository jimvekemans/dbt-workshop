id: S2_webapp_contract_break
layer: sources
title: "Webapp contract break: new order_status"
summary: "The webshop ships contract v2: orders can now be 'fraud_hold'. Nobody told the data team."
focus: [channel.webapp, landing.raw_olist_orders]
detect: "accepted_values on raw_olist_orders.order_status fails in the daily load."
inject:
  narrative: "A webapp release introduces order_status = 'fraud_hold' for orders held by the fraud team. The source contract (v1) only allows processing | shipped | delivered."
  sim:
    channel.webapp: {health: warn, note: "contract v2 in production", knobs.schema_variant: v2}
    landing.raw_olist_orders: {health: fail, note: "accepted_values: fraud_hold"}
  live:
    - {action: set_channel, env: both, channel: webapp, schema_variant: v2}
    - {action: trickle, env: both, days: 7}
impact:
  - {node: dbt.stg_olist_orders, health: warn}
  - {node: dbt.fct_olist_orders, health: warn, note: "unknown status values"}
  - {node: exposure.management_kpi_forecast, health: warn}
  - {node: consumer.management, health: warn}
steps:
  - title: "Detect: accepted_values fails"
    explain: "The source test on order_status (severity error) fails in the daily load, before the unknown value reaches the fact."
    code: "dbt test --select source:raw_olist.raw_olist_orders"
    highlight: [landing.raw_olist_orders]
    expect: {node: landing.raw_olist_orders, health: fail}
  - title: "Data-contract conversation with the webapp team"
    explain: "Agree what fraud_hold means for reporting (treat as processing? exclude from revenue?) and version the contract. This is a people problem first, a code problem second."
    zoom: sources
    highlight: [team.webapp, team.platform]
  - title: "Feature branch: accept the new value and map it"
    explain: "Update the accepted_values test (and mapping) on a bugfix branch, verify with the MR, release with the next release."
    code: "values: [processing, shipped, delivered, fraud_hold]"
    highlight: [git.feature, git.dev]
    sim:
      git.feature: {health: ok}
      landing.raw_olist_orders: {health: warn, note: "contract v2 accepted, awaiting release"}
    live:
      - {action: gitlab_branch, name: bugfix/webapp-contract-v2, ref: dev}
      - {action: gitlab_commit_patch, patch: fix-webapp-contract-v2, branch: bugfix/webapp-contract-v2}
      - {action: gitlab_mr_merge, source: bugfix/webapp-contract-v2, target: dev, patch: fix-webapp-contract-v2, timeout: 900}
  - title: "Next release carries the contract change"
    explain: "Until PRD runs the new contract version the source test keeps failing there - the cost of a quarterly cadence."
    zoom: platform
    sim:
      channel.webapp: {health: ok, note: ""}
      landing.raw_olist_orders: {health: ok, note: ""}
      dbt.stg_olist_orders: {health: ok}
      dbt.fct_olist_orders: {health: ok, note: ""}
      exposure.management_kpi_forecast: {health: ok}
      consumer.management: {health: ok}
