id: house-rules
group: changes
title: Slordige of risicovolle code wordt geweigerd bij het opslaan
promise: Een robot kuist alle code op en weigert gekende slechte gewoontes, zodat reviewers zich op de inhoud richten.
minutes: 2
feature: "Huisregels gecontroleerd voor het opslaan"
status: today
tech: ["pre-commit", "sqlfmt", "dbt-bouncer"]
environment: dev

problem:
  headline: Eén verboden gewoonte glipt door de review en laat een rapport leeg
  story: |
    Elke developer schrijft code in zijn eigen opmaak. Reviewers verliezen tijd met discussies over spaties en
    hoofdletters en missen het echte probleem: één developer gebruikte een datumfunctie die maanden anders schrijft op
    onze [[database]]. Het maandrapport toont lege maanden, en niemand merkt het tot finance vraagt waar oktober blijft.
  cost: Finance werkt met een maandrapport met lege maanden, en reviewers verliezen uren aan opmaak in plaats van inhoud.
  visual:
    type: flow
    nodes:
      - {id: dev, label: "Code van de developer", state: warn, note: "Eigen opmaak, eigen gewoontes"}
      - {id: review, label: "Review door mensen", state: warn, note: "Bezig met opmaak"}
      - {id: report, label: "Maandrapport", state: bad, note: "Lege maanden"}
      - {id: finance, label: "Finance", state: bad, note: "Waar is oktober?"}
    links: [[dev, review], [review, report], [report, finance]]
    caption: De fout is oud en gekend, maar niets houdt ze tegen.

idea:
  headline: Een robot controleert alle code op het moment dat ze opgeslagen wordt
  points:
    - Ze schrijft de code om naar één standaardopmaak, zodat het werk van iedereen er hetzelfde uitziet.
    - Ze weigert code die een regel van het team overtreedt, en zegt welke regel overtreden werd.
    - Reviewers zien enkel nette code die de regels volgt, en besteden hun tijd aan wat de code betekent.
  visual:
    type: flow
    nodes:
      - {id: save, label: Developer slaat code op, state: ok, note: "Op de computer van de developer"}
      - {id: robot, label: De robot, state: fix, note: "Kuist op, controleert, weigert"}
      - {id: saved, label: Opgeslagen code, state: ok, note: "Enkel nette, toegelaten code"}
    links: [[save, robot], [robot, saved]]
    caption: De regels staan één keer neergeschreven en gelden voor iedereen.

code:
  - title: De robot die de opmaak opkuist
    file: .pre-commit-config.yaml
    file_label: De checks die bij elke keer opslaan lopen
    from: "id: sqlfmt"
    to: "require_serial: true"
    max_lines: 12
    notes:
      - line: "id: sqlfmt"
        says: Deze check schrijft de code om naar de standaardopmaak.
      - line: "entry: bash -c 'sqlfmt"
        says: Ze kuist de code eerst op en houdt dan de opgekuiste versie.
  - title: De robot die verboden gewoontes weigert
    file: .pre-commit-config.yaml
    file_label: De checks die bij elke keer opslaan lopen
    from: "id: dbt-bouncer"
    to: "pass_filenames: false"
    max_lines: 12
    notes:
      - line: "id: dbt-bouncer"
        says: De robot weigert code die de regels van het team overtreedt.
      - line: "entry: dbt-bouncer"
        says: Ze leest de regels van het team uit één bestand en controleert alle code.
  - title: De lijst verboden gewoontes van het team
    file: dbt-bouncer.yml
    file_label: De regels van het team, één keer neergeschreven
    from: "manifest_checks:"
    to: 'description: "Model uses str_to_date: see the dbt style guide"'
    max_lines: 12
    notes:
      - line: "check_model_has_semi_colon"
        says: Een puntkomma op het einde van de code wordt geweigerd.
      - line: '\bto_char'
        says: Twee datumfuncties zijn verboden; de eerste schrijft maanden anders op onze database.
      - line: 'description: "Model uses to_char'
        says: De melding vertelt de developer welke regel overtreden werd.

demo:
  intro: Een developer slaat nieuwe code op. De robot kuist ze op en weigert de eerste versie, en laat daarna de verbeterde door.
  setup: []
  steps:
    - id: refused
      title: Slordige code opslaan
      say: |
        De code heeft een rommelige opmaak, een verboden datumfunctie en een puntkomma op het einde. De robot kuist de
        opmaak zelf op en weigert de andere twee.
      button: De slordige code opslaan
      inputs: []
      do:
        - {action: precommit.run, patch: house-sloppy-model, expect: refused}
      show:
        - {type: result, title: "Wat de robot zegt", caption: "Elke regel is een regel van het team die de code overtrad. De robot kuiste ook de opmaak zelf op, daar is geen actie voor nodig."}
      outcome: "De robot kuiste de opmaak op en weigerde de wijziging om 2 redenen: een puntkomma op het einde van de code en een verboden datumfunctie."
    - id: accepted
      title: De verbeterde code opslaan
      say: De verbeterde versie heeft de standaardopmaak en gebruikt de toegelaten datumfunctie, dus de robot heeft niets te weigeren.
      button: De verbeterde code opslaan
      inputs: []
      do:
        - {action: precommit.run, patch: house-tidy-model, expect: ok}
      show:
        - {type: result, before_of: refused, title: "Wat de robot zegt", caption: "Niets wordt geweigerd: beide eerdere problemen zijn weg (geen puntkomma op het einde, de toegelaten datumfunctie)."}
      outcome: De robot heeft niets te weigeren, dus de verbeterde code kan opgeslagen worden.
