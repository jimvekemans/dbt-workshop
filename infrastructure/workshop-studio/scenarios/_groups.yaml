- id: sources
  title: When the data changes
  blurb: The shop depends on feeds sent by other teams and companies. A feed can change format, arrive late or arrive broken.
  scenarios:
    - switchover-date
    - late-delivery
    - skip-one-table
    - strict-where-it-matters
- id: changes
  title: When the code changes
  blurb: Every change to the reports is rehearsed, checked and kept tidy before it can reach anyone.
  scenarios:
    - same-toolbox
    - own-workbench
    - house-rules
    - checked-before-merge
    - only-what-changed
- id: releases
  title: When we release
  blurb: New versions reach the shop in a fixed order, can be pulled back in seconds and cannot be changed in secret.
  scenarios:
    - numbered-versions
    - back-in-seconds
    - docs-match-version
    - one-team-not-ready
    - production-waits
    - no-secret-fixes
    - right-keys-only
- id: daily
  title: Every day
  blurb: The nightly load runs on its own. When it fails, people get one clear mail and a fast way back.
  scenarios:
    - one-clear-mail
    - redo-only-what-failed
    - rebuild-without-downtime
    - every-run-on-record
