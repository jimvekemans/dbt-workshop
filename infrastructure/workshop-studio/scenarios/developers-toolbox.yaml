    - id: rule
      title: Test of een huisregel echt weigert
      feature: Bewijs dat elke huisregel echt weigert
      status: next
      why: "Een regel met een spelfout beschermt niemand, dus een verboden gewoonte kan ongemerkt in de rapporten belanden."
      tech: "check_model_code_does_not_contain_regexp_pattern"
      reality: "Het verbod op één datumfunctie stond 97 dagen met een tikfout in de huisregels, dus het weigerde niets. Toen de fout hersteld werd, gebruikten drie tabellen die functie nog."
      quiz:
        situation: "De stijlgids van het team verbiedt één manier om datums te schrijven, en een automatische check moet code met die gewoonte weigeren. Iemand schrijft die regel met een spelfout."
        question: "Hoe weet het team dat een huisregel echt weigert?"
        options:
          - label: "Erop vertrouwen dat de regel er goed uitziet"
            impact: "Zo gaat het vandaag: een regel met een spelfout ziet er goed uit maar beschermt niemand, dus de verboden gewoonte kan in de rapporten belanden."
            tone: bad
          - label: "Een collega laten nalezen bij elke wijziging aan de regels"
            impact: "Een nalezer kan een spelfout zien, maar niemand bewijst dat de regel echt weigert, en het blijft werk van mensen."
            tone: warn
          - label: "Een test die mislukt zodra een regel de code niet weigert"
            impact: "Een regel met een spelfout laat de test mislukken, dus elke regel beschermt echt. Dit heeft het platform nog niet: het is de volgende stap."
            tone: good
            platform: true
        takeaway: "Een regel die nooit weigert, voelt veilig en beschermt niemand: bewijs dat ze werkt."
        minutes: 3
      say: "De stijlgids van het team verbiedt één manier om datums te schrijven. Dezelfde code, die dat toch doet, wordt twee keer bewaard: eerst met een spelfout in de regel, dan met de regel correct geschreven."
      button: Bewaar de code met beide regels
      inputs: []
      do:
        - id: typo
          action: precommit.run
          patch: toolbox-rule-typo
          expect: ok
        - id: right
          action: precommit.run
          patch: toolbox-rule-works
          expect: refused
      show:
        - {type: result, from_action: typo, title: "De regel met een spelfout", caption: "Kijk naar de zin: de automatische check laat de code door, hoewel de verboden manier om datums te schrijven gebruikt wordt."}
        - {type: result, from_action: right, title: "De regel zoals ze hoort", caption: "Kijk naar de regel onder de zin: dezelfde code wordt nu geweigerd, en de regel wordt genoemd."}
      outcome: Een regel met een spelfout ziet er goed uit maar beschermt niemand, en een verboden gewoonte kan dus nog in de rapporten belanden. De volgende stap is een test die mislukt zodra een regel de code niet weigert die ze moet stoppen.
