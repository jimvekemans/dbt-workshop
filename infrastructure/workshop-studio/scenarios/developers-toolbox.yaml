id: developers-toolbox
kind: flow
group: flows
title: "De toolbox van de developer: een vangnet per vergissing"
promise: Elke developer werkt in één toolbox die veelgemaakte vergissingen stopt op het moment dat ze gebeuren.
minutes: 14
tech: ["dbt wrapper (vdp)", "select guard", "profiles.yml env_var", "Vault AppRole", "vdp sources", ".vscode/tasks.json", "dbt-bouncer"]
environment: dev
related:
  - id: same-toolbox
    why: Dat scenario toont dat elke developer dezelfde tools krijgt. Dit scenario toont de vangnetten die erbij horen.
  - id: house-rules
    why: Dat scenario toont de robot die verboden gewoontes weigert. Eén stap hier test of zo'n regel echt werkt.

problem:
  headline: Kleine, bekende vergissingen kosten het team tijd en vertrouwen
  story: |
    Sam heeft haast. Hij vraagt om een build, vergeet te zeggen welke [[tabel]], en alles wordt opnieuw gebuild terwijl hij
    wacht. Later bewaart hij zijn wachtwoord in een instellingenbestand, en dat bestand zwerft rond op zijn laptop. Er komt
    een nieuwe [[feed]] binnen en hij beschrijft ze met de hand; één kolomnaam bevat een typefout, waardoor midden in de
    ochtend een [[check]] mislukt. Elke vergissing is klein, bekend en duur, en niets in zijn manier van werken houdt ze tegen.
  cost: "Elke vergissing kost iemand tijd of vertrouwen: een lange wachttijd, een wachtwoord dat iedereen kan lezen, of een mislukte check op het slechtste moment."
  visual:
    type: flow
    nodes:
      - {id: dev, label: Developer met haast, state: warn, note: "Typt het commando uit het hoofd"}
      - {id: slip, label: Een kleine vergissing, state: warn, note: "Niets houdt ze tegen"}
      - {id: harm, label: "Wachttijd, lek of mislukking", state: bad, note: "Later gevonden, door iemand anders"}
      - {id: team, label: Het team, state: bad, note: "Verliest tijd of vertrouwen"}
    links: [[dev, slip], [slip, harm], [harm, team]]
    caption: Elke vergissing is snel gemaakt, en de schade zie je pas ver van de plek waar ze ontstond.

idea:
  headline: Elke veelgemaakte vergissing heeft haar eigen vangnet in de toolbox
  points:
    - De toolbox is één verpakte set tools, zodat elke developer dezelfde vangnetten krijgt zonder iets te installeren.
    - Elk vangnet stopt één bepaalde vergissing op het moment dat ze gebeurt, en zegt in gewone woorden wat er misging.
    - De vangnetten staan los van elkaar, zodat een team ze één voor één kan invoeren en het voordeel van elk afzonderlijk ziet.
  visual:
    type: flow
    nodes:
      - {id: dev, label: Developer, state: ok, note: "Werkt zoals altijd"}
      - {id: toolbox, label: Toolbox met vangnetten, state: fix, note: "Elk let op één vergissing"}
      - {id: stop, label: De vergissing wordt gestopt, state: ok, note: "Met een duidelijke boodschap"}
      - {id: work, label: Het werk gaat veilig voort, state: ok, note: "Het team verliest geen tijd"}
    links: [[dev, toolbox], [toolbox, stop], [stop, work]]
    caption: Het vangnet staat waar de vergissing gebeurt, niet in een nazicht achteraf.

code:
  - title: De toolbox zet een guard voor de echte engine
    status: today
    file: dev-image/Dockerfile
    file_label: Het recept van de toolbox van de developer
    from: "mv /usr/local/bin/dbt /usr/local/libexec/dbt/dbt;"
    to: "ln -s vdp /usr/local/bin/dbt; fi; \\"
    max_lines: 12
    notes:
      - line: "mv /usr/local/bin/dbt"
        says: De echte engine wordt aan de kant gezet.
      - line: "ln -s vdp /usr/local/bin/dbt"
        says: De naam die iedereen typt, leidt nu naar de guard, die het commando eerst nakijkt.
  - title: Het verbindingsbestand noemt geen enkele developer
    status: today
    file: profiles.yml
    file_label: Het verbindingsbestand voor alle developers en robots
    from: "default:"
    to: "user:"
    max_lines: 6
    notes:
      - line: "host:"
        says: Naar welke server er verbonden wordt, komt uit de instellingen van wie het commando runt.
      - line: "user:"
        says: Wie er verbindt, komt ook uit die instellingen, dus één bestand dient elke developer en [[robot]].
  - title: Het wachtwoord komt uit een afgesloten kast, niet uit een bestand
    status: next
    file: vdp.toml
    file_label: De toolbox-instellingen van het project
    from: 'vault_mount = "kv-workshop"'
    to: "precedence ="
    max_lines: 6
    notes:
      - line: "vault_mount"
        says: Dit is de plek in de [[vault]] waar de wachtwoorden bewaard worden.
      - line: "precedence ="
        says: De toolbox vraagt het eerst aan de vault, en kijkt pas daarna in bestanden.
  - title: Waar de beschrijving van een nieuwe feed geschreven wordt
    status: today
    file: vdp.toml
    file_label: De toolbox-instellingen van het project
    from: "[sources]"
    to: 'databases = ["dev_landing"'
    max_lines: 6
    notes:
      - line: "[sources]"
        says: Deze sectie vertelt de toolbox welke delen van de [[database]] feeds bevatten.
      - line: "databases ="
        says: Het commando leest daar de echte tabellen en schrijft de beschrijving daaruit.
  - title: De editorknop die feedbeschrijvingen bijwerkt
    status: today
    file: .vscode/tasks.json
    file_label: De knoppen van de editor
    from: '"label": "vdp: update source files",'
    to: '"command": "vdp sources rewrite",'
    max_lines: 6
    notes:
      - line: '"label": "vdp: update source files"'
        says: Dit is de naam van de knop waarop een developer in de editor klikt.
      - line: '"command": "vdp sources rewrite"'
        says: De knop runt één commando, hetzelfde dat een developer ook zelf kan typen.
  - title: De editorknop die enkel buildt wat veranderd is
    status: today
    file: .vscode/tasks.json
    file_label: De knoppen van de editor
    from: '"label": "Build modified",'
    to: '"command": "DBT_DEPLOY_TARGET=dev dbt build'
    max_lines: 6
    notes:
      - line: '"label": "Build modified"'
        says: Een tweede knop, met een naam die zegt wat hij doet.
      - line: "state:modified"
        says: Hij buildt enkel de tabellen die afwijken van de gedeelde kopie, en leent de rest.
  - title: De regel van het team tegen één verboden datumfunctie
    status: next
    file: dbt-bouncer.yml
    file_label: De regels van het team, één keer opgeschreven
    from: "name: check_model_hard_coded_references"
    to: 'description: "Model uses str_to_date'
    max_lines: 12
    notes:
      - line: '\bstr_to_date'
        says: De regel is een tekstpatroon dat de verboden functie en haar openingshaakje vindt.
      - line: 'description: "Model uses str_to_date'
        says: De boodschap vertelt de developer welke regel overtreden werd.

demo:
  intro: >-
    Zeven vangnetten van de toolbox komen na elkaar aan bod, elk tegen de vergissing die het moet stoppen. Zes zijn
    vandaag al in gebruik. Het laatste, een test van de regels zelf, is een volgende stap: het liep hier al, maar het platform heeft het nog niet.
  setup: []
  steps:
    - id: guard
      title: Per vergissing alles laten builden
      feature: Een guard die een build zonder keuze weigert
      status: today
      tech: "dbt wrapper: select enforcement"
      quiz:
        situation: "Een developer heeft haast en vraagt om een build, maar vergeet te zeggen welke tabel. Het project telt een hele reeks tabellen, en de developer zit te wachten op het resultaat."
        question: "Wat doe je met een build zonder gekozen tabel?"
        options:
          - label: "Alles builden, want het commando was duidelijk genoeg"
            impact: "De build slaagt altijd, maar de developer wacht op een hele reeks tabellen die niemand wilde."
            tone: bad
          - label: "De build weigeren tot de developer een tabel kiest"
            impact: "Het commando stopt meteen en er wordt niets gebuild. De developer typt het opnieuw, nu met een tabel."
            tone: good
            platform: true
        takeaway: "Een vergeten keuze mag niets kosten: het vangnet stopt het commando voor het begint."
        minutes: 1
      say: Developer één vraagt om een build en vergeet een tabel te kiezen. Hetzelfde commando loopt eerst zonder guard, en dan via de toolbox.
      button: Run het commando op beide manieren
      inputs: []
      do:
        - id: unguarded
          action: toolbox.run
          as: "developer:pu_dev1"
          commands:
            - run: /usr/local/libexec/dbt/dbt build --target default
              say: Zonder guard werden {tables} gebuild in {time}.
        - id: guarded
          action: toolbox.run
          as: "developer:pu_dev1"
          commands:
            - run: dbt build
              expect: refused
              say: Met de guard werd het commando meteen geweigerd en werd niets gebuild.
      show:
        - {type: result, from_action: unguarded, title: "Zonder de guard", caption: "Kijk naar de eerste regel: alles werd gebuild, hoewel niemand een tabel koos."}
        - type: number
          title: "Tabellen in de eigen kopieën van developer één"
          caption: "Die bleven achter door het eerste commando. Het tweede commando voegde er geen toe."
          query: "select count(*) from information_schema.tables where table_name like 'pu\\_dev1\\_%'"
          unit: tabellen
        - {type: result, from_action: guarded, title: "Met de guard", caption: "Kijk naar de eerste regel: het commando werd geweigerd en er werd niets gebuild."}
      outcome: Hetzelfde vergeetachtige commando buildde zonder de guard een hele reeks tabellen opnieuw, en de developer moest op allemaal wachten. Met de guard werd het meteen geweigerd en werd niets gebuild.
    - id: settings
      title: Twee developers, één verbindingsbestand
      feature: Eén gedeeld verbindingsbestand voor elke developer
      status: today
      tech: "profiles.yml env_var()"
      quiz:
        situation: "Twee developers werken in hetzelfde project en verbinden met dezelfde database. Elk heeft een eigen login, en de database moet kunnen zien wie van de twee bezig is."
        question: "Hoe krijgt elke developer zijn verbinding?"
        options:
          - label: "Eén gedeeld bestand dat de login pas bij de developer zelf ophaalt"
            impact: "Eén bestand volstaat voor iedereen, niemand houdt een kopie met wachtwoord bij, en de database weet toch wie verbonden is."
            tone: good
            platform: true
          - label: "Elke developer houdt een eigen kopie van het bestand bij"
            impact: "Het werkt, maar elke kopie bevat een wachtwoord en moet bijgehouden worden. Zo kan de login van een collega lekken."
            tone: warn
          - label: "Eén gedeeld bestand met één gezamenlijke login voor het team"
            impact: "Niemand houdt een kopie bij, maar de database ziet enkel nog de gezamenlijke login en niet meer wie ervan bezig is."
            tone: warn
        takeaway: "Eén bestand voor iedereen kan, zolang de login van elke developer apart blijft."
        minutes: 2
      say: Developer één en developer twee runnen dezelfde twee commando's in hetzelfde project. Het verbindingsbestand noemt geen developer en bevat geen wachtwoord. Zo lekt de login van een collega niet, en hoeft niemand een persoonlijke kopie bij te houden.
      button: Run de commando's als beide developers
      inputs: []
      do:
        - id: first
          action: toolbox.run
          as: "developer:pu_dev1"
          commands: &who
            - run: grep -c -E 'pu_dev|Workshop[P]wd' profiles.yml || true
              say: "Regels in het verbindingsbestand die een developer noemen of het wachtwoord van een developer bevatten: {last}."
            - run: |
                printf 'select current_user() as account;\n' > /tmp/who.sql
                vdp sql run /tmp/who.sql
              must_contain: ["{account}"]
              say: De database zag {user} verbinden.
        - id: second
          action: toolbox.run
          as: "developer:pu_dev2"
          commands: *who
      show:
        - {type: result, from_action: first, title: "Developer één", caption: "Kijk naar de tweede regel: de database zag developer één."}
        - {type: result, from_action: second, title: "Developer twee", caption: "Kijk naar de tweede regel: hetzelfde bestand, en de database zag developer twee."}
      outcome: Eén gedeeld bestand volstond voor beide developers, zonder persoonlijke kopie met een wachtwoord, en de database wist toch wie van hen verbonden was.
    - id: vault
      title: Hou het wachtwoord uit elk bestand
      feature: Wachtwoorden in een vault, niet in bestanden
      status: next
      why: "Zonder vault staat het wachtwoord van elke developer als leesbare tekst in een bestand op zijn laptop."
      tech: "Vault AppRole (KEYVAULT_ROLE_ID, KEYVAULT_SECRET_ID)"
      reality: "Vandaag typt elke developer zijn wachtwoord één keer in bij het opstarten van de toolbox. Het wordt bewaard in een bestand op de eigen laptop, dat niet bij de gedeelde code terechtkomt."
      quiz:
        situation: "Een developer verbindt met de database en heeft daarvoor een wachtwoord nodig. Het bestand met de verbindingsinstellingen staat op zijn laptop, en dat bestand zwerft rond."
        question: "Waar bewaar je het wachtwoord van de developer?"
        options:
          - label: "In het instellingenbestand zelf, zodat verbinden altijd werkt"
            impact: "Verbinden werkt, maar het wachtwoord staat leesbaar in een bestand dat iedereen kan lezen die het krijgt."
            tone: bad
          - label: "In de vault, met enkel een verwijzing in het bestand"
            impact: "Het bestand bevat geen wachtwoord meer en blijft veilig rondzwerven. Het wachtwoord wordt opgehaald op het moment van verbinden. Dit heeft het platform nog niet."
            tone: good
            platform: true
          - label: "In het bestand, maar enkel leesbaar voor de developer zelf"
            impact: "Zo gaat het vandaag: het wachtwoord gaat niet mee de code in, maar blijft leesbare tekst op de laptop, en elke kopie van het bestand neemt het mee."
            tone: warn
        takeaway: "Een wachtwoord hoort in een afgesloten kast, niet in een bestand dat kan rondzwerven."
        minutes: 2
      say: Developer één verbindt twee keer. Eerst met het wachtwoord in een instellingenbestand, dat leesbaar is voor iedereen die het bestand krijgt, daarna met enkel een verwijzing naar de [[vault]].
      button: Verbind op beide manieren
      inputs: []
      do:
        - id: infile
          action: toolbox.run
          as: "developer:pu_dev1"
          auth: file
          commands:
            - run: grep -c '^SINGLESTORE_PASS=.' .devcontainer/.env || true
              say: "Regels in het instellingenbestand die het wachtwoord in leesbare tekst bevatten: {last}."
            - run: vdp env show 2>&1 | grep SINGLESTORE_PASS
              must_contain: [".devcontainer/.env"]
              say: De toolbox las het wachtwoord uit dat bestand.
            - run: |
                printf 'select current_user() as account;\n' > /tmp/who.sql
                vdp sql run /tmp/who.sql
              must_contain: ["{account}"]
              say: De database aanvaardde de login.
        - id: invault
          action: toolbox.run
          as: "developer:pu_dev1"
          auth: vault
          commands:
            - run: grep -c '^SINGLESTORE_PASS=.' .devcontainer/.env || true
              say: "Regels in het instellingenbestand die het wachtwoord in leesbare tekst bevatten: {last}."
            - run: vdp env show 2>&1 | grep SINGLESTORE_PASS
              must_contain: ["from vault"]
              say: De toolbox haalde het wachtwoord uit de vault op toen het commando startte.
            - run: |
                printf 'select current_user() as account;\n' > /tmp/who.sql
                vdp sql run /tmp/who.sql
              must_contain: ["{account}"]
              say: De database aanvaardde de login.
      show:
        - {type: result, from_action: infile, title: "Wachtwoord in een instellingenbestand", caption: "Kijk naar de eerste regel: het wachtwoord staat in leesbare tekst, in een bestand op de laptop."}
        - {type: result, from_action: invault, title: "Wachtwoord in de vault", caption: "Kijk naar de eerste regel: het bestand bevat geen wachtwoord. De tweede regel zegt waar het vandaan kwam."}
      outcome: Beide manieren verbonden, maar slechts één liet een leesbaar wachtwoord achter op de laptop.
    - id: feed
      title: Een nieuwe feed registreren met één commando
      feature: Nieuwe feeds automatisch beschreven
      status: today
      tech: "vdp sources add"
      reality: "Het bestand dat de feeds beschrijft, is de plek waar het vaakst iets hersteld moest worden: 26 keer. Eén vergeten regel is genoeg om een run te laten mislukken."
      quiz:
        situation: "Er komt een nieuwe feed binnen. Haar kolommen staan nergens in het project, dus er kan geen enkele check op draaien zolang niemand ze beschrijft."
        question: "Hoe komt de beschrijving van de kolommen in het project?"
        options:
          - label: "Een developer typt de lijst met de hand"
            impact: "Het werkt, maar één verkeerd gespelde kolomnaam stopt later een check, mogelijk midden in de ochtend."
            tone: warn
          - label: "Wachten met beschrijven tot er een check nodig is"
            impact: "Tot dan draait er geen enkele check op de feed, dus een fout in de feed valt niemand op."
            tone: warn
          - label: "De lijst laten schrijven door een commando dat de tabel zelf uitleest"
            impact: "De kolommen komen uit de tabel zelf, dus er kan er geen verkeerd gespeld zijn."
            tone: good
            platform: true
        takeaway: "Laat de tabel haar eigen kolommen opsommen: een machine typt geen spelfouten."
        minutes: 2
      say: Er komt een nieuwe feed binnen, maar haar kolommen staan nergens in het project, dus er kan geen enkele check op draaien. Een developer schrijft die lijst eerst met de hand, en laat ze daarna door de toolbox schrijven.
      button: Beschrijf de feed op beide manieren
      inputs: []
      do:
        - action: sql.exec
          statement: "drop table if exists {{ db('landing') }}.raw_olist_returns"
          undo: "drop table if exists {{ db('landing') }}.raw_olist_returns"
        - action: sql.exec
          statement: "create table {{ db('landing') }}.raw_olist_returns (return_id varchar(40) not null, order_id varchar(40), return_reason varchar(100), returned_at datetime, _ingested_at datetime default now())"
          undo: "drop table if exists {{ db('landing') }}.raw_olist_returns"
        - id: byhand
          action: toolbox.run
          as: "developer:pu_dev1"
          commands:
            - run: |
                mkdir -p models/sources
                cat > models/sources/sources_returns.yml <<'Y'
                version: 2
                sources:
                  - name: returns
                    database: dev_landing
                    schema: dev_landing
                    tables:
                      - name: raw_olist_returns
                        columns:
                          - name: return_id
                          - name: order_id
                            data_tests: [not_null]
                          - name: retrun_id
                            data_tests: [not_null]
                Y
                dbt test -s source:returns
              expect: failed
              say:
                - "Met de hand geschreven stopte de check met {errors}."
                - Een kolomnaam in de beschrijving is verkeerd gespeld, dus de check erop kan niet draaien.
        - id: bycommand
          action: toolbox.run
          as: "developer:pu_dev1"
          commands:
            - run: vdp sources add dev_landing.raw_olist_returns
              changes: true
              say: Het commando beschreef {new_feeds} met {columns_added}, gelezen uit de tabel zelf.
            - run: dbt parse
              say: Het project leest de nieuwe beschrijving zonder problemen.
      show:
        - {type: result, from_action: byhand, title: "Met de hand beschreven", caption: "Kijk naar de tweede regel: één verkeerd gespelde kolomnaam, en de check stopte."}
        - {type: result, from_action: bycommand, title: "Beschreven door het commando", caption: "Kijk naar de regels onder de eerste: de kolommen komen uit de tabel zelf, dus er kan er geen verkeerd gespeld zijn."}
      outcome: De met de hand geschreven beschrijving stopte een check door één verkeerd gespelde naam, en dat kan op het slechtste moment gebeuren. Die van het commando klopte met de tabel.
    - id: update
      title: Er komt een kolom bij in een feed
      feature: Feedbeschrijvingen volgen wijzigingen aan de bron
      status: today
      tech: "vdp sources rewrite"
      quiz:
        situation: "Het team dat de retourenfeed stuurt, voegt een kolom toe. De beschrijving van die feed in het project kent de nieuwe kolom nog niet."
        question: "Wat doe je met de beschrijving van de feed?"
        options:
          - label: "Ze laten bijwerken door een commando dat de bron nakijkt"
            impact: "Eén commando brengt ze op punt: ze noemt elke kolom van de tabel, dus de checks kunnen de nieuwe kolom afdekken."
            tone: good
            platform: true
          - label: "Ze aanpassen wanneer iemand merkt dat er een kolom bij is"
            impact: "Zolang weet het project niet dat de kolom bestaat, dus geen enkele check dekt ze af."
            tone: warn
          - label: "Alle kolommen van de feed opnieuw met de hand beschrijven"
            impact: "De beschrijving kan kloppen, maar het is veel werk en bij elke kolomnaam is er kans op een spelfout."
            tone: warn
        takeaway: "Een beschrijving die de bron niet volgt, laat nieuwe kolommen ongecontroleerd."
        minutes: 2
      say: Het team dat de retourenfeed stuurt, voegt een kolom toe, en de beschrijving in het project kent ze nog niet. Eén commando werkt ze bij.
      button: Voeg de kolom toe en werk bij
      inputs: []
      do:
        - action: sql.exec
          statement: "drop table if exists {{ db('landing') }}.raw_olist_returns"
          undo: "drop table if exists {{ db('landing') }}.raw_olist_returns"
        - action: sql.exec
          statement: "create table {{ db('landing') }}.raw_olist_returns (return_id varchar(40) not null, order_id varchar(40), return_reason varchar(100), returned_at datetime, _ingested_at datetime default now())"
          undo: "drop table if exists {{ db('landing') }}.raw_olist_returns"
        - action: sql.exec
          statement: "alter table {{ db('landing') }}.raw_olist_returns add column return_channel varchar(20)"
          undo: "drop table if exists {{ db('landing') }}.raw_olist_returns"
        - action: toolbox.run
          as: "developer:pu_dev1"
          commands:
            - run: |
                mkdir -p models/sources
                cat > models/sources/sources_landing.yml <<'Y'
                version: 2
                sources:
                  - name: landing
                    database: dev_landing
                    schema: dev_landing
                    tables:
                      - name: raw_olist_returns
                        columns:
                          - name: order_id
                          - name: return_id
                          - name: return_reason
                          - name: returned_at
                          - name: _ingested_at
                Y
                printf 'select return_id, order_id from \x7b\x7b source("landing", "raw_olist_returns") \x7d\x7d\n' > models/edw_dv_bdv/stg_olist_returns.sql
            - run: vdp sources rewrite
              changes: true
              say: Voor de update noemde de beschrijving {columns_before}; nu noemt ze {columns_after}.
      show:
        - type: table
          title: "De kolommen die de tabel nu heeft"
          caption: "De nieuwe kolom van de afzender staat als laatste in de lijst."
          query: "select ordinal_position as position, case column_name when 'return_id' then 'Retournummer' when 'order_id' then 'Bestelnummer' when 'return_reason' then 'Retourreden' when 'returned_at' then 'Retourtijd' when '_ingested_at' then 'Aankomsttijd' when 'return_channel' then 'Retourkanaal' else column_name end as name from information_schema.columns where table_schema = '{{ db('landing') }}' and table_name = 'raw_olist_returns' order by ordinal_position"
          columns: [{key: position, label: Positie}, {key: name, label: Kolom}]
          empty: De tabel bestaat nog niet.
        - {type: result, title: "Wat de update in de beschrijving veranderd heeft", caption: "Kijk naar de eerste regel: de beschrijving noemt nu evenveel kolommen als de tabel heeft."}
