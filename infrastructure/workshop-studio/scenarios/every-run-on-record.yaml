id: every-run-on-record
group: daily
title: Elke run en elke check staat in het logboek
promise: "Wat liep er vannacht, hoe lang duurde het, wat mislukte? Het antwoord staat altijd in gewone tabellen."
minutes: 4
tech: ["log_dbt_results", "dbt_run_results", "on-run-end"]
environment: dev
related:
  - id: one-clear-mail
    why: De mail meldt de mislukking van vannacht; het logboek bewaart de historiek van elke nacht.
reality: "Elke run komt al meer dan een jaar in een tabel terecht. In productie deed één tabel er acht uur over: drie kleine tussenstappen werden telkens opnieuw berekend. De herstelling was vijftien regels."

quiz:
  situation: Op een ochtend is het managementrapport te laat. De manager vraagt of de nachtelijke load gelopen is, hoe lang ze duurde en of een check mislukte. Niemand kan het zeggen.
  question: Waar vindt het team de antwoorden over vorige nachten?
  options:
    - label: In het log, zolang het bewaard blijft
      impact: Het log wordt na enkele dagen weggegooid, en het team moet voor elk antwoord gaan zoeken. Een tabel die elke week trager wordt, valt niet op.
      tone: bad
    - label: In een tabel waar elke stap en check na de nacht in terechtkomt
      impact: Naam, resultaat, tijd en rijen staan in een gewone tabel. Wie de rapporten mag lezen, kan er vragen aan stellen, en een tabel die trager wordt valt op.
      tone: good
      platform: true
    - label: In het log, dat veel langer bewaard blijft
      impact: Het verleden blijft bestaan, maar voor elk antwoord moet het team nog altijd zoeken in tekst. Een trage tabel valt zo moeilijk op.
      tone: warn
  takeaway: Wat je niet bewaart, kun je achteraf enkel gissen. Een tabel met het verleden geeft een getal.
  minutes: 2

problem:
  headline: Niemand kan zeggen wat er vannacht liep of hoe lang het duurde
  story: |
    Op een ochtend is het managementrapport te laat. De manager vraagt: is de nachtelijke load gelopen? Hoe lang duurde ze? Is
    een check mislukt? Niemand weet het. De antwoorden staan in het [[log]], dat na enkele dagen weggegooid wordt,
    dus het team kan enkel gissen. Een tabel die elke week een beetje trager wordt, valt niet op tot de nachtelijke load
    niet meer klaar raakt voor de ochtend.
  cost: Het team moet voor elk antwoord over vannacht gaan zoeken, en trage tabellen vallen pas op als het ochtendrapport te laat is.
  visual:
    type: flow
    nodes:
      - {id: run, label: De nacht loopt, state: ok, note: "Elke nacht"}
      - {id: logs, label: Het log, state: warn, note: "Na enkele dagen weggegooid"}
      - {id: question, label: "Was het traag?", state: bad, note: "Niemand weet het"}
    links: [[run, logs], [logs, question]]
    caption: Zonder logboek is het verleden weg.

idea:
  headline: Elke stap en elke check komt in het logboek als de nacht eindigt
  points:
    - "Op het einde van elke nacht wordt elke stap en check toegevoegd aan één tabel, het [[logboek]]: naam, resultaat, tijd en rijen."
    - De tabel staat naast de data, dus wie de rapporten mag lezen, kan er vragen aan stellen.
    - Daarop zijn twee kant-en-klare lijsten gebouwd, bijvoorbeeld de mislukte checks en de traagste tabellen.
  visual:
    type: flow
    nodes:
      - {id: end, label: De nacht eindigt, state: ok, note: "Elke stap en check heeft een resultaat"}
      - {id: record, label: Eén rij per stap en check, state: fix, note: "Naam, resultaat, tijd, rijen"}
      - {id: failed, label: Mislukte checks van vandaag, state: ok, note: "Een kant-en-klare lijst"}
      - {id: slow, label: De traagste tabellen, state: ok, note: "Een kant-en-klare lijst"}
      - {id: answer, label: Het antwoord op een vraag, state: idle, note: "Een gewone tabel, geen zoekwerk"}
    links: [[end, record], [record, failed], [record, slow], [failed, answer], [slow, answer]]
    caption: 'Het logboek maakt van "ik denk het" een getal.'

code:
  - title: Het einde van elke run zet het schrijven in gang
    file: dbt_project.yml
    file_label: De instellingen van het hele project
    from: "on-run-end:"
    to: "log_dbt_results(results)"
    max_lines: 3
    notes:
      - line: "on-run-end"
        says: Zodra een run voorbij is, wordt in het logboek genoteerd wat er gebeurd is.
      - line: "target.name == 'run'"
        says: Enkel echte nachtelijke runs komen in het logboek, geen experimenten of [[dry run]].
  - title: Eén rij per stap en per check
    file: macros/utils/log_dbt_results.sql
    file_label: De code die het logboek schrijft
    from: "resource_type,"
    to: ") values"
    max_lines: 12
    notes:
      - line: "status,"
        says: Of de stap of check slaagde, een waarschuwing gaf of mislukte.
      - line: "failures,"
        says: "Voor een check: hoeveel rijen hem lieten mislukken."
      - line: "execution_time,"
        says: Hoe lang het duurde.
      - line: "rows_affected,"
        says: Hoeveel rijen hij aanraakte.
  - title: Een kant-en-klare lijst van de mislukte checks van vandaag
    file: models/dbt_active_test_failures/dbt_active_test_failures.sql
    file_label: Het recept van de lijst met mislukte checks
    from: "from {{ source(\"vdp_mgmt\", \"dbt_run_results\") }}"
    to: "status in ('fail', 'error', 'warn')"
    max_lines: 12
    notes:
      - line: "from {{ source("
        says: Ze leest het logboek met elke stap en check.
      - line: "run_started_at >= current_date()"
        says: Enkel de checks van vandaag tellen; gisteren blijft in het logboek, niet in deze lijst.
      - line: "status in ('fail', 'error', 'warn')"
        says: Enkel checks die mislukten, een fout gaven of waarschuwden, staan erin.

demo:
  intro: We runnen de nachtelijke load en lezen daarna het logboek dat ze schreef.
  setup: []
  steps:
    - id: run
      title: De nachtelijke load runnen
      say: Een gewone nacht. Daarna kijken we wat er in het logboek terechtkwam.
      button: De nachtelijke load runnen
      inputs: []
      do:
        - {action: airflow.run_dag, dag: dbt_daily_load, expect: success}
      show:
        - {type: run_history, limit: 5, title: De laatste nachten, caption: 'Nieuwste eerst: de bovenste regel is de nacht die je net liet lopen. Elke regel is één nacht: "gebuild" telt de tabellen die opnieuw opgebouwd zijn, "niet gerund" telt de stappen die na een fout overgeslagen werden.'}
      outcome: De nacht die je net liet lopen staat bovenaan de lijst, met het resultaat.
    - id: read
      title: Het logboek lezen
      say: Eén rij voor elke stap en elke check, met het aantal seconden dat het duurde.
      button: Het logboek tonen
      inputs: []
      do:
        - {action: wait, seconds: 1, because: "Het logboek werd geschreven toen de nacht eindigde"}
      show:
        - type: table
          title: De traagste stappen en checks van de laatste nacht
          caption: "De 8 traagste tabellen en de 4 traagste checks van de laatste nacht, traagste eerst. Checks staan in hetzelfde logboek: in de volgende stap zie je een mislukte."
          query: "select name, case resource_type when 'model' then 'table' else 'check' end as kind, case when status in ('success', 'pass') then 'Klaar' when status in ('fail', 'error') then 'Mislukt' when status = 'warn' then 'Waarschuwing' else 'Niet gerund' end as result, round(execution_time, 1) as seconds from (select * from (select * from {{ db('vdp_mgmt') }}.dbt_run_results where resource_type = 'model' and run_started_at = (select max(run_started_at) from {{ db('vdp_mgmt') }}.dbt_run_results) order by execution_time desc limit 8) a union all select * from (select * from {{ db('vdp_mgmt') }}.dbt_run_results where resource_type = 'test' and run_started_at = (select max(run_started_at) from {{ db('vdp_mgmt') }}.dbt_run_results) order by execution_time desc limit 4) b) t order by execution_time desc"
          columns:
            - {key: name, label: Naam}
            - {key: kind, label: Tabel of check}
            - {key: result, label: Resultaat}
            - {key: seconds, label: Tijd (seconden)}
          highlight: {column: result, equals: Mislukt, as: bad}
          empty: Er is nog niets vastgelegd.
        - type: table
          title: De vijf traagste tabellen van de laatste nacht
          caption: "De vijf tabellen die het langst duurden, traagste eerst. Een tabel die trager wordt, zou hier opvallen vóór het ochtendrapport te laat is."
          query: "select name, round(execution_time, 1) as seconds from {{ db('vdp_mgmt') }}.dbt_run_results where resource_type = 'model' and status = 'success' and run_started_at = (select max(run_started_at) from {{ db('vdp_mgmt') }}.dbt_run_results) order by execution_time desc limit 5"
          columns:
            - {key: name, label: Tabel}
            - {key: seconds, label: Tijd (seconden)}
          empty: In de laatste nacht werd geen tabel gebuild.
      outcome: "Het logboek toont de traagste tabellen en checks van de laatste nacht met hun resultaat en seconden: in één blik zie je wat liep en hoe lang het duurde."
    - id: failure
      title: Een mislukte check blijft bewaard
      say: Er komen 3 bestellingen binnen zonder bestelnummer, de nacht mislukt en de mislukte check komt in het logboek.
      button: De nacht laten mislukken
      inputs: []
      do:
        - {action: feed.condition, feed: orders, set: {bad_rows: 3}}
        - {action: feed.deliver, days: 1}
        - {action: airflow.run_dag, dag: dbt_daily_load, expect: failed}
      show:
        - type: table
          title: Checks die mislukten in de laatste nacht
          caption: "Gelezen uit het logboek: één rij per mislukte check van de laatste nacht. Elke rij die hier de regel brak, is één bestelling zonder bestelnummer."
          query: "select name, 'Mislukt' as status, failures from {{ db('vdp_mgmt') }}.dbt_run_results where resource_type = 'test' and status in ('fail', 'error') and run_started_at = (select max(run_started_at) from {{ db('vdp_mgmt') }}.dbt_run_results) order by name limit 10"
          columns:
            - {key: name, label: Check}
            - {key: status, label: Resultaat}
            - {key: failures, label: Rijen die de regel braken}
          highlight: {column: status, equals: Mislukt, as: bad}
          empty: Geen mislukte checks in de laatste nacht.
      outcome:
        check: "select count(*) from {{ db('vdp_mgmt') }}.dbt_run_results where resource_type = 'test' and status in ('fail', 'error') and run_started_at = (select max(run_started_at) from {{ db('vdp_mgmt') }}.dbt_run_results)"
        good_when: positive
        good: De mislukte check blijft bewaard, met het aantal rijen dat mislukte, ook lang nadat het log weg is.
        not_quite: Het logboek bevat geen mislukte check voor de laatste nacht.
