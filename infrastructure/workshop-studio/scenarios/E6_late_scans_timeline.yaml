id: E6_late_scans_timeline
layer: engineering
title: "Late scans rewrite delivery history"
summary: "Drivers' handhelds upload scans hours or days late. The current parcel status is resolved by arrival order, so delivered parcels flip back to 'in transit' - and the on-time KPI drops."
star: true
focus: [channel.carrier, dbt.fct_olist_deliveries, dbt.mart_olist_management_kpi]
detect: "assert_delivery_status_consistent (critical): parcels with a delivery scan whose current status is not 'delivered'."
requires:
  - {action: check_gitlab_file, ref: dev, path: models/im_dimensional/carrier/fct_olist_deliveries.sql, not_contains: "order by event_ts desc", hint: "the fix is already in dev: press Reset first"}
inject:
  narrative: "Half of the carrier's drivers work in areas without signal: their pick-up and in-transit scans are uploaded two days late, after the delivery scan of the same parcel has already arrived. Nothing is missing, nothing is wrong in the feed - only the ORDER in which the scans arrive changed."
  sim:
    channel.carrier: {health: warn, note: "LDV: 50% of the scans arrive 2 batches late", knobs.late_pct: 50}
    dbt.fct_olist_deliveries: {health: fail, note: "delivered parcels back 'in transit'"}
  live:
    - {action: set_channel, env: dev, channel: carrier, late_pct: 50}
    - {action: trickle, env: dev, days: 1}
    - {action: trickle, env: dev, days: 1}
    - {action: trickle, env: dev, days: 1}
    - {action: trickle, env: dev, days: 1}
    - {action: trickle, env: dev, days: 1}
    - {action: trickle, env: dev, days: 1}
    - {action: airflow_trigger, env: dev, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
impact:
  - {node: dbt.mart_olist_management_kpi, health: warn, note: "on-time % drops"}
  - {node: exposure.management_delivery_kpi, health: warn, note: "deliveries 'disappear'"}
  - {node: consumer.management, health: warn}
steps:
  - title: "Detect: delivered parcels are 'in transit' again"
    explain: "fct_olist_deliveries takes the current status from the most recently RECEIVED scan. A late in-transit scan now overrules a delivery that arrived two days earlier. assert_delivery_status_consistent (critical) finds parcels with a delivery scan but another current status."
    code: "dbt test --select assert_delivery_status_consistent"
    zoom: platform
    highlight: [dbt.fct_olist_deliveries]
    expect: {node: dbt.fct_olist_deliveries, health: fail}
  - title: "Analyse: arrival order is not event order"
    explain: "Resolving by _ingested_at is right for CDC from a database (stg_olist_orders: commits arrive in order) and wrong for device events. The same trap in incremental models: a watermark on EVENT time skips late rows forever - filter on the load time (_ingested_at), resolve on the event time."
    code: |
      -- wrong for device events: the last scan to ARRIVE wins
      row_number() over (partition by order_id order by _ingested_at desc, event_ts desc)
      -- incremental trap: late scans have an event_ts below the watermark and are never picked up
      where event_ts > (select max(event_ts) from {{ this }})
    zoom: platform
    highlight: [dbt.fct_olist_deliveries, landing.raw_carrier_tracking_events]
  - title: "Fix: resolve by event time"
    explain: "The parcel status is the scan that HAPPENED last; same second, the furthest status wins. Bugfix branch -> MR -> dev."
    code: |
      row_number() over (
          partition by order_id
          order by event_ts desc, case event_type when 'delivered' then 3 when 'in_transit' then 2 else 1 end desc
      ) as rn
    zoom: platform
    highlight: [git.feature, git.dev, dbt.fct_olist_deliveries]
    sim:
      git.feature: {health: ok}
      dbt.fct_olist_deliveries: {health: warn, note: "fix merged, not rebuilt yet"}
    live:
      - {action: gitlab_branch, name: bugfix/carrier-timeline, ref: dev}
      - {action: gitlab_commit_patch, patch: fix-carrier-timeline, branch: bugfix/carrier-timeline}
      - {action: gitlab_mr_merge, source: bugfix/carrier-timeline, target: dev, patch: fix-carrier-timeline, timeout: 900}
  - title: "Rebuild: the late scans no longer matter"
    explain: "The next LDV daily load rebuilds the deliveries from the same scans, now in event order. The late scans keep coming - the model just stopped depending on when they arrive."
    code: "airflow dags trigger dbt_daily_load --conf '{\"manual_run_override\": true}'"
    zoom: consumers
    highlight: [dbt.fct_olist_deliveries, exposure.management_delivery_kpi]
    sim:
      channel.carrier: {health: ok, note: "late scans are harmless now"}
      dbt.fct_olist_deliveries: {health: ok, note: ""}
      dbt.mart_olist_management_kpi: {health: ok, note: ""}
      exposure.management_delivery_kpi: {health: ok, note: ""}
      consumer.management: {health: ok}
    live:
      - {action: gitlab_pipeline_wait, tag_of: dev, expect: success, timeout: 900}
      - {action: airflow_trigger, env: dev, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
    # ok = dbt_build passed, including the critical assert_delivery_status_consistent. (The deliveries node stays 'warn'
    # on the map while the channel still has late scans switched on: the map ripples a channel fault downstream.)
    expect: {node: airflow.daily_load, health: ok}
