id: right-keys-only
group: releases
title: De robot die development buildt, kan productie niet aanraken
promise: Elke omgeving heeft een eigen robot die enkel daar werkt, dus een vergissing beschadigt productie niet.
minutes: 2
feature: "Een aparte robot voor elke omgeving"
status: today
tech: ["service users svc_<env>_dbt", "RBAC", "init_env.sql.tmpl"]
environment: prd

problem:
  headline: Een testrobot gericht op productie maakt de echte klantenlijst leeg
  story: |
    Het programma dat in development buildt, heeft één login die overal werkt. Op een namiddag wordt
    een [[instelling]] van een testopstelling per vergissing naar de echte opstelling gekopieerd. 's Nachts doet de robot wat hem
    gezegd wordt, maar op de verkeerde plek: de echte klantentabel wordt opnieuw opgebouwd uit testdata, en de klantendienst
    ziet een lege lijst.
  cost: De klantendienst kan niemand opzoeken zolang de echte tabel hersteld wordt, en elke beller krijgt intussen geen antwoord.
  visual:
    type: flow
    nodes:
      - {id: cfg, label: "Testinstellingen", state: warn, note: "Per vergissing naar het echte systeem gekopieerd"}
      - {id: robot, label: "Buildrobot", state: warn, note: "Eén login voor alles"}
      - {id: prod, label: "Echte klantentabel", state: bad, note: "Opnieuw opgebouwd uit testdata"}
      - {id: service, label: "Klantendienst", state: bad, note: "Lege klantenlijst"}
    links: [[cfg, robot], [robot, prod], [prod, service]]
    caption: Eén verkeerde instelling volstaat, als één login overal werkt.

idea:
  headline: Elke robot kan enkel in zijn eigen omgeving werken
  points:
    - Development, validatie en productie hebben elk hun eigen [[robotaccount]], en de robot van development heeft geen toegang tot productie.
    - "Mensen krijgen ook hun eigen toegang: ze kunnen development wijzigen en validatie en productie enkel bekijken."
    - Een vergissing wordt een weigering met een duidelijke boodschap, in plaats van schade.
  visual:
    type: flow
    nodes:
      - {id: robot, label: Robot van development, state: ok, note: "Buildt in development"}
      - {id: keys, label: Toegang per omgeving, state: fix, note: "Elke robot bereikt enkel de eigen"}
      - {id: dev, label: Development, state: ok, note: "Toegelaten"}
      - {id: prod, label: Productie, state: ok, note: "Geweigerd, niets aangeraakt"}
      - {id: answer, label: Antwoord van de database, state: idle, note: "Gedaan in development, een duidelijke weigering in productie"}
    links: [[robot, keys], [keys, dev], [keys, prod], [dev, answer], [prod, answer]]
    caption: De veiligheid hangt er niet van af dat iemand eraan denkt voorzichtig te zijn.

code:
  - title: Wat de robot van elke omgeving mag doen
    file: ../infrastructure/singlestore/init_env.sql.tmpl
    file_label: De databaseopzet, één keer geschreven voor elke omgeving
    from: "-- 3. Grants, per database"
    to: "GRANT ALL PRIVILEGES ON __ENV___edw_dv_bdv.* TO ROLE '__ENV___dbt';"
    max_lines: 12
    notes:
      - line: "-- 3. Grants, per database"
        says: Elke omgeving krijgt haar eigen kopie van deze rechten, dus geen enkele robot gaat over de grens.
      - line: "GRANT SELECT, SHOW VIEW ON __ENV___landing.* TO ROLE '__ENV___dbt';"
        says: De robot mag de binnenkomende data enkel lezen. Hij buildt de rapporten.
      - line: "GRANT ALL PRIVILEGES ON __ENV___edw_dv_bdv.* TO ROLE '__ENV___dbt';"
        says: ALL PRIVILEGES betekent dat de robot in deze omgeving de rapporten mag builden en wijzigen.
  - title: De robot hoort bij één omgeving
    file: ../infrastructure/singlestore/init_env.sql.tmpl
    file_label: De databaseopzet, één keer geschreven voor elke omgeving
    from: "-- 4. Service user"
    to: "GRANT GROUP 'grp___ENV___dbt' TO 'svc___ENV___dbt'@'%';"
    max_lines: 12
    notes:
      - line: "CREATE USER IF NOT EXISTS"
        says: Eén robotaccount per omgeving, met een eigen naam.
      - line: "GRANT GROUP"
        says: Hij krijgt de toegang van zijn eigen omgeving en niets anders.
  - title: Mensen mogen enkel in development schrijven
    file: ../infrastructure/singlestore/init_global.sql
    file_label: De databaseopzet voor mensen
    from: "-- 4. Developer role"
    to: "GRANT SELECT, SHOW VIEW ON dev_landing.* TO ROLE 'dev_developer';"
    max_lines: 12
    notes:
      - line: "GRANT ALL PRIVILEGES ON dev_im_dimensional.*"
        says: Developers mogen in development alles aanmaken en wijzigen.
      - line: "GRANT SELECT, SHOW VIEW ON dev_landing.*"
        says: Zelfs daar mogen ze de binnenkomende data enkel lezen.

demo:
  intro: >-
    Een robot is een automatisch programma met een eigen login; een developer is een persoon met de zijne. De robot
    van development probeert in productie te schrijven en wordt geweigerd. De robot van productie mag dat wel. Een
    developer kan productie bekijken, maar er niet in schrijven.
  setup: []
  steps:
    - id: devrobot
      title: De robot van development probeert in productie te schrijven
      say: "Dit is de vergissing uit het verhaal: een robot van development gericht op productie."
      button: Proberen
      inputs: []
      do:
        - {action: sql.exec, as: svc_dev_dbt, statement: "create table prd_edw_dv_bdv.dev_robot_was_here (id int)", expect: refused}
      show:
        - {type: result, title: "Het antwoord van de database", caption: "Geweigerd. Er werd niets aangemaakt."}
      outcome: De database weigerde de robot van development en zei dat die productie niet mag wijzigen. Er werd niets aangemaakt.
    - id: prdrobot
      title: De robot van productie werkt in productie
      say: De juiste robot, in zijn eigen omgeving, mag dat. Hij maakt een kleine testtabel aan in productie, en de demo verwijdert ze achteraf weer.
      button: Proberen
      inputs: []
      do:
        - action: sql.exec
          as: svc_prd_dbt
          statement: "create table prd_edw_dv_bdv.prd_robot_was_here (id int)"
          expect: ok
          undo: "drop table if exists prd_edw_dv_bdv.prd_robot_was_here"
      show:
        - {type: result, before_of: devrobot, title: "Het antwoord van de database", caption: "Toegelaten. De tabel wordt weer verwijderd wanneer de demo opgekuist wordt."}
      outcome: De robot van productie mag in productie schrijven, en enkel daar.
    - id: people
      title: Een developer bekijkt productie en probeert te schrijven
      say: Developers mogen productie lezen om iets uit te zoeken, maar niet wijzigen.
      button: Allebei proberen
      inputs: []
      do:
        - {action: sql.exec, as: pu_dev1, statement: "select count(*) from prd_im_dimensional.dim_olist_customers", expect: ok}
        - {action: sql.exec, as: pu_dev1, statement: "create table prd_im_dimensional.dev_was_here (id int)", expect: refused}
      show:
        - {type: number, title: "Klanten die een developer in productie kan zien", caption: "Lezen mag.", query: "select count(*) from prd_im_dimensional.dim_olist_customers", as: pu_dev1, unit: klanten}
        - {type: result, title: "Het antwoord op de schrijfpoging", caption: "Schrijven wordt geweigerd."}
      outcome: Lezen mocht en schrijven werd geweigerd. Kijken is veilig, wijzigen kan niet.
