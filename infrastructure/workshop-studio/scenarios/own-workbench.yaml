id: own-workbench
group: changes
title: Elke developer werkt op zijn eigen kopieën
promise: Twee developers kunnen tegelijk dezelfde tabel builden zonder elkaars werk te overschrijven.
minutes: 3
feature: "Eigen kopieën voor elke developer"
status: today
tech: ["generate_alias_name", "username prefix", "cleanup_user_models", "dbt_housekeeping"]
environment: dev

problem:
  headline: Twee developers builden dezelfde tabel en één wist het werk van de ander
  story: |
    Dana en Sam verbeteren allebei de klantentabel. Dana buildt haar versie en kijkt een uur lang de cijfers na.
    Ondertussen buildt Sam zijn versie op dezelfde plek. De [[tabel]] van Dana wordt onder haar handen vervangen, en
    haar uur nakijken ging over een tabel die niet meer bestaat. Niemand weet welke versie de juiste is.
  cost: Dana verliest een uur nakijkwerk, en elk rapport dat de gedeelde tabel leest, toont wat het laatst gebuild werd.
  visual:
    type: timeline
    days:
      - {label: "09:00", state: ok, note: "Dana buildt de klantentabel"}
      - {label: "10:00", state: ok, note: "Dana kijkt 1 uur lang de cijfers na"}
      - {label: "10:30", state: bad, note: "Sam buildt dezelfde tabel: die van Dana wordt vervangen"}
      - {label: "11:00", state: bad, note: "Dana kijkt een tabel na die niet meer bestaat"}
      - {label: "11:30", state: bad, note: "Welke van de 2 versies is de juiste?"}
    marker: {after: 1, label: "Sam overschrijft"}
    caption: Allebei werkten ze correct. De plek waarin ze werkten, was gedeeld.

idea:
  headline: Iedereen buildt zijn eigen kopieën met een eigen naam, en oude kopieën worden opgekuist
  points:
    - De tabellen van elke developer krijgen zijn naam ervoor, zodat twee mensen dezelfde tabel naast elkaar kunnen builden.
    - Enkel het automatische proces past de gedeelde tabellen aan, nooit een developer die iets uitprobeert.
    - Een wekelijkse taak verwijdert de kopieën van developers die meer dan een week oud zijn.
  visual:
    type: flow
    nodes:
      - {id: one, label: Developer één, state: ok, note: "Buildt de klantentabel"}
      - {id: two, label: Developer twee, state: ok, note: "Buildt dezelfde tabel"}
      - {id: name, label: Naam vóór de tabelnaam, state: fix, note: "Houdt de kopieën uit elkaar"}
      - {id: copies, label: Elk een eigen kopie, state: ok, note: "De gedeelde tabel blijft zoals ze is"}
    links: [[one, name], [two, name], [name, copies]]
    caption: Dezelfde tabel, andere eigenaars.

code:
  - title: De naam van de developer komt voor de tabelnaam
    file: macros/core/generate_alias_name.sql
    file_label: De regel die elke tabel een naam geeft
    from: '{%- if target.name == "collibra" -%}'
    to: "{%- endif -%}"
    max_lines: 12
    notes:
      - line: 'target.name == "collibra"'
        says: Voor de [[catalogus]] krijgt de tabel haar gewone naam, zonder voorvoegsel.
      - line: "node.schema | length"
        says: Gedeelde tabellen krijgen geen voorvoegsel; het werk van een developer krijgt zijn loginnaam ervoor.
      - line: "{{ node.schema }}_{{ prefix ~ base_name }}"
        says: Zo delen de gedeelde tabel en de kopie van developer één nooit een naam.
  - title: De wekelijkse taak verwijdert oude kopieën van developers
    file: airflow/dags/dbt_housekeeping.py
    file_label: De wekelijkse opkuistaak
    from: '@dbt_task(task_id="cleanup_user_models")'
    to: 'return build_run_operation_command("cleanup_user_models", args)'
    max_lines: 12
    notes:
      - line: "def cleanup_user_models():"
        says: De wekelijkse taak kuist in één keer op voor alle developers.
      - line: '"keep_younger_than_days": 7'
        says: Kopieën jonger dan een week blijven staan, zodat niemand werk verliest waar hij nog mee bezig is.
  - title: Hoe de opkuis de kopie van een developer herkent
    file: macros/utils/cleanup_user_models.sql
    file_label: De opkuisinstructies
    from: "from information_schema.tables"
    to: "table_name like"
    max_lines: 12
    notes:
      - line: "table_schema in ('dev_edw_dv_rdv'"
        says: Ze kijkt enkel in de databases van development.
      - line: "create_time <"
        says: Enkel kopieën die ouder zijn dan het gekozen aantal dagen, worden verwijderd.
      - line: "table_name like"
        says: Enkel tabellen waarvan de naam met de naam van een developer begint, worden aangeraakt.

demo:
  intro: >-
    Twee developers builden dezelfde tabel, en beide kopieën bestaan naast de gedeelde. Daarna verwijdert de opkuis
    van één developer enkel de kopie van die developer.
  setup: []
  steps:
    - id: first
      title: Developer één buildt de klantentabel
      say: Elke developer vraagt dezelfde klantentabel.
      button: De tabel builden als developer één
      inputs: []
      do:
        - {action: dbt.run, as: "developer:pu_dev1", command: "run --select +dim_olist_customers", expect: success}
      show:
        - &copies
          type: table
          title: Kopieën van de klantentabel
          caption: Eén rij per tabel. De laatste kolom zegt van wie ze is.
          query: "select case when table_name like 'pu_%' then concat('Klantentabel (kopie van ', substring_index(table_name, '_dim_olist_customers', 1), ')') else 'Klantentabel (gedeeld)' end as copy, case when table_name like 'pu_%' then substring_index(table_name, '_dim_olist_customers', 1) else 'gedeeld' end as owner from information_schema.tables where table_schema = '{{ db('im_dimensional') }}' and table_name like '%dim_olist_customers' order by table_name"
          as: root
          columns: [{key: copy, label: Tabel}, {key: owner, label: Hoort bij}]
          empty: Nog geen kopieën.
      outcome: Developer één heeft zijn eigen kopie, en de gedeelde tabel staat er nog. Er bestaan 2 tabellen.
    - id: second
      title: Developer twee buildt dezelfde tabel
      say: Een tweede developer vraagt dezelfde tabel, en niets wordt overschreven.
      button: De tabel builden als developer twee
      inputs: []
      do:
        - {action: dbt.run, as: "developer:pu_dev2", command: "run --select +dim_olist_customers", expect: success}
      show:
        - <<: *copies
          before_of: first
      outcome: Nu bestaan er 3 tabellen naast elkaar. Elke developer kan in alle rust zijn eigen cijfers nakijken.
    - id: cleanup
      title: Developer één kuist zijn kopie op
      say: |
        De wekelijkse taak verwijdert enkel kopieën die ouder zijn dan een week. Om het nu te tonen, kuisen we de
        kopieën van developer één meteen op, zonder leeftijdsgrens.
      button: Developer één laten opkuisen
      inputs: []
      do:
        - {action: dbt.run, as: "developer:pu_dev1", command: "run-operation cleanup_user_models", expect: success}
      show:
        - <<: *copies
          before_of: second
      outcome: "Enkel de kopie van developer één is weg. Er blijven 2 tabellen over: de gedeelde en de kopie van developer twee."
