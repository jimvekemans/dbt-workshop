id: skip-one-table
group: sources
title: One broken feed must not stop every report
promise: When one feed arrives broken, an operator skips it for tonight and every other report is still on time.
minutes: 4
environment: dev
related:
  - id: switchover-date
    why: The skip list is another setting an operator can change in a minute, without a new release.

problem:
  headline: One broken carrier feed leaves management with yesterday's numbers
  story: |
    In the night the carrier's feed arrives with 3 scans that have no scan number. The automatic checks stop the
    build of everything that depends on the carrier, and the [[nightly load]] ends in red. The management report,
    which combines orders and deliveries, is not rebuilt. In the morning management opens it and reads yesterday's
    numbers. The carrier team needs a day to fix its feed.
  cost: Management works from a report that is a day old, because of 3 bad scans from one carrier.
  visual:
    type: flow
    nodes:
      - {id: carrier, label: Carrier scans, state: bad, note: "3 scans without a number"}
      - {id: deliveries, label: Deliveries report, state: bad, note: "Stopped by the check"}
      - {id: mgmt, label: Management report, state: bad, note: "Not rebuilt"}
      - {id: night, label: The whole night, state: bad, note: "Ends in red"}
    links: [[carrier, deliveries], [deliveries, mgmt], [mgmt, night]]
    caption: Everything that depends on the carrier stops until the carrier is fixed.

idea:
  headline: Leave the broken feed and its reports out tonight
  points:
    - An [[operator]] writes a short skip list into a [[setting]], with no new [[release]].
    - The skipped parts disappear from tonight's nightly load, and every other report is built and checked as usual.
    - Remove the list and everything returns the next night, with nothing left behind.
  visual:
    type: flow
    nodes:
      - {id: list, label: The skip list, state: fix, note: "Written by an operator"}
      - {id: load, label: Nightly load, state: ok, note: "Reads the list first"}
      - {id: left, label: Carrier and management report, state: idle, note: "Left out tonight"}
      - {id: rest, label: All other reports, state: ok, note: "Built and checked"}
      - {id: night, label: The night, state: ok, note: "Ends green without the left-out parts"}
    links: [[list, load], [load, left], [load, rest], [left, night], [rest, night]]
    caption: Skip the broken part, not the whole night.

code:
  - title: The carrier's feed and what depends on it
    file: models/edw_dv_bdv/carrier/sources_carrier.yml
    file_label: Notes written in the code
    from: "# The carrier feed lives in its own folders"
    to: "has to be ignored too, or the whole project fails to parse."
    max_lines: 6
    notes:
      - line: "the Airflow Variable `dbt_daily_load_dbtignore`"
        says: The skip list lives in one setting that an operator can fill in.
      - line: "has to be ignored too"
        says: Anything built on the carrier must be listed too, or the nightly load breaks.
  - title: The nightly load reads the skip list first
    file: airflow/dags/dbt_daily_load.py
    file_label: The list of steps of the nightly load
    from: "# Files left out of the project until the next deploy window"
    to: "cmd = apply_overrides(cmd, dbtignore=ignored)"
    max_lines: 6
    notes:
      - line: "# Files left out of the project"
        says: The files stay in the project and are back with the next release.
      - line: "read_dbtignore(get_variable)"
        says: Just before the work starts, the nightly load reads the skip list.
      - line: "apply_overrides"
        says: The listed files are hidden from this run only.
  - title: What the skip list does
    file: airflow/utils/dbt_runtime_overrides.py
    file_label: The code that hands settings to the nightly load
    from: "if dbtignore:"
    to: ">> .dbtignore"
    max_lines: 8
    notes:
      - line: "validate_ignore_entries(dbtignore)"
        says: Only files inside the project can be put on the list.
      - line: "trap 'if [ -f"
        says: When the run ends, the original list is put back, so nothing is left behind.
      - line: "printf '%s"
        says: The listed files are hidden from this run only.

demo:
  intro: The carrier delivers broken scans. We run the nightly load once as it is, then again with the carrier left out.
  setup:
    - {action: feed.condition, feed: carrier, set: {bad_rows: 3}}
    - {action: feed.deliver, days: 1}
  steps:
    - id: red
      title: First, the night as it is
      say: Three scans from the carrier have no scan number, so a check stops the night.
      button: Run the nightly load
      inputs: []
      do:
        - {action: airflow.run_dag, dag: dbt_daily_load, expect: failed}
      show:
        - {type: tasks, dag: dbt_daily_load, title: The nightly load, caption: "1 step failed: the one that builds the reports."}
        - {type: result, title: What happened}
      outcome: "The night ends in red: 1 step failed, the one that builds the reports."
    - id: skip
      title: Now leave the carrier out for tonight
      say: "The operator fills in the skip list: the carrier's feed and the management report that needs it."
      button: Skip the carrier, run the load again
      inputs: []
      do:
        - action: airflow.set_variable
          key: dbt_daily_load_dbtignore
          value:
            - "models/*/carrier/"
            - "tests/carrier/"
            - "models/im_dimensional/mart_olist_management_kpi.sql"
            - "models/im_dimensional/olist_management.yml"
        - {action: airflow.run_dag, dag: dbt_daily_load, expect: success}
      show:
        - {type: tasks, before_of: red, dag: dbt_daily_load, title: The nightly load, caption: No step failed this time.}
        - type: number
          title: Orders in the orders report
          query: "select count(*) from {{ db('im_dimensional') }}.fct_olist_orders"
          unit: orders
          caption: The orders report is still filled.
        - {type: run_history, limit: 2, title: The last two nights, caption: "Tonight 25 of the 28 tables were built; the 3 left out on purpose are the carrier's feed and the management report. The line below is the failed night."}
      outcome:
        check: "select count(*) from {{ db('im_dimensional') }}.fct_olist_orders"
        good_when: positive
        good: The night is green. 25 of 28 tables were built, 3 were left out on purpose, and the orders report still holds {{ value }} orders.
        not_quite: The night is green, but the orders report is empty.
