id: E3_full_refresh_window
layer: engineering
status: narrative
title: "Full refresh of a big model blows the nightly window"
summary: "A schema change forces a full refresh; the nightly dbt_release step runs for hours."
focus: [airflow.release, dbt.fct_olist_orders]
detect: "A long-running step in dbt_release."
inject:
  narrative: "A new column on a large incremental model triggers a full refresh inside the release. The step takes far longer than the maintenance window."
  sim:
    airflow.release: {health: warn, note: "step running 3h (window: 1h)"}
    dbt.fct_olist_orders: {health: warn, note: "full refresh in progress"}
impact:
  - {node: db.prod, health: warn, note: "tables locked while rebuilding"}
  - {node: exposure.management_kpi_forecast, health: warn, note: "stale until release finishes"}
steps:
  - title: "Choose a reload strategy per model"
    explain: "Mark the model with meta.reload_strategy so dbt_release delegates it to dbt_reload instead of a blocking full refresh."
    code: |
      config(meta={'reload_strategy': 'date_window'})
    highlight: [airflow.release, dbt.fct_olist_orders]
  - title: "dbt_reload: blue/green in chunks"
    explain: "dbt_reload builds the new table next to the old one in batches (halving the batch on OOM), then swaps atomically. PRD stays readable the whole time."
    code: "airflow dags trigger dbt_reload --conf '{\"model\": \"fct_olist_orders\"}'"
    sim:
      airflow.release: {health: ok, note: ""}
      dbt.fct_olist_orders: {health: ok, note: ""}
      db.prod: {health: ok, note: ""}
      exposure.management_kpi_forecast: {health: ok, note: ""}
