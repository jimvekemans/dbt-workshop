id: redo-only-what-failed
group: daily
title: Na een herstel loopt enkel het mislukte deel opnieuw
promise: Mislukt een nacht en is de oorzaak hersteld, dan doet de retry enkel opnieuw wat mislukte en wat erop wacht.
minutes: 4
feature: "Een retry van enkel het mislukte deel"
status: today
tech: ["dbt retry"]
environment: dev
related:
  - id: one-clear-mail
    why: De mail zegt het team wat mislukte, zodat het weet wat het moet herstellen vóór de retry.

problem:
  headline: Drie slechte bestellingen herstellen betekent alles van nul opnieuw builden
  story: |
    De nachtelijke load buildt alle tabellen van de webshop. Om 03:10 stopt ze omdat drie bestellingen geen
    bestelnummer hebben. De oorzaak is in tien minuten hersteld, maar de enige weg vooruit is de hele nacht opnieuw
    te starten. Zo worden ook de tabellen die al in orde waren opnieuw gebuild, en is het managementrapport te laat
    voor het ochtendoverleg.
  cost: Het management wacht na een herstel van tien minuten op het opnieuw builden van elke tabel, en het ochtendoverleg draait op oude cijfers.
  visual:
    type: flow
    nodes:
      - {id: built, label: Meeste tabellen gebuild, state: ok, note: "Ze waren in orde"}
      - {id: fail, label: 1 check mislukt, state: bad, note: "Hersteld in 10 minuten"}
      - {id: again, label: Opnieuw van nul, state: warn, note: "Elke tabel opnieuw"}
    links: [[built, fail], [fail, again]]
    caption: Alles wordt opnieuw gedaan, ook wat in orde was.

idea:
  headline: Een retry onthoudt wat gelukt is en doet enkel de rest opnieuw
  points:
    - "Na elke run wordt het resultaat van elke stap bewaard: wat lukte, wat mislukte en wat werd overgeslagen."
    - Een retry leest dat bewaarde resultaat en doet enkel de mislukte stap opnieuw, plus alles wat erop wacht.
    - Een gloednieuwe nacht begint helemaal bovenaan, zodat een retry nooit resultaten van een oude nacht vermengt.
  visual:
    type: flow
    nodes:
      - {id: first, label: Eerste poging, state: ok, note: "Enkele stappen lukken, één mislukt"}
      - {id: saved, label: Het bewaarde resultaat, state: fix, note: "Wat lukte, mislukte en overgeslagen werd"}
      - {id: retry, label: De retry, state: ok, note: "Leest het bewaarde resultaat"}
      - {id: redone, label: Opnieuw gedaan, state: ok, note: "Het mislukte deel en wat erop wacht"}
    links: [[first, saved], [saved, retry], [retry, redone]]
    caption: Het bewaarde resultaat van de eerste poging maakt de korte retry mogelijk.

code:
  - title: Het nummer van de poging en de bewaarde resultaten worden doorgegeven
    file: airflow/dags/dbt_daily_load.py
    file_label: De lijst met stappen van de nachtelijke load
    from: "cmd = build_daily_load_command("
    to: "        )"
    max_lines: 10
    notes:
      - line: "try_number=ti.try_number"
        says: Het commando krijgt te horen de hoeveelste poging het is.
      - line: "state_dir=DAILY_ARTIFACTS_DIR"
        says: Het leert ook waar de eerste poging haar bewaarde resultaten achterliet.

  - title: Een retry wordt een ander commando
    file: airflow/utils/dbt_command_utils.py
    file_label: Hulpfuncties die het commando van de nacht opbouwen
    from: "if try_number > 1:"
    to: "        ]"
    max_lines: 10
    notes:
      - line: "\"retry\","
        says: In plaats van alles te builden, probeert het commando enkel opnieuw wat niet slaagde.
      - line: "state_dir,"
        says: Het leest de bewaarde resultaten waar de eerste poging ze achterliet.

demo:
  intro: We laten de nachtelijke load mislukken op drie slechte bestellingen, herstellen ze en doen een retry. Kijk hoe weinig er de tweede keer loopt.
  setup:
    - {action: feed.condition, feed: orders, set: {bad_rows: 3}}
    - {action: feed.deliver, days: 1}
  steps:
    - id: fail
      title: De nacht mislukt
      say: Er zijn 3 bestellingen zonder bestelnummer, dus een check stopt de nacht.
      button: De nachtelijke load runnen
      inputs: []
      do:
        - {action: airflow.run_dag, dag: dbt_daily_load, expect: failed}
      show:
        - {type: tasks, dag: dbt_daily_load, title: De nachtelijke load, caption: '1 stap mislukt: "Alle rapporten builden".'}
        - {type: run_history, limit: 1, title: Wat er vannacht liep, caption: "De eerste nacht: de tabellen die gebuild werden, de tabellen en checks die nooit liepen en de 1 check die mislukte."}
      outcome: De eerste nacht stopte halverwege. De regel erboven telt wat gebuild werd en wat nooit liep, en 1 check mislukte.
    - id: fix
      title: De levering herstellen
      say: De afzender verbetert het bestand; hier halen we gewoon de 3 slechte bestellingen weg.
      button: De slechte bestellingen verwijderen
      inputs: []
      do:
        - {action: feed.condition, feed: orders, set: {bad_rows: 0}}
        - action: sql.exec
          as: root
          statement: "delete from {{ db('landing') }}.raw_olist_orders where order_id is null or order_id = ''"
          expect: ok
          undo: "select 1"
      show:
        - type: number
          title: Bestellingen zonder bestelnummer
          query: "select count(*) from {{ db('landing') }}.raw_olist_orders where order_id is null or order_id = ''"
          unit: bestellingen
      outcome:
        check: "select count(*) from {{ db('landing') }}.raw_olist_orders where order_id is null or order_id = ''"
        good_when: zero
        good: De oorzaak is weg, er blijft geen bestelling zonder bestelnummer over. Enkel de retry rest nog.
        not_quite: "{{ value }} bestellingen zonder bestelnummer staan er nog, dus de retry zou opnieuw mislukken."
    - id: retry
      title: Retry
      say: "We beginnen niet opnieuw: we vragen een retry en kijken hoe weinig er loopt."
      button: Retry van enkel het mislukte
      inputs: []
      do:
        - {action: airflow.retry_failed, dag: dbt_daily_load, expect: success}
      show:
        - {type: tasks, before_of: fail, dag: dbt_daily_load, title: De nachtelijke load, caption: 'Na de retry is geen enkele stap nog rood. Enkel "Alle rapporten builden" liep opnieuw; de andere vier stappen waren de eerste keer al klaar ("Klaar bij de eerste poging") en zijn niet herhaald. De foutmail is enkel na de eerste nacht verstuurd.'}
        - {type: run_history, limit: 2, title: Wat er liep, caption: "De regel die met Retry begint, telt enkel wat opnieuw liep: de tabellen die in de eerste poging nooit liepen, en hun checks. De regel eronder is de eerste poging."}
      outcome: De retry buildde enkel de tabellen die nog niet gerund hadden en runde enkel hun checks, niet de hele nacht opnieuw (vergelijk de twee regels hierboven). De nacht is groen.
