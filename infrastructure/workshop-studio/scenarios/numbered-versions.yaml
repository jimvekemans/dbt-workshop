id: numbered-versions
group: releases
title: Elke omgeving draait één exacte, genummerde versie
promise: "De vraag 'welke versie van onze code draait er in het live systeem?' heeft altijd één exact antwoord."
minutes: 3
tech: ["git tag", "tag_dev", "build_image", "dbt_image_tag"]
environment: dev
reality: "In 18 maanden kregen ongeveer 1.090 goedgekeurde wijzigingen een nummer, in de drukste maand 116. De manier van nummeren veranderde onderweg twee keer."

quiz:
  situation: Dinsdagochtend toont het salesrapport vreemde cijfers. Support vraagt welke versie van de code live draait, en niemand kan dat met zekerheid zeggen.
  question: Hoe weet je altijd welke versie live draait?
  options:
    - label: Een lijst bijhouden waarin developers noteren wat ze live zetten
      impact: Werkt zolang iedereen eraan denkt. Vergeet één developer een regel, dan klopt de lijst niet meer en zoeken weer meerdere mensen uit wat er draait.
      tone: warn
    - label: Elke goedgekeurde wijziging een vast nummer geven dat elke omgeving draait
      impact: Eén blik geeft het exacte nummer per omgeving, en het package met dat nummer wordt achteraf nooit meer aangepast.
      tone: good
      platform: true
    - label: De bestanden vergelijken telkens iemand de vraag stelt
      impact: "Drie mensen vergelijken een hele ochtend bestanden voor ze de oorzaak zelfs kunnen zoeken."
      tone: bad
  takeaway: Eén vast nummer per omgeving, en niemand moet nog gokken welke code draait.
  minutes: 2

problem:
  headline: Niemand kan zeggen welke versie van de code live draait
  story: |
    Op dinsdag toont het salesrapport vreemde cijfers. Support vraagt aan de developers: welke [[versie]] van de code
    maakte dit? De ene developer denkt dat het die van vorige week is, een andere denkt dat de fix van maandag er al
    in zit. Drie mensen vergelijken de hele ochtend bestanden met de hand voor ze de oorzaak kunnen zoeken.
  cost: "Elk probleem kost uren extra om op te lossen: drie mensen vergelijken een hele ochtend bestanden."
  visual:
    type: timeline
    days:
      - {label: "Ma", state: ok, note: "Een fix is klaar"}
      - {label: "Di 09:00", state: bad, note: "Het salesrapport lijkt vreemd"}
      - {label: "Di 09:30", state: warn, note: "Welke versie is live?"}
      - {label: "Di 10:30", state: warn, note: "3 mensen vergelijken bestanden"}
      - {label: "Di 12:00", state: bad, note: "Nog altijd geen zeker antwoord"}
    marker: {after: 1, label: "De vraag die niemand kan beantwoorden"}
    caption: Het zoeken naar de versie kost meer dan het zoeken naar de oorzaak.

idea:
  headline: Elke goedgekeurde wijziging krijgt een nummer, en elke omgeving draait één nummer
  points:
    - Een goedgekeurde wijziging krijgt automatisch het volgende versienummer.
    - De goedgekeurde code wordt ingepakt in een verzegeld package dat nooit meer aangepast kan worden, met zijn nummer erop, zoals v1.0.1.
    - Elke [[omgeving]] krijgt te horen welk nummer ze moet draaien, dus één blik beantwoordt de vraag.
  visual:
    type: flow
    nodes:
      - {id: change, label: Goedgekeurde wijziging, state: ok, note: "Iemand keurt het werk goed"}
      - {id: number, label: Het volgende nummer, state: fix, note: "Automatisch gekozen"}
      - {id: package, label: Verzegeld package, state: ok, note: "Achteraf nooit aangepast"}
      - {id: env, label: Elke omgeving, state: ok, note: "Draait één vast nummer"}
    links: [[change, number], [number, package], [package, env]]
    caption: Zoals het editienummer dat in een boek staat.

code:
  - title: Na elke goedgekeurde wijziging wordt een nieuw nummer gekozen
    file: .gitlab-ci.yml
    file_label: De instructies om een versie te nummeren
    from: "latest_tag=$(git tag -l 'v*.*.*'"
    to: "      fi"
    max_lines: 12
    notes:
      - line: "latest_tag=$(git tag -l 'v*.*.*' | sort -V | tail -n 1)"
        says: Het hoogste nummer dat tot nu toe gebruikt werd, wordt opgezocht.
      - line: 'new_tag="${major}.$((minor + 1)).0"'
        says: Een nieuwe functie verhoogt het middelste nummer, bijvoorbeeld v1.1.0.
      - line: 'new_tag="${major}.${minor}.$((patch + 1))"'
        says: Een kleine fix verhoogt het laatste nummer, bijvoorbeeld v1.0.1.
  - title: De goedgekeurde code wordt ingepakt in een verzegeld package
    file: .gitlab-ci.yml
    file_label: De instructies om een versie in te pakken
    from: ".build-image:"
    to: 'docker build'
    max_lines: 12
    notes:
      - line: "image: docker"
        says: Deze tool pakt de code in tot één verzegeld package.
      - line: 'docker build'
        says: Het package draagt het nummer, en niemand past het achteraf aan.
  - title: Elke omgeving zoekt het nummer op dat ze moet draaien
    file: airflow/utils/dbt_pod_utils.py
    file_label: Hoe elke omgeving haar versie kiest
    from: "def resolve_image() -> str:"
    to: 'return f"{DBT_IMAGE_REPOSITORY}:{tag}"'
    max_lines: 12
    notes:
      - line: "tag = str(get_variable"
        says: Elke omgeving bewaart één instelling met haar versienummer.
      - line: "if not tag:"
        says: Is er geen nummer ingesteld, dan draait er niets. Er wordt nooit geraden.
      - line: 'return f"{DBT_IMAGE_REPOSITORY}:{tag}"'
        says: Het package met exact dat nummer is wat draait.

demo:
  intro: >-
    Eerst lezen we de nummers af. Dan wordt één kleine wijziging voorgesteld en goedgekeurd: development krijgt een
    nieuw nummer, terwijl validatie en productie op hun nummer blijven.
  setup: []
  steps:
    - id: now
      title: De nummers aflezen
      say: "Eén nummer per omgeving: het volledige antwoord op wat waar draait."
      button: Tonen wat er draait
      inputs: []
      do:
        - {action: wait, seconds: 1, because: "De nummers aflezen"}
      show:
        - {type: versions, title: "Versie in elke omgeving", caption: "Elke omgeving draait één nummer. Development is de omgeving die hierna wijzigt."}
      outcome: Development, validatie en productie draaien elk exact één genummerde versie, v1.0.0.
    - id: propose
      title: Een kleine wijziging voorstellen
      say: Een onschuldige wijziging wordt uitgeprobeerd in een privékopie. Er is nog niets live.
      button: De wijziging voorstellen
      inputs: []
      do:
        - {action: gitlab.branch, name: demo/clearer-description, from: dev}
        - {action: gitlab.commit, branch: demo/clearer-description, patch: clearer-kpi-description}
        - {action: gitlab.merge_request, source: demo/clearer-description, target: dev, title: "Duidelijkere beschrijving van het managementrapport"}
        - {action: gitlab.wait_pipeline, for: "mr:demo/clearer-description", expect: success, timeout: 600}
      show:
        - {type: pipeline, for: "mr:demo/clearer-description", title: "De automatische testrun", caption: "Klaar betekent dat de wijziging goedgekeurd mag worden."}
        - {type: versions, title: "Versie in elke omgeving", caption: "Niets verschoof."}
      outcome: "De wijziging kwam door haar testrun. De nummers verschoven niet: er is nog niets goedgekeurd."
    - id: accept
      title: De wijziging goedkeuren
      say: Goedkeuren geeft de wijziging een nummer, pakt ze in en deployt ze in development.
      button: De wijziging goedkeuren
      inputs: []
      do:
        - {action: gitlab.merge, source: demo/clearer-description}
        - {action: gitlab.wait_pipeline, for: "tag:^v", expect: success, timeout: 900}
      show:
        - {type: pipeline, for: "tag:^v", title: "Het package maken en deployen", caption: "Het nummer v1.0.1 werd gekozen toen de wijziging goedgekeurd werd. Het package maken verzegelt de goedgekeurde code in één genummerd package; storage bewaart de beschrijving van die versie; deployen laat development het package gebruiken."}
        - {type: versions, before_of: propose, title: "Versie in elke omgeving", caption: "Kijk naar development: het staat op \"Gewijzigd\", van v1.0.0 naar v1.0.1."}
      outcome: Development draait v1.0.1. Validatie en productie draaien nog v1.0.0, en iedereen kan zien welke.
