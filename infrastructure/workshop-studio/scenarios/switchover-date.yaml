id: switchover-date
group: sources
title: "Nieuw scanformaat: overschakelen op een afgesproken dag"
promise: De pakjesdienst verandert op één dag van scanformaat. Wij schakelen mee, zodat geen enkele scan verloren gaat.
minutes: 4
feature: "Een nieuw feedformaat op een afgesproken dag"
status: next
why: "Na een formaatwijziging van de pakjesdienst zijn nieuwe scans onleesbaar en lijken geleverde pakjes zoek voor de klantendienst."
tech: ["dbt_env_vars", "DBT_CARRIER_V2_FROM", "stg_carrier_events"]
environment: dev
related:
  - id: skip-one-table
    why: De omschakeldag is een instelling die een operator zonder nieuwe release kan wijzigen, net als de lijst met overgeslagen tabellen in dat scenario.
reality: "Negen feeds hebben zo'n omschakeldag, meestal één per omgeving, en die dag staat in de code. Voor één feed stond de dag van productie er twee weken te vroeg in. Dat ging zo mee in een release en werd drie weken later rechtgezet."

quiz:
  situation: De pakjesdienst verandert op één dag van scanformaat. Ons rapport begrijpt enkel het oude formaat. Er crasht niets, maar de klantendienst ziet scans niet meer.
  question: Hoe gaan we met het nieuwe formaat om?
  options:
    - label: Oude en nieuwe scans elk op hun eigen manier lezen, vanaf een dag
      impact: Elke scan wordt gelezen in het formaat waarin hij kwam. De dag is een instelling die een operator in een minuut wijzigt, maar hij moet wel juist zijn.
      tone: good
      platform: true
    - label: Het rapport aanpassen naar enkel het nieuwe formaat
      impact: De scans in het nieuwe formaat zijn leesbaar, maar de scans van vóór de wijziging zijn dat niet meer.
      tone: bad
    - label: Aan de pakjesdienst vragen om het oude formaat te blijven sturen
      impact: Het rapport blijft werken zolang de pakjesdienst meewerkt. Het hangt van een andere partij en haar planning af.
      tone: warn
  takeaway: Laat elk formaat gelezen worden op zijn eigen dag, zodat geen enkele scan verloren gaat.
  minutes: 2

problem:
  headline: Pakketscans in het nieuwe formaat van de pakjesdienst verdwijnen uit het rapport
  story: |
    De pakjesdienst stuurt één scan voor elke stap van de reis van een pakje. Vier dagen geleden is ze een nieuw
    scanformaat beginnen te gebruiken, dus met vandaag erbij zijn vijf dagen getroffen. Ons rapport begrijpt enkel
    het oude formaat. Er crasht niets en er gaat geen alarm af: de nieuwe scans komen binnen, maar het rapport kan
    ze niet lezen. Pakjes die geleverd zijn, lijken nooit het magazijn verlaten te hebben, en dat blijft elke dag zo
    tot iemand het rapport aanpast.
  cost: De klantendienst ziet vijf dagen pakketscans niet, ongeveer 110 per dag, en zegt klanten dat hun geleverde pakje zoek is.
  visual:
    type: timeline
    days:
      - {label: 7 dagen geleden, state: ok, note: "Ongeveer 110 scans gelezen"}
      - {label: 6 dagen geleden, state: ok, note: "Ongeveer 110 scans gelezen"}
      - {label: 5 dagen geleden, state: ok, note: "Ongeveer 110 scans gelezen"}
      - {label: 4 dagen geleden, state: bad, note: "0 van ongeveer 110 scans gelezen"}
      - {label: 3 dagen geleden, state: bad, note: "0 van ongeveer 110 scans gelezen"}
      - {label: 2 dagen geleden, state: bad, note: "0 van ongeveer 110 scans gelezen"}
      - {label: Gisteren, state: bad, note: "0 van ongeveer 110 scans gelezen"}
      - {label: Vandaag, state: bad, note: "Tot nu toe 0 scans gelezen"}
    marker: {after: 2, label: De pakjesdienst wijzigt het formaat}
    caption: Vanaf de dag van de wijziging komt elke scan binnen en is geen enkele scan nog leesbaar.

idea:
  headline: Lees oude scans op de oude manier en nieuwe scans op de nieuwe
  points:
    - "We houden twee lezers naast elkaar: één voor het oude scanformaat en één voor het nieuwe."
    - Elke scan gaat naar precies één lezer, naargelang de dag van aankomst, zodat er geen verloren gaat of dubbel geteld wordt.
    - "De omschakeldag is een [[instelling]]: een [[operator]] past ze in een minuut aan, zonder nieuwe [[release]]."
  visual:
    type: flow
    nodes:
      - {id: scans, label: Scans van de pakjesdienst, state: ok, note: "Oud en nieuw formaat komen binnen"}
      - {id: day, label: De omschakeldag, state: fix, note: "Ingesteld door een operator"}
      - {id: old, label: Oude lezer, state: ok, note: "Scans van vóór de omschakeldag"}
      - {id: new, label: Nieuwe lezer, state: ok, note: "Scans vanaf de omschakeldag"}
      - {id: report, label: Het rapport, state: ok, note: "Wat de klantendienst leest"}
    links: [[scans, day], [day, old], [day, new], [old, report], [new, report]]
    caption: De omschakeldag bepaalt welke lezer welke scan krijgt.

code:
  - title: Waar de omschakeldag ingesteld wordt
    file: models/edw_dv_bdv/carrier/stg_carrier_events.sql
    file_label: Het recept van de tabel met pakketscans
    from: "-- The carrier switches its scan format on one day."
    to: "new_format_from = env_var"
    max_lines: 12
    notes:
      - line: "Operators set the moment without a deploy"
        says: Een operator kan de omschakeldag altijd aanpassen, zonder op een release te wachten.
      - line: "the new format never starts"
        says: Stelt niemand een dag in, dan blijft het oude formaat gelezen worden, zoals voorheen.
      - line: "new_format_from = env_var"
        says: Deze regel leest de omschakeldag wanneer de [[nachtelijke load]] start.
  - title: Welke scans de oude lezer neemt
    file: models/edw_dv_bdv/carrier/stg_carrier_events.sql
    file_label: Het recept van de tabel met pakketscans
    from: "old_format as ("
    to: "where _ingested_at < '"
    max_lines: 12
    notes:
      - line: "json_extract_string(payload, 'order_ref')"
        says: De oude lezer vindt het bestelnummer onder zijn oude naam.
      - line: "where _ingested_at < '"
        says: Enkel scans die vóór de omschakeldag aankwamen, gaan naar deze lezer.
  - title: Hoe de omschakeldag bij de nachtelijke load geraakt
    file: airflow/utils/dbt_runtime_overrides.py
    file_label: De code die instellingen aan de nachtelijke load doorgeeft
    from: "prefix: list[str] = []"
    to: "prefix.append(f\"export"
    max_lines: 6
    notes:
      - line: "for name, value in (env_vars or {}).items():"
        says: Elke instelling die de operator invulde, wordt één voor één verwerkt.
      - line: "prefix.append(f\"export"
        says: Elke instelling wordt doorgegeven net voor de nachtelijke load start.

demo:
  intro: De pakjesdienst veranderde vier dagen geleden van scanformaat. Eerst leest het rapport enkel het oude formaat, daarna kies jij de omschakeldag.
  setup:
    - {action: feed.condition, feed: carrier, set: {format_from: "{{ day(-4) }}"}}
    - {action: feed.deliver, days: 7}
  steps:
    - id: without
      title: Eerst zonder omschakeldag
      say: Het rapport leest enkel het oude formaat, dus elke scan sinds de wijziging is rood. De balk van vandaag is korter, want vandaag is nog niet voorbij.
      button: De nachtelijke load runnen
      inputs: []
      do:
        - {action: airflow.set_variable, key: dbt_env_vars, value: {DBT_CARRIER_V2_FROM: "9999-12-31 00:00:00"}}
        - {action: airflow.run_dag, dag: dbt_daily_load, expect: success}
      show:
        - type: bars
          title: Pakketscans per dag
          caption: Elke balk telt de scans die die dag aankwamen. De laatste balk is vandaag en is korter, want vandaag is nog niet voorbij. Rode balken zijn scans die het rapport niet kon lezen.
          query: "select date(_ingested_at) as label, if(is_readable, 'leesbaar', 'onleesbaar') as series, count(*) as value from {{ db('edw_dv_bdv') }}.stg_carrier_events group by label, series order by label desc, series limit 14"
          good: leesbaar
          bad: onleesbaar
          x_label: Dag waarop de scan aankwam (de laatste balk is vandaag)
      outcome: De scans van de laatste 5 dagen komen binnen maar zijn onleesbaar (de rode balken), dus die pakjes lijken zoek.
    - id: with
      title: Kies nu de omschakeldag
      say: Kies de dag waarop de pakjesdienst echt veranderde. Probeer daarna een andere dag en kijk welke scans rood worden.
      button: Dag toepassen en load runnen
      inputs:
        - id: switch_day
          type: day
          label: Overschakelen naar het nieuwe formaat op
          default: "{{ day(-4) }}"
          min: "{{ day(-7) }}"
          max: "{{ day(0) }}"
          help: De gemarkeerde dag is wanneer de pakjesdienst echt veranderde. Probeer een dag ervoor of erna en kijk welke scans rood worden.
          mark: {day: "{{ day(-4) }}", label: de pakjesdienst veranderde het formaat}
      do:
        - {action: airflow.set_variable, key: dbt_env_vars, value: {DBT_CARRIER_V2_FROM: "{{ inputs.switch_day }} 00:00:00"}}
        - {action: airflow.run_dag, dag: dbt_daily_load, expect: success}
      show:
        - type: bars
          before_of: without
          title: Pakketscans per dag
          caption: De laatste balk is vandaag en is korter, want vandaag is nog niet voorbij. Met de dag waarop de pakjesdienst veranderde (4 dagen geleden) is geen enkele balk rood.
          query: "select date(_ingested_at) as label, if(is_readable, 'leesbaar', 'onleesbaar') as series, count(*) as value from {{ db('edw_dv_bdv') }}.stg_carrier_events group by label, series order by label desc, series limit 14"
          good: leesbaar
          bad: onleesbaar
          x_label: Dag waarop de scan aankwam (de laatste balk is vandaag)
      outcome:
        check: "select count(*) from {{ db('edw_dv_bdv') }}.stg_carrier_events where not is_readable"
        good_when: zero
        good: Elke scan wordt gelezen in het formaat waarin hij verstuurd werd, dus geen enkele balk is rood.
        not_quite: "{{ value }} scans (de rode balken) zijn nog altijd onleesbaar: die dag is niet de dag waarop de pakjesdienst veranderde. Probeer de gemarkeerde dag."
