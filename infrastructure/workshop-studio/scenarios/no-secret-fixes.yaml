id: no-secret-fixes
group: releases
title: Een manuele wijziging in productie wordt opgespoord
promise: Elke release vergelijkt eerst de live database met de bewaarde code, en stopt bij een manuele wijziging.
minutes: 2
feature: "Manuele wijzigingen worden opgespoord"
status: next
why: "Een manuele fix in productie verdwijnt stilletjes bij de volgende release, en niemand kan zeggen waarom."
tech: ["audit_environment_drift", "dbt_release", "fail_on_drift"]
environment: val
related:
  - id: numbered-versions
    why: Een release is het genummerde pakket wijzigingen dat daar uitgelegd wordt.
reality: "Een release vloeit nooit terug naar het gedeelde werk. Een herstelling op een release moet dus met de hand een tweede keer gemaakt worden. Bij de jongste release was dat nog niet gebeurd toen we telden."

quiz:
  situation: Op een vrijdagnacht mist een klantentabel in productie een kolom die support nodig heeft. Een engineer voegt ze met de hand toe in de live database en gaat slapen.
  question: Wat moet een release doen met zo'n manuele wijziging?
  options:
    - label: Gewoon doorgaan en de tabel opnieuw builden uit de code
      impact: "Zo gaat het vandaag: de kolom verdwijnt zonder een woord, en support verliest wat het 3 weken gebruikte."
      tone: bad
    - label: Stoppen en noemen welke tabel, wie ze wijzigde en wanneer
      impact: Er wordt niets gebuild of overschreven. De wijziging moet eerst in de code komen en nagekeken worden, daarna gaat de release verder.
      tone: good
      platform: true
    - label: Doorgaan en achteraf melden dat iemand de tabel wijzigde
      impact: Iemand weet het nu wel, maar de tabel is dan al opnieuw gebuild. De kolom is weg voor iemand kan ingrijpen.
      tone: warn
  takeaway: Een wijziging die niet in de code staat, mag een release niet stilletjes overschrijven.
  minutes: 2

problem:
  headline: Een manuele fix 's nachts verdwijnt bij de volgende release
  story: |
    Op een vrijdagnacht mist een klantentabel in productie een kolom die support nodig heeft. Een engineer voegt ze
    met de hand toe, rechtstreeks in de live database, en gaat slapen. Niemand schrijft het op. Drie weken later
    buildt een gewone release de tabel opnieuw uit de code, en de kolom verdwijnt zonder een woord.
  cost: Support verliest een kolom waarmee het 3 weken werkte, en niemand kan zeggen waarom ze verdween.
  visual:
    type: timeline
    days:
      - {label: "Vrijdagnacht", state: warn, note: "1 kolom manueel toegevoegd"}
      - {label: "Ma", state: ok, note: "Support gebruikt de kolom"}
      - {label: "Week 2", state: ok, note: "Alles lijkt in orde"}
      - {label: "Week 3, maandag", state: bad, note: "Gewone release buildt de tabel opnieuw"}
      - {label: "Week 3, dinsdag", state: bad, note: "De kolom is weg"}
    marker: {after: 0, label: "Niemand schreef het op"}
    caption: De fix werkte 3 weken, maar enkel de engineer wist ervan.

idea:
  headline: Voor elke release wordt de live database vergeleken met de code
  points:
    - Het eerste wat een release doet, is zoeken naar een [[manuele wijziging]] in de echte database.
    - Vindt ze er een, dan stopt ze voor er iets gebuild wordt en noemt ze de tabel, wie ze wijzigde en wanneer.
    - De wijziging moet eerst in de code komen, waar ze vastgelegd en nagekeken wordt. Daarna gaat de release verder.
  visual:
    type: flow
    nodes:
      - {id: release, label: Een release start, state: ok, note: "Voor er iets gebuild wordt"}
      - {id: check, label: De vergelijking, state: fix, note: "Echte database tegen de code"}
      - {id: found, label: Manuele wijziging gevonden, state: warn, note: "Noemt tabel, wie en wanneer"}
      - {id: fixfirst, label: Wijziging in de code gezet, state: idle, note: "Eerst vastgelegd en nagekeken"}
      - {id: build, label: De build, state: ok, note: "Pas als er niets meer te vinden is"}
    links: [[release, check], [check, build], [check, found], [found, fixfirst], [fixfirst, build]]
    caption: De release draait niet verder over iets wat ze niet kent.

code:
  - title: De check kijkt wie elke tabel het laatst wijzigde
    file: macros/ops/audit_environment_drift.sql
    file_label: De vergelijkingsinstructies
    from: '{% set creator = row'
    to: ") %}"
    max_lines: 12
    notes:
      - line: "{% if creator not in service_accounts"
        says: Een tabel die het laatst door een persoon werd gewijzigd, en niet door een robot, wordt gemarkeerd.
      - line: "{% set who = ("
        says: De check onthoudt wie de wijziging maakte.
      - line: "else creator"
        says: Wijzigde een robot ze het laatst, dan wordt de naam van de robot gebruikt.
  - title: Een bevinding stopt de release
    file: macros/ops/audit_environment_drift.sql
    file_label: De vergelijkingsinstructies
    from: "{% if findings and fail_on_drift %}"
    to: "{% endif %}"
    max_lines: 12
    notes:
      - line: "{% if findings and fail_on_drift %}"
        says: Als er iets gevonden is, mislukt de check met opzet.
      - line: "Production no longer matches Git"
        says: De boodschap zegt dat de live database niet meer overeenkomt met de bewaarde code.
      - line: "--args '{fail_on_drift: false}'"
        says: Ze noemt ook één bewuste manier om toch door te gaan.
  - title: De check is de allereerste stap van de release
    file: airflow/dags/dbt_release.py
    file_label: De volgorde van de stappen van de release
    from: "drift_task = audit_environment_drift_task()"
    to: "drift_task >> pause_task >> maintenance_task"
    max_lines: 12
    notes:
      - line: "drift_task = audit_environment_drift_task()"
        says: De vergelijking is de eerste stap die de release aanmaakt.
      - line: "drift_task >> pause_task >> maintenance_task"
        says: Al de rest wacht op deze check. Mislukt ze, dan wordt niets gepauzeerd, gebuild of gewijzigd.

demo:
  intro: >-
    Iemand voegt met de hand een kolom toe aan een klantentabel. We tonen dat in validatie, want
    productie mag zelfs in een demo niet aangeraakt worden; dezelfde check bewaakt ook productie. Daarna starten we een
    release, en die weigert door te gaan.
  setup: []
  steps:
    - id: handfix
      title: Een tabel manueel wijzigen
      say: Een engineer voegt rechtstreeks in de database een kolom toe, zonder spoor in de code.
      button: De manuele wijziging maken
      inputs: []
      do:
        - action: sql.exec
          as: pu_admin
          statement: "alter table {{ db('im_dimensional') }}.dim_olist_customers add column hotfix_flag int"
          expect: ok
          undo: "alter table {{ db('im_dimensional') }}.dim_olist_customers drop column hotfix_flag"
          rebuild: true
      show:
        - type: table
          title: Kolommen van de klantentabel
          caption: "Eén kolom is nieuw: hotfix_flag, de rode regel. De code vermeldt ze niet."
          query: "select column_name, case when column_name = 'hotfix_flag' then 'NEE: manueel toegevoegd' else 'ja' end as in_code from information_schema.columns where table_schema = '{{ db('im_dimensional') }}' and table_name = 'dim_olist_customers' order by ordinal_position"
          as: root
          columns: [{key: column_name, label: Kolom in de database}, {key: in_code, label: "In de code vermeld?"}]
          highlight: {column: column_name, equals: hotfix_flag, as: bad}
      outcome: De klantentabel heeft nu 1 extra kolom, hotfix_flag, die nergens in de code bestaat.
    - id: release
      title: De release starten
      say: De release voert haar eerste check uit en weigert verder te gaan.
      button: De release starten
      inputs: []
      do:
        - {action: airflow.run_dag, dag: dbt_release, conf: {}, expect: failed, timeout: 600}
      show:
        - type: table
          title: Tabellen gewijzigd door een persoon
          caption: De eerste check leest wie elke tabel het laatst wijzigde. Enkel de robots van de stack mogen dat.
          query: "select table_name as changed_table, alter_user as changed_by, date_format(alter_time, '%H:%i') as changed_at from information_schema.tables where table_schema in ('{{ db('edw_dv_rdv') }}', '{{ db('edw_dv_bdv') }}', '{{ db('im_dimensional') }}') and coalesce(nullif(alter_user, ''), create_user) not like 'svc\\_%' order by table_name"
          as: root
          columns: [{key: changed_table, label: Tabel}, {key: changed_by, label: Gewijzigd door}, {key: changed_at, label: Om}]
          highlight: {column: changed_by, equals: pu_admin, as: bad}
          empty: Geen enkele tabel werd door een persoon gewijzigd.
        - {type: tasks, dag: dbt_release, title: "De release, stap voor stap", caption: "1 check mislukt (rood). Alles wat iets zou builden of overschrijven werd bewust overgeslagen (grijs); enkel de foutmail en het hervatten van de nachtelijke load liepen nog."}
      outcome: De release stopte bij haar eerste check en noemde de klantentabel en de persoon die ze wijzigde. Er werd niets gebuild of overschreven.
