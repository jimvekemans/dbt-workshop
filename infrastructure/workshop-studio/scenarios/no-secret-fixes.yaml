id: no-secret-fixes
group: releases
title: A fix made by hand in production is detected
promise: Before every release, the live database is compared with the saved code, and a hand-made change stops it.
minutes: 2
environment: val
related:
  - id: numbered-versions
    why: A release is the numbered bundle of changes explained there.

problem:
  headline: A fix made by hand at night vanishes in the next release
  story: |
    On a Friday night a customer table in production is missing a column that support needs. An engineer adds it
    by hand, directly in the live database, and goes to bed. Nobody writes it down. Three weeks later a normal
    release rebuilds the table from the code, and the column silently disappears.
  cost: Support loses a column it used for 3 weeks, and nobody can say why it vanished.
  visual:
    type: timeline
    days:
      - {label: "Fri night", state: warn, note: "1 column added by hand"}
      - {label: "Mon", state: ok, note: "Support uses the column"}
      - {label: "Week 2", state: ok, note: "Everything seems fine"}
      - {label: "Week 3, Monday", state: bad, note: "Normal release rebuilds the table"}
      - {label: "Week 3, Tuesday", state: bad, note: "The column is gone"}
    marker: {after: 0, label: "Nobody wrote it down"}
    caption: The fix worked for 3 weeks, but only the engineer knew about it.

idea:
  headline: Before every release, the live database is compared with the code
  points:
    - The first thing a release does is look for any [[hand-made change]] in the real database.
    - If it finds one, it stops before anything is built and names the table, who changed it and when.
    - The change must first be put into the code, where it is recorded and reviewed. Then the release continues.
  visual:
    type: flow
    nodes:
      - {id: release, label: A release starts, state: ok, note: "Before anything is built"}
      - {id: check, label: The comparison, state: fix, note: "Real database against the code"}
      - {id: found, label: Hand-made change found, state: warn, note: "Names table, who and when"}
      - {id: fixfirst, label: Change put in the code, state: idle, note: "Recorded and reviewed first"}
      - {id: build, label: The build, state: ok, note: "Only when nothing is left to find"}
    links: [[release, check], [check, build], [check, found], [found, fixfirst], [fixfirst, build]]
    caption: The release refuses to run over something it does not know about.

code:
  - title: The check looks at who last changed each table
    file: macros/ops/audit_environment_drift.sql
    file_label: The comparison instructions
    from: '{% set creator = row'
    to: ") %}"
    max_lines: 12
    notes:
      - line: "{% if creator not in service_accounts"
        says: A table last changed by a person, not by a robot, is flagged.
      - line: "{% set who = ("
        says: The check remembers who made the change.
      - line: "else creator"
        says: If a robot changed it last, the robot's name is used instead.
  - title: A finding stops the release
    file: macros/ops/audit_environment_drift.sql
    file_label: The comparison instructions
    from: "{% if findings and fail_on_drift %}"
    to: "{% endif %}"
    max_lines: 12
    notes:
      - line: "{% if findings and fail_on_drift %}"
        says: If anything was found, the check fails on purpose.
      - line: "Production no longer matches Git"
        says: The message says the live database no longer matches the saved code.
      - line: "--args '{fail_on_drift: false}'"
        says: It also names one deliberate way to go ahead anyway.
  - title: The check is the very first step of the release
    file: airflow/dags/dbt_release.py
    file_label: The order of the release's steps
    from: "drift_task = audit_environment_drift_task()"
    to: "drift_task >> pause_task >> maintenance_task"
    max_lines: 12
    notes:
      - line: "drift_task = audit_environment_drift_task()"
        says: The comparison is the first step the release creates.
      - line: "drift_task >> pause_task >> maintenance_task"
        says: Everything else waits for this check. If it fails, nothing is paused, built or changed.

demo:
  intro: >-
    Someone adds a column to a customer table by hand. We show it in validation, our checking copy, because
    production must not be touched even in a demo; the same check guards production. Then we start a release, which
    refuses to run.
  setup: []
  steps:
    - id: handfix
      title: Change a table by hand
      say: An engineer adds a column straight in the database, with no record in the code.
      button: Make the hand-made change
      inputs: []
      do:
        - action: sql.exec
          as: pu_admin
          statement: "alter table {{ db('im_dimensional') }}.dim_olist_customers add column hotfix_flag int"
          expect: ok
          undo: "alter table {{ db('im_dimensional') }}.dim_olist_customers drop column hotfix_flag"
          rebuild: true
      show:
        - type: table
          title: Columns of the customers table
          caption: "One column is new: hotfix_flag, the red line. The code does not list it."
          query: "select column_name, case when column_name = 'hotfix_flag' then 'NO: added by hand' else 'yes' end as in_code from information_schema.columns where table_schema = '{{ db('im_dimensional') }}' and table_name = 'dim_olist_customers' order by ordinal_position"
          as: root
          columns: [{key: column_name, label: Column in the database}, {key: in_code, label: "Listed in the code?"}]
          highlight: {column: column_name, equals: hotfix_flag, as: bad}
      outcome: The customers table now has 1 extra column, hotfix_flag, that exists nowhere in the code.
    - id: release
      title: Start the release
      say: The release runs its first check and refuses to go on.
      button: Start the release
      inputs: []
      do:
        - {action: airflow.run_dag, dag: dbt_release, conf: {}, expect: failed, timeout: 600}
      show:
        - type: table
          title: Tables changed by a person
          caption: The first check reads who last changed each table. Only the stack's robots may.
          query: "select table_name as changed_table, alter_user as changed_by, date_format(alter_time, '%H:%i') as changed_at from information_schema.tables where table_schema in ('{{ db('edw_dv_rdv') }}', '{{ db('edw_dv_bdv') }}', '{{ db('im_dimensional') }}') and coalesce(nullif(alter_user, ''), create_user) not like 'svc\\_%' order by table_name"
          as: root
          columns: [{key: changed_table, label: Table}, {key: changed_by, label: Changed by}, {key: changed_at, label: At}]
          highlight: {column: changed_by, equals: pu_admin, as: bad}
          empty: No table was changed by a person.
        - {type: tasks, dag: dbt_release, title: "The release, step by step", caption: "1 check failed (red). Everything that would build or overwrite something was skipped (grey) on purpose; only the failure mail and the resuming of the nightly load still ran."}
      outcome: The release stopped at its first check and named the customers table and the person who changed it. Nothing was built or overwritten.
