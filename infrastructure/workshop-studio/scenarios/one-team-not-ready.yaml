id: one-team-not-ready
group: releases
title: De wijziging van één team uit een release halen
promise: Als één team niet klaar is, wacht enkel de wijziging van dat team en kan het andere team leveren.
minutes: 3
feature: "De wijziging van één team uit een release halen"
status: today
tech: ["modified GitFlow", "revert on release/*", "verify_release", "release/YYYY-Qx"]
environment: val
related:
  - id: numbered-versions
    why: Elke goedgekeurde wijziging kreeg een nummer toen ze in het gedeelde werk kwam. Hier dient dat nummer om de wijziging te vinden die eruit moet.
reality: "In één release gingen 15 van de 20 nieuwe wijzigingen er op releasedag weer uit. Wat eruit gaat, blijft in het gedeelde werk zitten en moet er bij elke volgende release opnieuw uit: twee wijzigingen werden er zo vier keer uitgehaald."

quiz:
  situation: Twee teams hebben hun werk afgerond en beide wijzigingen zitten in de release van morgen. Vandaag blijkt dat de reviewcijfers van team reviews nog niet kloppen. Team payments is in orde.
  question: Wat doe je met de release van morgen?
  options:
    - label: Enkel de wijziging van team reviews eruit halen en de rest leveren
      impact: Het betalingenoverzicht komt in de release, die opnieuw als geheel gecontroleerd wordt. Team reviews sluit aan bij de volgende release.
      tone: good
      platform: true
    - label: De hele release uitstellen tot beide teams klaar zijn
      impact: Niets onafgewerkts gaat live, maar finance wacht een hele releasecyclus op een overzicht dat klaar was.
      tone: warn
    - label: Beide wijzigingen leveren en de reviewcijfers later rechtzetten
      impact: De release is op tijd, maar marketing krijgt reviewcijfers die niemand vertrouwt.
      tone: bad
  takeaway: Een release is een lijst wijzigingen, en één punt kan doorgehaald worden zonder de rest te vertragen.
  minutes: 2

problem:
  headline: De onafgewerkte wijziging van het ene team houdt de afgewerkte van het andere tegen
  story: |
    Twee teams hebben hun werk afgerond en beide wijzigingen zitten in de volgende [[release]], gepland voor morgen.
    Vandaag ontdekt team reviews laat dat hun cijfers nog niet kloppen. Team payments is in orde. Zonder manier om
    één wijziging eruit te halen, zijn er maar twee keuzes: iedereen uitstellen of iets onafgewerkts leveren.
  cost: Finance wacht een hele releasecyclus op een betalingenoverzicht dat klaar was, of marketing krijgt reviewcijfers die niemand vertrouwt.
  visual:
    type: flow
    nodes:
      - {id: pay, label: "Wijziging van payments", state: ok, note: "Klaar"}
      - {id: rev, label: "Wijziging van reviews", state: bad, note: "Niet klaar"}
      - {id: release, label: "Release", state: warn, note: "Gepland voor morgen"}
      - {id: live, label: "Live gaan", state: bad, note: "Iedereen uitstellen of beide leveren"}
    links: [[pay, release], [rev, release], [release, live]]
    caption: Twee wijzigingen, één release, één deadline.

idea:
  headline: De wijziging van één team kan eruit gehaald worden, en de rest wordt geleverd
  points:
    - De release wordt voorbereid op een eigen kopie van de code, dus het gedeelde werk in opbouw hoeft nooit stil te vallen.
    - Een onafgewerkte wijziging wordt enkel uit de release gehaald, met het nummer dat ze bij het goedkeuren kreeg, en blijft in het gedeelde werk.
    - De release wordt opnieuw als geheel gecontroleerd en gaat live onder haar eigen nummer. Het team dat wachtte, sluit aan bij de volgende.
  visual:
    type: flow
    nodes:
      - {id: daily, label: Gedeeld werk in opbouw, state: ok, note: "Bevat beide wijzigingen"}
      - {id: takeout, label: Eén wijziging eruit halen, state: fix, note: "Via haar versienummer"}
      - {id: release, label: De release, state: ok, note: "Bevat de afgewerkte wijziging"}
      - {id: live, label: Live gaan, state: ok, note: "Onder een eigen nummer"}
    links: [[daily, takeout], [takeout, release], [release, live]]
    caption: Een release is een lijst wijzigingen, en één punt kan doorgehaald worden.

code:
  - title: De hele release wordt opnieuw gecontroleerd nadat de wijziging eruit is
    file: .gitlab-ci.yml
    file_label: De instructies voor de automatische checks
    from: "verify_release:"
    to: 'CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    max_lines: 12
    notes:
      - line: "extends: .verify-full"
        says: Een release wordt volledig gecontroleerd, niet enkel de gewijzigde delen.
      - line: 'release\/[0-9]'
        says: Elke kopie met de naam release/<jaar>-<kwartaal> krijgt deze check automatisch.
  - title: Live gaan geeft de release een eigen nummer
    file: .gitlab-ci.yml
    file_label: De instructies om een release te nummeren
    from: 'existing_tag=$(git tag -l'
    to: "      fi"
    max_lines: 8
    notes:
      - line: "existing_tag=$(git tag"
        says: Ze zoekt naar eerdere nummers van dezelfde release.
      - line: 'new_tag="${release_name}.0"'
        says: De eerste keer krijgt de release het nummer .0.
      - line: 'new_tag="${release_name}.$((${existing_tag##*.} + 1))"'
        says: Latere releases van hetzelfde kwartaal tellen er telkens één bij.

demo:
  intro: >-
    Twee teams hebben elk een wijziging afgerond, en beide zitten in het gedeelde werk. We builden de release zonder
    het team dat niet klaar is, en zetten ze live in validatie.
  setup:
    - {action: gitlab.branch, name: demo/feature/team-payments, from: dev}
    - {action: gitlab.commit, branch: demo/feature/team-payments, patch: team-payments}
    - {action: gitlab.merge_request, source: demo/feature/team-payments, target: dev, title: "feat: betalingenoverzicht"}
    - {action: gitlab.merge, source: demo/feature/team-payments}
    # wait for the first team's number before the second team delivers: two deliveries seconds apart make GitLab
    # cancel the first one's numbering, and both changes would end up under one number
    - {action: gitlab.wait_pipeline, for: "tag:^v1\\.1\\.0$", expect: success, timeout: 600}
    - {action: gitlab.branch, name: demo/feature/team-reviews, from: dev}
    - {action: gitlab.commit, branch: demo/feature/team-reviews, patch: team-reviews}
    - {action: gitlab.merge_request, source: demo/feature/team-reviews, target: dev, title: "feat: overzicht van de reviewscores"}
    - {action: gitlab.merge, source: demo/feature/team-reviews}
    - {action: gitlab.wait_pipeline, for: "tag:^v1\\.2\\.0$", expect: success, timeout: 900}
  steps:
    - id: takeout
      title: De release builden zonder het onafgewerkte team
      say: "Kies het team dat niet klaar is: zijn wijziging wordt uit de kopie voor de release gehaald, die daarna opnieuw gecontroleerd wordt."
      button: De release builden
      inputs:
        - id: not_ready
          type: choice
          label: Welk team is niet klaar?
          default: v1.2.0
          options:
            - {value: v1.1.0, label: "Team payments"}
            - {value: v1.2.0, label: "Team reviews"}
          help: "Kies het team waarvan de wijziging niet af is: die wordt eruit gehaald. In het verhaal is team reviews (v1.2.0) niet klaar; payments is v1.1.0."
      do:
        - {action: gitlab.branch, name: release/2026-Q4, from: dev}
        - {action: git.revert_on_release, branch: release/2026-Q4, tag: "{{ inputs.not_ready }}"}
        - {action: gitlab.wait_pipeline, for: "ref:release/2026-Q4", expect: success, timeout: 900}
      show:
        - {type: result, from_action: git.revert_on_release, title: "Wat er in de release zit", caption: "Kijk naar de twee regels: één wijziging is eruit gehaald, één blijft erin. De wijziging van team payments is v1.1.0, die van team reviews v1.2.0."}
        - {type: pipeline, for: "ref:release/2026-Q4", title: "Volledige controle van de release", caption: "Elk vakje moet klaar zijn voor de release verder mag."}
        - {type: versions, title: "Versie in elke omgeving"}
      outcome: De release bevat het gedeelde werk min de wijziging van het gekozen team. Development draait nog beide wijzigingen.
    - id: golive
      title: De release live zetten
      say: De gecontroleerde kopie wordt de release en gaat live in validatie onder een eigen nummer. Productie wacht op een persoon.
      button: Live zetten
      inputs: []
      do:
        - {action: git.promote_release, branch: release/2026-Q4}
        - {action: gitlab.wait_pipeline, for: "tag:^2026-Q4\\.", expect: success, timeout: 900}
      show:
        - {type: result, from_action: git.promote_release, title: "Wat er gebeurd is", caption: "De gecontroleerde kopie wordt doorgegeven om live te gaan."}
        - {type: pipeline, for: "tag:^2026-Q4\\.", title: "De release nummeren en live zetten", caption: "Productie wordt nooit automatisch gewijzigd: een persoon moet goedkeuren. In deze demo doet niemand dat, dus de stap blijft bewust op \"Wacht op een persoon\" staan."}
        - {type: versions, before_of: takeout, title: "Versie in elke omgeving", caption: "Validatie draait nu 2026-Q4.0, development en productie houden hun nummer. Een releasenummer leest als jaar, kwartaal, teller: 2026-Q4.0 is de eerste release van het vierde kwartaal van 2026."}
      outcome: De release heeft nummer 2026-Q4.0 en draait in validatie. Het team dat niet klaar was, zit er niet in.
