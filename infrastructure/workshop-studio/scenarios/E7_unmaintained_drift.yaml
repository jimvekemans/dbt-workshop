id: E7_unmaintained_drift
layer: engineering
title: "Source drift breaks a model nobody owns"
summary: "The web-analytics team renames referrer to traffic_source. Lazy select-* staging passes the change straight through; the only model that reads the column is a legacy node without an owner - and it turns the whole daily load red."
focus: [channel.web, dbt.stg_web_events, dbt.int_web_top_pages]
detect: "int_web_top_pages fails in the LDV daily load: Unknown column 'referrer'."
requires:
  - {action: check_sql, env: dev, statement: "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = 'analytics_dev' AND table_name = 'raw_web_events' AND column_name = 'referrer'", expect: 1, hint: "the LDV landing table is already renamed: press Reset first"}
  - {action: check_sql, env: dev, statement: "SELECT COUNT(*) FROM raw_web_events WHERE visitor_id LIKE 'bot-%'", expect: 0, hint: "E8 left crawler traffic in the LDV landing table: press Reset first"}
inject:
  narrative: "The web-analytics team tidies up its naming: referrer is now traffic_source. Their loader writes the new column from today on. It is their table - nobody tells the data platform. The rename is permanent: Reset restores the landing table."
  sim:
    channel.web: {health: warn, note: "LDV: referrer renamed to traffic_source"}
    dbt.int_web_top_pages: {health: fail, note: "Unknown column 'referrer'"}
    airflow.daily_load: {health: fail, note: "LDV: dbt_build failed"}
  live:
    - {action: sql, env: dev, statement: "ALTER TABLE raw_web_events CHANGE referrer traffic_source"}
    - {action: trickle, env: dev, days: 1}
    - {action: airflow_trigger, env: dev, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
impact:
  - {node: exposure.marketing_nps_dashboard, health: warn, note: "top pages stale"}
  - {node: consumer.marketing, health: warn}
steps:
  - title: "Detect: a red daily load on a node nobody knows"
    explain: "stg_web_events is `select *`: it rebuilt happily with traffic_source instead of referrer. int_web_top_pages - built in 2023 for a campaign, no owner, no tests, no docs - selects referrer and fails. It is in the daily load like everything else, so the whole load is red (and its ready signal waits)."
    code: |
      Failed model int_web_top_pages
        Error 1054 (42S22): Unknown column 'referrer' in 'field list'
    zoom: platform
    highlight: [dbt.int_web_top_pages, dbt.stg_web_events, airflow.daily_load]
    expect: {node: dbt.int_web_top_pages, health: fail}
  - title: "Who owns it?"
    explain: "meta.owner_team: none, no group, no exposure that names it - yet the marketing dashboard reads it every morning. Unmaintained nodes are where drift lands: nobody watches them, but someone still uses them. Find the consumer before you delete or fix anything."
    code: |
      dbt ls --select int_web_top_pages+ --output json --output-keys unique_id config
      select * from vdp_mgmt.dbt_run_results where name = 'int_web_top_pages' order by run_started_at desc;
    zoom: consumers
    highlight: [dbt.int_web_top_pages, exposure.marketing_nps_dashboard, consumer.marketing]
  - title: "Stopgap: exclude it - allowed in the lineage, not executed"
    explain: "disabled_dbt_models (Airflow Variable, appended to --exclude): the legacy node keeps its last good table and its place in the lineage, it just does not run. The rest of LDV is green again tonight, without touching the code."
    code: "airflow variables set disabled_dbt_models '[\"int_web_top_pages\"]'   # airflow-dev"
    zoom: platform
    highlight: [airflow.levers, dbt.int_web_top_pages, airflow.daily_load]
    sim:
      airflow.levers: {health: warn, note: "LDV disabled_dbt_models=[int_web_top_pages]"}
      airflow.daily_load: {health: ok, note: "LDV: success (legacy node excluded)"}
    live:
      - {action: airflow_variable, env: dev, key: disabled_dbt_models, value: ["int_web_top_pages"]}
      - {action: airflow_trigger, env: dev, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
    expect: {node: airflow.daily_load, health: ok}
  - title: "Fix at the boundary: an explicit staging contract"
    explain: "Staging selects explicit columns and renames them to OUR names: traffic_source stays referrer for everything downstream. The next unannounced change fails in stg_web_events - owned and watched by the platform team - instead of in a model nobody watches. (Incremental models: on_schema_change='fail' instead of 'sync_all_columns', which would also drop the old column's history.)"
    code: |
      select event_id, visitor_id, customer_ref, event_type, page,
             traffic_source as referrer, event_ts, _ingested_at
      from {{ source('raw_web', 'raw_web_events') }}
    zoom: platform
    highlight: [git.feature, git.dev, dbt.stg_web_events]
    sim:
      git.feature: {health: ok}
      dbt.stg_web_events: {health: ok, note: "explicit contract merged"}
    live:
      - {action: gitlab_branch, name: bugfix/web-staging-contract, ref: dev}
      - {action: gitlab_commit_patch, patch: fix-web-staging-contract, branch: bugfix/web-staging-contract}
      - {action: gitlab_mr_merge, source: bugfix/web-staging-contract, target: dev, patch: fix-web-staging-contract, timeout: 900}
  - title: "Rebuild, lift the exclude - and give the node an owner"
    explain: "Delete the Variable; the next daily load builds the legacy node again from the stable contract. Then decide its future: an owner and a test, or a deprecation_date and a conversation with Marketing."
    code: |
      airflow variables delete disabled_dbt_models
      - name: int_web_top_pages
        deprecation_date: 2026-12-31   # or: config: {meta: {owner_team: domain_b}}
    zoom: platform
    highlight: [dbt.int_web_top_pages, airflow.levers]
    sim:
      channel.web: {health: ok, note: "traffic_source is the web team's name now"}
      dbt.int_web_top_pages: {health: ok, note: ""}
      airflow.levers: {health: ok, note: "no lever set"}
      airflow.daily_load: {health: ok, note: ""}
      exposure.marketing_nps_dashboard: {health: ok, note: ""}
      consumer.marketing: {health: ok}
    live:
      - {action: airflow_variable, env: dev, key: disabled_dbt_models, delete: true}
      - {action: gitlab_pipeline_wait, tag_of: dev, expect: success, timeout: 900}
      - {action: airflow_trigger, env: dev, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
    expect: {node: dbt.int_web_top_pages, health: ok}
