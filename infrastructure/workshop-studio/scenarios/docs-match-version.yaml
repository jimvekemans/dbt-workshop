id: docs-match-version
group: releases
title: The documentation always describes the version that runs
promise: Development, validation and production each get documentation written from the package that goes live there.
minutes: 3
environment: dev
related:
  - id: numbered-versions
    why: Every environment runs one numbered version. Here the documentation follows that number.

problem:
  headline: People read a description that no longer says what the report does
  story: |
    The description of the management report was written by hand in the spring. Since then the report has been
    changed twice, but nobody updated the page, and it never said which month an order is counted in. A new analyst
    assumes the month of delivery, builds her presentation on that, and only finds out in the meeting that orders
    count in the month they were placed. The developers spend the afternoon explaining which text is still true.
  cost: A new analyst presents the wrong meaning of the report to the managers, and the developers lose an afternoon explaining.
  visual:
    type: timeline
    days:
      - {label: "Spring", state: ok, note: "The page is written by hand"}
      - {label: "Summer", state: warn, note: "The report changes, the page does not"}
      - {label: "Autumn", state: warn, note: "The report changes again"}
      - {label: "Monday", state: bad, note: "A new analyst trusts the page"}
      - {label: "Tuesday", state: bad, note: "Wrong reading shown in a meeting"}
    marker: {after: 1, label: "The page is now wrong"}
    caption: "Nobody forgot on purpose: the page was simply never part of going live."

idea:
  headline: Each environment's documentation page is written from the package that goes live
  points:
    - Going live writes the documentation page of that [[environment]] from the very same package, in the same step.
    - Every environment has its own documentation page, so validation can show the old text while development shows the new one.
    - The old pages are removed first, so no page can describe an earlier version.
  visual:
    type: flow
    nodes:
      - {id: package, label: Numbered package, state: ok, note: "Code and descriptions together"}
      - {id: golive, label: Going live, state: fix, note: "Writes the documentation"}
      - {id: page, label: Documentation page, state: ok, note: "Written from that package"}
      - {id: reader, label: The reader, state: ok, note: "Reads what runs there"}
    links: [[package, golive], [golive, page], [page, reader]]
    caption: The description and the version can never drift apart.

code:
  - title: The documentation is written while going live
    file: .gitlab-ci.yml
    file_label: The instructions for putting a version live
    from: "mkdir -p /state/docs"
    to: "airflow variables set dbt_image_tag"
    max_lines: 12
    notes:
      - line: "mkdir -p /state/docs"
        says: The old pages of this environment are removed first.
      - line: "dbt docs generate"
        says: New pages are written from the package that is going live, and made readable for everybody.
      - line: "airflow variables set dbt_image_tag"
        says: Only after that does the environment learn which version it runs.

demo:
  intro: >-
    We read the description of one report on the documentation pages of development and validation. Then a description
    that says more is accepted: development shows it under the new version, validation still shows the old one.
  setup: []
  steps:
    - id: read
      title: Read the documentation pages today
      say: The same report is read on the documentation page of development and on the one of validation.
      button: Read both pages
      inputs: []
      do:
        - {action: docs.read_description, envs: [dev, val], expect: same}
      show:
        - {type: result, from_action: docs.read_description, title: "What each documentation page says", caption: "Two lines per environment: the version it runs and when its page was written, then the description the page shows."}
        - {type: versions, title: "Version in each environment", caption: "All three environments run the same version, so their pages agree."}
      outcome: Both pages describe the report with the same sentence, for the same version.
    - id: accept
      title: Accept a clearer description
      say: A developer adds to the description which month an order is counted in. Accepting gives the change a new version number and puts it live in development, with its own documentation.
      button: Accept the change
      inputs: []
      do:
        - {action: gitlab.branch, name: demo/clearer-description, from: dev}
        - {action: gitlab.commit, branch: demo/clearer-description, patch: report-description-meaning}
        - {action: gitlab.merge_request, source: demo/clearer-description, target: dev, title: "Say which month an order is counted in"}
        - {action: gitlab.merge, source: demo/clearer-description}
        - {action: gitlab.wait_pipeline, for: "tag:^v", expect: success, timeout: 900}
        - {action: docs.read_description, envs: [dev, val], expect: different}
      show:
        - {type: result, before_of: read, from_action: docs.read_description, title: "What each documentation page says", caption: "Development shows the new sentence under its new version. Validation still runs the old version, so its page rightly shows the old sentence. Each page matches the version that runs there."}
        - {type: versions, before_of: read, title: "Version in each environment", caption: "Only development moved to a new version."}
      outcome: Development's page now says which month an order is counted in, under the new version. Validation's page still shows the old sentence, for the version that runs there.
