id: checked-before-merge
group: changes
title: Elke wijziging krijgt eerst een testrun in een privékopie
promise: Een automatische testrun vindt de fout in een voorstel, lang voor een rapport fout is.
minutes: 3
tech: ["CI verify", "verify_feature_to_dev", "drop_nodes", "data tests on a merge request"]
environment: dev
related:
  - id: own-workbench
    why: Elke testrun werkt in zijn eigen privékopie, hetzelfde idee als de eigen tabellen van een developer daar.
reality: "In twee weken tijd moesten dubbele rijen hersteld worden in drie tabellen die andere teams lezen. Een wijziging aan 333 bestanden werd goedgekeurd, de dag erna teruggedraaid, een week later opnieuw goedgekeurd en opnieuw teruggedraaid."

quiz:
  situation: Een developer verbetert de bestellingentabel. De wijziging lijkt klein en onschuldig, maar per ongeluk staat elke bestelling er nu drie keer in. Het managementrapport leest die tabel.
  question: Wat gebeurt er met de wijziging voor ze goedgekeurd wordt?
  options:
    - label: Eerst automatisch laten testen in een privékopie
      impact: De testrun vindt de fout en blokkeert de wijziging. De gedeelde tabellen blijven ongewijzigd en de privékopie wordt achteraf weggegooid.
      tone: good
      platform: true
    - label: Laten nakijken door een collega, want ze lijkt klein
      impact: Een wijziging die klein lijkt, wordt niet echt nagekeken. De fout bereikt het managementrapport, dat drie keer te veel bestellingen toont.
      tone: bad
    - label: Goedkeuren en achteraf de cijfers laten nakijken
      impact: Het rapport is meteen fout. Finance stuurt de raad van bestuur een aantal dat drie keer te hoog is, en de developers zoeken een dag naar de oorzaak.
      tone: bad
  takeaway: Een fout kost weinig zolang ze in een privékopie zit, en veel zodra het rapport ze toont.
  minutes: 2

problem:
  headline: Eén kleine wijziging doet elke bestelling drie keer meetellen
  story: |
    Een developer verbetert de bestellingentabel en per ongeluk staat elke bestelling nu drie keer in de tabel. De
    wijziging lijkt klein, dus niemand kijkt ze na. Later zegt het managementrapport dat de webshop drie keer zoveel
    bestellingen kreeg als in werkelijkheid. Finance heeft dat getal al naar de raad van bestuur gestuurd.
  cost: Finance stuurt de raad van bestuur een aantal bestellingen dat drie keer te hoog is, en de developers zijn een dag kwijt aan het zoeken naar de oorzaak.
  visual:
    type: flow
    nodes:
      - {id: change, label: "Wijziging van de developer", state: warn, note: "Lijkt onschuldig"}
      - {id: orders, label: "Bestellingentabel", state: bad, note: "Elke bestelling drie keer"}
      - {id: report, label: "Managementrapport", state: bad, note: "Drie keer te veel bestellingen"}
      - {id: board, label: "Raad van bestuur", state: bad, note: "Beslissingen op foute cijfers"}
    links: [[change, orders], [orders, report], [report, board]]
    caption: Eén foute stap en alles erna is ook fout.

idea:
  headline: Elk voorstel krijgt eerst een testrun, en een mislukte testrun blokkeert het
  points:
    - De automatische testrun buildt enkel opnieuw wat de wijziging raakt, plus de rapporten die ervan afhangen.
    - Dat gebeurt in een [[sandbox]], een privékopie in de database met de naam van de wijziging, en daar lopen alle checks.
    - Bij rood is de wijziging geblokkeerd, en de sandbox wordt achteraf altijd weggegooid.
  visual:
    type: flow
    nodes:
      - {id: change, label: Voorstel, state: idle, note: "Nog niet goedgekeurd"}
      - {id: rehearsal, label: Automatische testrun, state: fix, note: "In een sandbox"}
      - {id: result, label: Rood of groen, state: idle, note: "Rood blokkeert de wijziging"}
      - {id: shared, label: Gedeelde tabellen, state: ok, note: "Enkel groene wijzigingen komen aan"}
    links: [[change, rehearsal], [rehearsal, result], [result, shared]]
    caption: De testrun vindt de fout, niet de mensen die het rapport lezen.

code:
  - title: De testrun die bij elk voorstel loopt
    file: .gitlab-ci.yml
    file_label: De instructies voor de automatische checks
    from: "needs: [verify_structure]"
    to: "dbt build --select state:modified+"
    max_lines: 12
    notes:
      - line: "needs: [verify_structure]"
        says: Deze tweede ronde start pas als de eerste ronde, met lege kopieën, gelukt is.
      - line: "VERIFY_SCHEMA:"
        says: De sandbox heeft de naam van de wijziging, dus twee testruns storen elkaar nooit.
      - line: "!reference [.rehearsal-prepare, script]"
        says: De wijziging wordt uitgeprobeerd bovenop het nieuwste werk van iedereen.
      - line: "dbt build --select state:modified+"
        says: Enkel de gewijzigde tabellen en de tabellen die ervan afhangen worden opnieuw gebuild en gecontroleerd.
  - title: De sandbox achteraf opkuisen
    file: .gitlab-ci.yml
    file_label: De instructies voor de automatische checks
    from: ".verify:"
    to: "dbt run-operation drop_nodes"
    max_lines: 12
    notes:
      - line: "after_script:"
        says: Dit loopt altijd op het einde, ook als de testrun mislukt is.
      - line: "dbt run-operation drop_nodes"
        says: Het gooit elke tabel weg die de testrun gebuild heeft, zodat er niets achterblijft.

demo:
  intro: >-
    Een developer stelt een wijziging voor die de bestellingentabel kapotmaakt. De automatische testrun weigert ze
    en laat daarna de herstelde wijziging door.
  setup: []
  steps:
    - id: broken
      title: Een foute wijziging voorstellen
      say: |
        De developer voegt een leveringskalender toe aan de bestellingentabel, en per ongeluk staat elke bestelling
        drie keer in de tabel. De testrun vangt het op.
      button: De wijziging voorstellen
      inputs: []
      do:
        - {action: gitlab.branch, name: demo/orders-calendar, from: dev}
        - {action: gitlab.commit, branch: demo/orders-calendar, patch: orders-triple-count}
        - {action: gitlab.merge_request, source: demo/orders-calendar, target: dev, title: "Leveringskalender toevoegen aan de bestellingentabel"}
        - {action: gitlab.wait_pipeline, for: "mr:demo/orders-calendar", expect: failed, timeout: 600}
      show:
        - {type: pipeline, for: "mr:demo/orders-calendar", title: "De automatische testrun", caption: "Een mislukte stap betekent dat de wijziging niet goedgekeurd kan worden. De regel eronder zegt wat er misliep."}
        - type: number
          title: Bestellingen in de gedeelde tabel
          caption: "De gedeelde tabel werd nooit aangeraakt: het aantal bestellingen is gelijk aan het aantal verschillende bestelnummers, dus elke bestelling staat er één keer in."
          query: "select count(*) from {{ db('im_dimensional') }}.fct_olist_orders"
          unit: bestellingen
          compare_to:
            query: "select count(distinct order_id) from {{ db('im_dimensional') }}.fct_olist_orders"
            label: Daarvan verschillende bestelnummers
      outcome: De testrun is mislukt omdat eenzelfde bestelnummer meer dan één keer opgeslagen zou worden. Deze wijziging kan niet goedgekeurd worden, en de gedeelde tabel is ongewijzigd.
    - id: fixed
      title: De wijziging herstellen
      say: De developer haalt de fout weg en stuurt de wijziging opnieuw door.
      button: De herstelde wijziging doorsturen
      inputs: []
      do:
        - {action: gitlab.commit, branch: demo/orders-calendar, patch: orders-fixed}
        - {action: gitlab.wait_pipeline, for: "mr:demo/orders-calendar", expect: success, timeout: 600}
      show:
        - {type: pipeline, before_of: broken, for: "mr:demo/orders-calendar", title: "De automatische testrun", caption: "Elke stap is klaar, dus de wijziging mag goedgekeurd worden."}
        - type: number
          title: Bestellingen in de gedeelde tabel
          caption: "Nog altijd één regel per bestelling: de herstelde wijziging kreeg enkel een testrun, ze is nog niet goedgekeurd."
          query: "select count(*) from {{ db('im_dimensional') }}.fct_olist_orders"
          unit: bestellingen
          compare_to:
            query: "select count(distinct order_id) from {{ db('im_dimensional') }}.fct_olist_orders"
            label: Daarvan verschillende bestelnummers
      outcome: De herstelde wijziging komt door de testrun. Goedkeuren is de volgende stap, maar die zit niet in deze demo.
