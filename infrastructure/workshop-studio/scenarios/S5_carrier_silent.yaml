id: S5_carrier_silent
layer: sources
title: "The carrier stops delivering"
summary: "The carrier's tracking API goes quiet. One critical delivery guard turns the whole PRD daily load red - two Airflow levers keep the rest of the platform on time without a deploy."
star: true
focus: [channel.carrier, landing.raw_carrier_tracking_events, airflow.levers]
detect: "assert_carrier_events_delivered (critical) fails in the PRD daily load; source freshness reports raw_carrier_tracking_events stale."
requires:
  - {action: check_sql, env: prod, statement: "SELECT COUNT(*) FROM raw_carrier_tracking_events WHERE JSON_EXTRACT_STRING(payload, 'eventTime') IS NOT NULL", expect: 0, hint: "S6 left carrier API v2 payloads in the PRD landing table: press Reset first"}
inject:
  narrative: "An outage at the carrier: their tracking API stops pushing scans. Parcels keep moving and Olist orders keep landing - only the scans are missing, four days and counting. The delivery guard on the carrier feed is critical, so tonight's PRD daily load fails - and with it the ready signal every consumer waits for."
  sim:
    channel.carrier: {health: fail, note: "API outage: no scans for 4 days", knobs.delay_batches: 5}
    landing.raw_carrier_tracking_events: {health: fail, note: "newest scan 4 days behind"}
    airflow.daily_load: {health: fail, note: "PRD: dbt_build failed on the carrier guard"}
  live:
    # held, not lost: the carrier re-sends its backlog when it is back (step 5)
    - {action: set_channel, env: prod, channel: carrier, delay_batches: 5}
    - {action: trickle, env: prod, days: 1}
    - {action: trickle, env: prod, days: 1}
    - {action: trickle, env: prod, days: 1}
    - {action: trickle, env: prod, days: 1}
    - {action: airflow_trigger, env: prod, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
impact:
  - {node: dbt.stg_carrier_tracking_events, health: warn, note: "skipped: guard failed"}
  - {node: dbt.fct_olist_deliveries, health: warn, note: "skipped"}
  - {node: dbt.mart_olist_management_kpi, health: warn, note: "skipped"}
  - {node: exposure.management_delivery_kpi, health: fail, note: "delivery KPI not refreshed"}
  - {node: exposure.finance_revenue_report, health: warn, note: "waits for the ready signal"}
  - {node: consumer.management, health: warn}
  - {node: consumer.finance, health: warn}
steps:
  - title: "Detect: one feed turns the whole daily load red"
    explain: "The guard fails, dbt skips the carrier models after it, and `dbt build` exits 1 - so dbt_build fails, and the Cronacle ready signal and the dataset outlets do not fire. Finance and Marketing wait as well, although their data is complete. Source freshness reports the same lag, but only informationally."
    code: |
      dbt build --selector daily_load --warn-error --target run
      #   Failed test  assert_carrier_events_delivered      (newest scan 4 days behind the clock)
      #  Skipped model stg_carrier_tracking_events_v1 ... fct_olist_deliveries ... mart_olist_management_kpi
    zoom: platform
    highlight: [landing.raw_carrier_tracking_events, airflow.daily_load]
    expect: {node: airflow.daily_load, health: fail}
  - title: "Lever 1: exclude the feed - it stays in the lineage"
    explain: "The Airflow Variable `disabled_dbt_models` is appended to `--exclude` of the daily load. The carrier nodes stay in the project: refs resolve, docs and state comparison stay intact, and the carrier tables keep their last good build - Management sees last week's delivery KPI instead of a fake collapse. Source freshness still reports the carrier stale. No deploy, no code change."
    code: |
      airflow variables set disabled_dbt_models '["source:raw_carrier+"]'
      # dbt build --selector daily_load --exclude source:raw_carrier+ ...
    zoom: platform
    highlight: [airflow.levers, airflow.daily_load, landing.raw_carrier_tracking_events]
    sim:
      airflow.levers: {health: warn, note: "PRD disabled_dbt_models=[source:raw_carrier+]"}
      airflow.daily_load: {health: ok, note: "PRD: success (carrier excluded)"}
      exposure.finance_revenue_report: {health: ok, note: ""}
      consumer.finance: {health: ok}
    live:
      - {action: airflow_variable, env: prod, key: disabled_dbt_models, value: ["source:raw_carrier+"]}
      - {action: airflow_trigger, env: prod, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
    expect: {node: airflow.daily_load, health: ok}
  - title: "Day 4: out until the next deploy window - .dbtignore, done wrong"
    explain: "The carrier replaces its API only next quarter. Until that release the feed should be out of the project: not built, not tested, no freshness alarm, not in the docs. The Variable `dbt_daily_load_dbtignore` writes paths to .dbtignore before dbt starts. Ignoring just the carrier folders breaks the parse: mart_olist_management_kpi lives outside them and refs fct_olist_deliveries - 'Ref not found' - and NOTHING runs. Worse than the outage itself."
    code: |
      airflow variables delete disabled_dbt_models
      airflow variables set dbt_daily_load_dbtignore '["models/*/carrier/", "tests/carrier/"]'
      # [error] DependencyNotFound (dbt1048): Ref 'fct_olist_deliveries' not found in project
    zoom: platform
    highlight: [airflow.levers, dbt.mart_olist_management_kpi, airflow.daily_load]
    sim:
      airflow.levers: {health: warn, note: "PRD dbt_daily_load_dbtignore=[models/*/carrier/, tests/carrier/]"}
      airflow.daily_load: {health: fail, note: "PRD: parse error - Ref 'fct_olist_deliveries' not found"}
      exposure.finance_revenue_report: {health: warn, note: "waits for the ready signal"}
      consumer.finance: {health: warn}
    live:
      - {action: airflow_variable, env: prod, key: disabled_dbt_models, delete: true}
      - {action: airflow_variable, env: prod, key: dbt_daily_load_dbtignore, value: ["models/*/carrier/", "tests/carrier/"]}
      - {action: airflow_trigger, env: prod, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
    expect: {node: airflow.daily_load, health: fail}
  - title: "Lever 2: .dbtignore every dependant too"
    explain: "Add the mart and the yml that holds its exposure. Now the carrier feed is out of the project: the build, its tests and the source-freshness task skip it, the docs do not show it. Compared with the exclude list: wider (freshness, docs, exposures) and riskier (one missed dependant fails the whole load; and project-vs-database cleanups such as macros/utils/clean_orphaned_models.sql see the ignored tables as orphans). Keep each feed in its own folders and this list stays short."
    code: |
      airflow variables set dbt_daily_load_dbtignore '["models/*/carrier/", "tests/carrier/",
        "models/im_dimensional/mart_olist_management_kpi.sql", "models/im_dimensional/olist_management.yml"]'
    zoom: platform
    highlight: [airflow.levers, airflow.daily_load]
    sim:
      airflow.levers: {health: warn, note: "PRD dbt_daily_load_dbtignore=[carrier feed + management KPI]"}
      airflow.daily_load: {health: ok, note: "PRD: success (carrier feed ignored)"}
      exposure.finance_revenue_report: {health: ok, note: ""}
      consumer.finance: {health: ok}
    live:
      - {action: airflow_variable, env: prod, key: dbt_daily_load_dbtignore, value: ["models/*/carrier/", "tests/carrier/", "models/im_dimensional/mart_olist_management_kpi.sql", "models/im_dimensional/olist_management.yml"]}
      - {action: airflow_trigger, env: prod, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
    expect: {node: airflow.daily_load, health: ok}
  - title: "The carrier is back: lift the lever, catch up"
    explain: "The carrier re-sends its whole backlog in one go (in order - see E6 for what out-of-order scans do). Delete the Variable, and the next daily load builds the carrier models again from everything that landed."
    code: |
      airflow variables delete dbt_daily_load_dbtignore
      UPDATE _held_batches SET release_at_batch = 0 WHERE channel = 'carrier';   -- backlog re-sent now
      UPDATE _source_channel_config SET delay_batches = 0 WHERE channel = 'carrier';
    zoom: platform
    highlight: [channel.carrier, landing.raw_carrier_tracking_events, airflow.levers]
    sim:
      channel.carrier: {health: ok, note: "", knobs.delay_batches: 0}
      landing.raw_carrier_tracking_events: {health: ok, note: "backlog delivered"}
      airflow.levers: {health: ok, note: "no lever set"}
      airflow.daily_load: {health: ok, note: ""}
      dbt.stg_carrier_tracking_events: {health: ok, note: ""}
      dbt.fct_olist_deliveries: {health: ok, note: ""}
      dbt.mart_olist_management_kpi: {health: ok, note: ""}
      exposure.management_delivery_kpi: {health: ok, note: ""}
      consumer.management: {health: ok}
    live:
      - {action: airflow_variable, env: prod, key: dbt_daily_load_dbtignore, delete: true}
      - {action: sql, env: prod, statement: "UPDATE _held_batches SET release_at_batch = 0 WHERE channel = 'carrier'"}
      - {action: set_channel, env: prod, channel: carrier, delay_batches: 0}
      - {action: trickle, env: prod, days: 1}
      - {action: airflow_trigger, env: prod, dag: dbt_daily_load, conf: {manual_run_override: true}, allow_failure: true}
    expect: {node: landing.raw_carrier_tracking_events, health: ok}
