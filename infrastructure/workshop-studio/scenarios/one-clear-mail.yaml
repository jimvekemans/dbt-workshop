id: one-clear-mail
group: daily
title: Een mislukte nacht levert één duidelijke mail op
promise: Mislukt de nacht, dan krijgt de persoon van wacht één korte mail die zegt wat mislukte, geen muur van tekst.
minutes: 3
feature: "Eén duidelijke mail na een mislukte nacht"
status: today
tech: ["failure e-mail", "send_failure_report", "dbt_failure_report.py"]
environment: dev
related:
  - id: redo-only-what-failed
    why: Na het lezen van de mail en het herstellen van de oorzaak wordt enkel het mislukte deel opnieuw gerund.
reality: "De foutmail bestaat van in de eerste maanden. Later kwam er één verfijning bij: runs die iemand met de hand start om iets te testen, sturen geen mail meer, zodat de mailbox leesbaar blijft."

quiz:
  situation: Om 03:10 stopt de nachtelijke load door een fout. De persoon van wacht moet 's morgens snel weten wat er misliep, terwijl collega's in de chat al vragen wat er gebeurd is.
  question: Hoe komt de persoon van wacht aan de oorzaak?
  options:
    - label: Eén korte mail met de mislukte check bovenaan laten sturen
      impact: De mail noemt de mislukte check, telt wat geslaagd, mislukt en niet gerund is, en komt één keer per nacht. De logregels staan eronder, voor wie ze wil nalezen.
      tone: good
      platform: true
    - label: Een mail met het volledige log erin laten sturen
      impact: De mail is er meteen, maar de ene regel die telt zit nog altijd tussen honderden andere. Het zoekwerk verhuist van het log naar de mail.
      tone: warn
    - label: Het log laten openen en de juiste regel laten zoeken
      impact: Elke fout kost de persoon van wacht ongeveer 20 minuten lezen voor het herstel kan beginnen. Ondertussen zijn de rapporten al uren fout.
      tone: bad
  takeaway: Een goede foutmail zegt wat er misliep, niet alles wat er gebeurd is.
  minutes: 2

problem:
  headline: De nacht mislukt en de oorzaak zit begraven in honderden regels
  story: |
    Om 03:10 stopt de nacht. 's Morgens opent de persoon van wacht het [[log]]: honderden regels van een dozijn
    stappen, met de ene regel die telt ergens in het midden. Twintig minuten later is duidelijk dat drie bestellingen
    geen bestelnummer hebben. Dan zijn de rapporten al uren fout en vragen collega's in de chat wat er gebeurd is.
  cost: Elke fout kost de persoon van wacht ongeveer 20 minuten lezen voor het herstel kan beginnen.
  visual:
    type: flow
    nodes:
      - {id: fail, label: De nacht mislukt, state: bad, note: "03:10"}
      - {id: logs, label: Honderden logregels, state: warn, note: "Eén regel telt"}
      - {id: find, label: Iemand zoekt, state: warn, note: "Ongeveer 20 minuten"}
      - {id: fix, label: Het herstel begint, state: idle, note: "Pas na het zoeken"}
    links: [[fail, logs], [logs, find], [find, fix]]
    caption: Niets zegt het team waar het moet kijken.

idea:
  headline: Eén mail per mislukte nacht, met het antwoord bovenaan
  points:
    - Mislukt een stap, dan verzamelt een laatste stap wat er misliep en schrijft die het op.
    - De mail noemt de mislukte check en telt wat geslaagd, mislukt en niet gerund is.
    - Hij wordt één keer per nacht verstuurd, hoeveel stappen er ook mislukten, met de laatste logregels eronder.
  visual:
    type: flow
    nodes:
      - {id: steps, label: De stappen van de nacht, state: ok, note: "Elk ervan kan mislukken"}
      - {id: last, label: De laatste stap, state: fix, note: "Draait enkel na een fout"}
      - {id: mail, label: Eén mail, state: ok, note: "Mislukte check, tellingen, logregels"}
      - {id: team, label: Inbox van de persoon van wacht, state: ok, note: "In één minuut gelezen"}
    links: [[steps, last], [last, mail], [mail, team]]
    caption: De mail doet het lezen, zodat het team kan herstellen.

code:
  - title: Een laatste stap die enkel na een fout draait
    file: airflow/utils/dbt_dag_utils.py
    file_label: Hulpfuncties voor de stappen van de nacht
    from: "@task(task_id=REPORT_TASK_ID"
    to: "send_failure_report_for_run(context"
    max_lines: 6
    notes:
      - line: "trigger_rule=\"one_failed\""
        says: In een goede nacht blijft deze stap stil; elke mislukte stap zet hem in gang.
      - line: "One mail: dbt findings"
        says: "Hij verstuurt precies één mail: de bevindingen, de checkresultaten en de laatste logregels."
  - title: Hij hangt aan het einde van de nacht
    file: airflow/dags/dbt_daily_load.py
    file_label: De lijst met stappen van de nacht
    from: "# 6. One failure report per run, whichever task failed"
    to: ">> failure_report_task()"
    max_lines: 4
    notes:
      - line: "# 6. One failure report per run"
        says: Eén mail per nacht, welke stap ook mislukte.
      - line: "failure_report_task()"
        says: Elke stap van de nacht leidt naar de mailstap, dus elke fout stuurt hem.
  - title: De onderwerpregel van de mail
    file: airflow/utils/dbt_failure_report.py
    file_label: De code die de foutmail schrijft
    from: "    parts = []"
    to: "    return f\"[{_environment(ctx)}]"
    max_lines: 12
    notes:
      - line: "{_count(t.failed_checks, 'check', 'checks')} mislukt"
        says: Mislukte checks worden eerst geteld.
      - line: "{_count(t.not_run, 'stap', 'stappen')} niet gerund"
        says: Stappen die nooit liepen, worden ook geteld.
      - line: "_load_label(ctx)"
        says: Het onderwerp noemt de omgeving, de job en wat mislukte of niet gerund werd.

demo:
  intro: Drie bestellingen komen binnen zonder bestelnummer. De nacht mislukt en daarna openen we de mail van de persoon van wacht.
  setup:
    - {action: mail.clear}
    - {action: feed.condition, feed: orders, set: {bad_rows: 3}}
    - {action: feed.deliver, days: 1}
  steps:
    - id: fail
      title: De nacht mislukt
      say: Een check vindt 3 bestellingen zonder bestelnummer en stopt de nacht.
      button: De nacht runnen
      inputs: []
      do:
        - {action: airflow.run_dag, dag: dbt_daily_load, expect: failed}
      show:
        - {type: tasks, dag: dbt_daily_load, title: De nacht, caption: '1 stap van de nacht mislukte: "Alle rapporten builden". Een check erin vond de 3 bestellingen. De laatste stap van de nacht verstuurde daarna de foutmail.'}
      outcome: "1 stap van de nacht mislukte en de nacht stopte daar; de laatste stap verstuurde daarna de mail."
    - id: mail
      title: De mail in de inbox
      say: Dit is alles wat de persoon van wacht ontvangt. De mislukte check staat bovenaan; de logregels staan helemaal onderaan.
      button: De mail openen
      inputs: []
      do:
        - {action: wait, seconds: 2, because: "De mail wordt verstuurd door de laatste stap van de nacht"}
      show:
        - {type: mail, match: Nachtelijke load mislukt, title: De mail voor de persoon van wacht, caption: 'De stack schrijft deze mail zelf, in gesproken Vlaams. Het onderwerp begint met "[development] Nachtelijke load mislukt" en noemt daarna de mislukte check en het aantal stappen dat niet gerund is. De mislukte check staat onder "Wat mislukte". De laatste regels uit de log, voor de developer, staan helemaal onderaan.'}
      outcome: De mail noemt de mislukte check helemaal bovenaan. De logregels staan pas eronder, voor de developer die ze wil nalezen.
