id: back-in-seconds
group: releases
title: Een foute versie draai je in seconden terug
promise: "Terug naar de versie van gisteren: je wijzigt één nummer, je herstelt niets."
minutes: 3
feature: "Teruggaan door één nummer te wijzigen"
status: next
why: "Een foute versie blijft live terwijl developers onder druk de code herstellen, en sales werkt uren met foute totalen."
tech: ["image tag rollback", "dbt_image_tag"]
environment: dev
related:
  - id: numbered-versions
    why: Daar worden genummerde versies uitgelegd. Hier komt er een tweede versie bij, zodat er iets is om naar terug te gaan.

problem:
  headline: Een foute versie die om 8:00 live gaat, geeft foute totalen tot 14:00
  story: |
    Om 8:00 gaat een nieuwe [[versie]] live. Om 9:00 ziet het salesteam foute totalen. De developers kunnen de
    toestand van gisteren niet zomaar terugzetten, want die bestaat nergens als één geheel. Ze herstellen de nieuwe code
    onder druk, en de foute totalen blijven tot in de namiddag op het scherm.
  cost: Sales werkt 6 uur met foute cijfers, en een haastige reparatie kan nieuwe fouten veroorzaken.
  visual:
    type: timeline
    days:
      - {label: "08:00", state: ok, note: "Nieuwe versie gaat live"}
      - {label: "09:00", state: bad, note: "Sales ziet foute totalen"}
      - {label: "10:30", state: bad, note: "Developers zoeken de oorzaak"}
      - {label: "12:30", state: warn, note: "Een haastige reparatie gaat live"}
      - {label: "14:00", state: ok, note: "Totalen weer correct na 6 uur"}
    marker: {after: 1, label: "Het probleem wordt opgemerkt"}
    caption: Zes uur foute totalen, voor iets wat één instelling in seconden had kunnen terugdraaien.

idea:
  headline: Teruggaan komt neer op de omgeving het vorige nummer laten draaien
  points:
    - Elke versie wordt bewaard als verzegeld package, dus de versie van gisteren bestaat nog precies zoals ze was.
    - "Teruggaan is één [[instelling]] wijzigen: het nummer dat de omgeving moet draaien."
    - Daarna zoek je de oorzaak zonder tijdsdruk, en de herstelde versie gaat opnieuw live onder een nieuw nummer.
  visual:
    type: flow
    nodes:
      - {id: setting, label: Eén instelling, state: fix, note: "Bepaalt welke versie draait"}
      - {id: newest, label: Nieuwste versie, state: bad, note: "Niet gebruikt na het teruggaan"}
      - {id: previous, label: Vorige versie, state: ok, note: "Bewaard precies zoals ze was"}
      - {id: env, label: De omgeving, state: ok, note: "Draait wat de instelling zegt"}
    links: [[setting, newest], [setting, previous], [newest, env], [previous, env]]
    caption: Eerst weer in orde brengen. Dan uitzoeken wat er misliep.

code:
  - title: De omgeving draait het nummer dat ze krijgt
    file: airflow/utils/dbt_pod_utils.py
    file_label: Hoe elke omgeving haar versie kiest
    from: "def resolve_image() -> str:"
    to: 'return f"{DBT_IMAGE_REPOSITORY}:{tag}"'
    max_lines: 12
    notes:
      - line: "tag = str(get_variable"
        says: Bij elke start van een job wordt het nummer uit één instelling gelezen.
      - line: "if not tag:"
        says: Is er geen nummer ingesteld, dan draait er niets. Er wordt nooit geraden.
      - line: 'return f"{DBT_IMAGE_REPOSITORY}:{tag}"'
        says: Het verzegelde package met dat nummer wordt gebruikt. De oudere staan er nog.
  - title: Een versie live zetten is datzelfde nummer wegschrijven
    file: .gitlab-ci.yml
    file_label: De instructies om een versie live te zetten
    from: 'docker run --rm -u root --network workshop_net -v "workshop_${DEPLOY_ENV}:/state"'
    to: "airflow variables set dbt_image_tag"
    max_lines: 8
    notes:
      - line: "dbt docs generate --target run"
        says: Eerst wordt de documentatie van exact die versie geschreven, als deel van het live zetten.
      - line: "airflow variables set dbt_image_tag"
        says: Eén regel zet een versie live, en met een ouder nummer gaat ze terug.

demo:
  intro: >-
    Development heeft twee versies om tussen te wisselen. Eerst lezen we het nummer af, dan gaan we één versie terug en daarna weer vooruit.
  setup:
    - {action: gitlab.branch, name: demo/second-version, from: dev}
    - {action: gitlab.commit, branch: demo/second-version, patch: clearer-kpi-description}
    - {action: gitlab.merge_request, source: demo/second-version, target: dev, title: "Duidelijkere beschrijving van het managementrapport"}
    - {action: gitlab.merge, source: demo/second-version}
    - {action: gitlab.wait_pipeline, for: "tag:^v", expect: success, timeout: 900}
  steps:
    - id: before
      title: Wat development nu draait
      say: Development draait de nieuwste versie, v1.0.1, en die verdenken we ervan de totalen te verknoeien.
      button: De versie tonen
      inputs: []
      do:
        - {action: wait, seconds: 1, because: "De nummers aflezen"}
      show:
        - {type: versions, title: "Versie in elke omgeving", caption: "Kijk naar development: daar staat v1.0.1."}
      outcome: Development draait v1.0.1, de nieuwste versie.
    - id: back
      title: Teruggaan naar de vorige versie
      say: "Eén instelling verandert: let op het nummer."
      button: Teruggaan
      inputs: []
      do:
        - {action: deploy.set_version, tag: previous}
      show:
        - {type: versions, before_of: before, title: "Versie in elke omgeving", caption: "Kijk naar development: dat is de enige omgeving die wijzigt."}
        - {type: result, title: "Wat er gebeurd is", caption: "Enkel het nummer dat development moet draaien werd gewijzigd. Het is hetzelfde verzegelde package v1.0.0: er werd niets opnieuw gebuild."}
      outcome: Development draait weer v1.0.0. Enkel het versienummer werd gewijzigd.
    - id: forward
      title: Weer vooruitgaan
      say: "Stel dat de oorzaak opgelost is: met dezelfde soort stap zet je de nieuwste versie opnieuw live. In deze demo is niets hersteld."
      button: Vooruitgaan
      inputs: []
      do:
        - {action: deploy.set_version, tag: latest}
      show:
        - {type: versions, before_of: back, title: "Versie in elke omgeving", caption: "Kijk naar development: dat is de enige omgeving die wijzigt."}
      outcome: Development draait weer v1.0.1. Teruggaan en vooruitgaan zijn dezelfde soort stap.
