id: production-waits
group: releases
title: Productie wacht op de goedkeuring van een persoon
promise: Een release gaat vanzelf live in validatie, en hetzelfde package bereikt productie na één goedkeuring.
minutes: 3
feature: "Productie pas na goedkeuring door een persoon"
status: today
tech: ["deploy_prd (manual)", "deploy_val", "release tag"]
environment: val
related:
  - id: numbered-versions
    why: Daar wordt het genummerde package uitgelegd dat validatie en productie draaien.
  - id: one-team-not-ready
    why: Dat scenario stelt de release samen. Hier kijken we naar de laatste stap, de goedkeuring voor productie.

problem:
  headline: Een release die niemand goedkeurde, gaat live voor alle klanten
  story: |
    Donderdagnamiddag, laat, is een [[release]] klaar. De automatische deploy is zo ingesteld dat ze gewoon
    doorloopt: validatie, dan productie, meteen na elkaar. Niemand bekeek de release in validatie, en niemand werd
    iets gevraagd. Vrijdagochtend zien alle klanten foute leveringscijfers, en het team dat de release maakte, is pas
    maandag terug.
  cost: Alle klanten zien het hele weekend foute cijfers, en niemand kan zeggen wie de release toeliet.
  visual:
    type: flow
    nodes:
      - {id: release, label: Afgewerkte release, state: ok, note: "Donderdagnamiddag"}
      - {id: val, label: Validatie, state: warn, note: "Donderdagavond: niemand kijkt ernaar"}
      - {id: prd, label: Productie, state: bad, note: "Donderdagnacht: gaat vanzelf live"}
      - {id: shop, label: Alle klanten, state: bad, note: "Vrijdagochtend: zien de foute cijfers"}
    links: [[release, val], [val, prd], [prd, shop]]
    caption: Eén automatische keten, en niemand erin die stop kan zeggen.

idea:
  headline: Validatie gaat vanzelf live, productie wacht op een persoon
  points:
    - De release gaat automatisch live in validatie, zodat iedereen er daar eerst naar kan kijken.
    - Hetzelfde verzegelde package wordt aan productie aangeboden, maar die stap wacht tot een persoon goedkeurt. Tot dan draait productie haar oude versie.
    - De stap legt vast wie goedkeurde en wanneer; wie mag drukken is een [[instelling]] van het team, en in dit oefensysteem is dat niet beperkt.
  visual:
    type: flow
    nodes:
      - {id: release, label: Genummerde release, state: ok, note: "Eén verzegeld package"}
      - {id: val, label: Validatie, state: ok, note: "Gaat vanzelf live"}
      - {id: approve, label: Een persoon keurt goed, state: fix, note: "Productie wacht hierop"}
      - {id: prd, label: Productie, state: ok, note: "Hetzelfde package"}
    links: [[release, val], [val, approve], [approve, prd]]
    caption: Enkel de laatste stap vraagt een beslissing, en die wordt vastgelegd.

code:
  - title: Productie start pas als een persoon het zegt
    file: .gitlab-ci.yml
    file_label: De instructies om een versie live te zetten
    from: "deploy_prd:"
    to: "when: manual"
    max_lines: 12
    notes:
      - line: "extends: .deploy"
        says: Productie gebruikt dezelfde stappen om live te gaan als elke andere omgeving.
      - line: "needs: [build_image, publish_artifacts, deploy_val]"
        says: Productie wordt pas aangeboden nadat het package, de opgeslagen beschrijving en validatie klaar zijn.
      - line: "- if: *release_tag"
        says: Productie wordt enkel aangeboden voor genummerde releases.
      - line: "when: manual"
        says: Zelfs dan wacht ze tot een persoon op de knop drukt.
  - title: Validatie start vanzelf
    file: .gitlab-ci.yml
    file_label: De instructies om een versie live te zetten
    from: "deploy_val:"
    to: "- if: *release_tag"
    max_lines: 12
    notes:
      - line: "extends: .deploy"
        says: Validatie gebruikt dezelfde stappen om live te gaan.
      - line: "- if: *release_tag"
        says: Ze start vanzelf voor elke genummerde release.

demo:
  intro: >-
    Een release wordt voorbereid en gaat vanzelf live in validatie. Productie wacht. Dan keurt een persoon goed, en
    hetzelfde package gaat live in productie.
  setup:
    - {action: gitlab.branch, name: release/2026-Q4, from: dev}
    - {action: gitlab.wait_pipeline, for: "ref:release/2026-Q4", expect: success, timeout: 900}
  steps:
    - id: release
      title: De release doorgeven
      say: De gecontroleerde release wordt doorgegeven. Validatie gaat vanzelf live, productie wacht.
      button: De release doorgeven
      inputs: []
      do:
        - {action: git.promote_release, branch: release/2026-Q4}
        - {action: gitlab.wait_pipeline, for: "tag:^2026-Q4\\.", expect: success, timeout: 900}
      show:
        - {type: pipeline, for: "tag:^2026-Q4\\.", title: "De release nummeren en live zetten", caption: "Kijk naar de laatste regel: productie wacht op een persoon."}
        - {type: versions, title: "Versie in elke omgeving", caption: "Validatie draait de nieuwe release 2026-Q4.0 (vierde kwartaal 2026, eerste release) en kan nu bekeken worden. Productie draait nog haar oude versie."}
      outcome: De release draait in validatie. Productie is niet gewijzigd en wacht op een persoon.
    - id: approve
      title: Productie goedkeuren
      say: Een persoon drukt op goedkeuren bij de wachtende stap. Hetzelfde package gaat live in productie.
      button: Productie goedkeuren
      inputs: []
      do:
        - {action: gitlab.play_job, job: deploy_prd, for: "tag:^2026-Q4\\.", timeout: 600}
      show:
        - {type: pipeline, before_of: release, for: "tag:^2026-Q4\\.", title: "De release nummeren en live zetten", caption: "De laatste regel wachtte op een persoon. Nu is ze klaar."}
        - {type: versions, before_of: release, title: "Versie in elke omgeving", caption: "Productie draait nu dezelfde release als validatie."}
        - {type: result, from_action: gitlab.play_job, title: "Wie goedkeurde", caption: "De naam en het tijdstip van wie op de knop drukte, worden bij deze release bewaard. Hier is dat de eigen login van de Studio, Administrator."}
      outcome: Productie draait de release die validatie draaide, en de goedkeuring is vastgelegd met een naam en een tijdstip.
