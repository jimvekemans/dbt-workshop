- id: team.platform
  label: Platform & Ingest
  kind: team
  group: platform
  x: 420
  y: 80
  desc: Sources, stg_*, Airflow DAGs, CI, dbt_release / dbt_reload.
  owner: platform
- id: team.core
  label: Core model
  kind: team
  group: platform
  x: 640
  y: 80
  desc: dim_olist_customers, fct_olist_orders, datum.
  owner: core
- id: team.domain_a
  label: Domain A squad
  kind: team
  group: platform
  x: 860
  y: 80
  desc: Payments -> Finance. stg/dim_olist_payments, finance mart.
  owner: domain_a
- id: team.domain_b
  label: Domain B squad
  kind: team
  group: platform
  x: 1080
  y: 80
  desc: Reviews -> Marketing. stg/dim_olist_reviews, marketing mart.
  owner: domain_b
- id: landing.raw_olist_orders
  label: raw_olist_orders
  kind: landing
  group: platform
  x: 420
  y: 180
  desc: Webapp orders (with CDC status updates). In LDV also the QA team's smoke-test orders - DEV-only dirty data, warn in
    LDV / error in PRD (dynamic severity).
  owner: platform
  tests:
  - source_accepted_values_raw_olist_raw_olist_orders
  - source_not_null_raw_olist_raw_olist_orders
  - source_expression_is_true_raw_olist_raw_olist_orders
  - assert_orders_not_after_simulation_clock
- id: landing.raw_olist_customers
  label: raw_olist_customers
  kind: landing
  group: platform
  x: 420
  y: 280
  desc: Webapp customers.
  owner: platform
  tests:
  - source_not_null_raw_olist_raw_olist_customers
- id: landing.raw_olist_order_payments
  label: raw_olist_order_payments
  kind: landing
  group: platform
  x: 420
  y: 380
  desc: 'Domain A: Kafka payments. Freshness warn 1d / error 3d.'
  owner: domain_a
  tests:
  - source_not_null_raw_olist_raw_olist_order_payments
  - unique_combination_of_columns_raw_olist_raw_olist_order_payments
- id: landing.raw_olist_order_reviews
  label: raw_olist_order_reviews
  kind: landing
  group: platform
  x: 420
  y: 480
  desc: 'Domain B: drive reviews.'
  owner: domain_b
  tests:
  - source_not_null_raw_olist_raw_olist_order_reviews
- id: dbt.stg_olist_orders
  label: stg_olist_orders
  kind: dbt
  group: platform
  x: 700
  y: 180
  desc: 'Incremental staging, dedup per order_id. Two models with this name (model swap): the PRD variant is lean, the DEV
    variant also drops QA smoke-test orders.'
  owner: platform
  models:
  - stg_olist_orders
- id: dbt.stg_olist_customers
  label: stg_olist_customers
  kind: dbt
  group: platform
  x: 700
  y: 280
  desc: Incremental staging, dedup per customer_id.
  owner: platform
- id: dbt.stg_olist_payments
  label: stg_olist_payments
  kind: dbt
  group: platform
  x: 700
  y: 380
  desc: 'Domain A staging. Grain: order_id x payment_sequential.'
  owner: domain_a
  tests:
  - stg_olist_payments
- id: dbt.stg_olist_reviews
  label: stg_olist_reviews
  kind: dbt
  group: platform
  x: 700
  y: 480
  desc: Domain B staging. unique(review_id, order_id) guards duplicate files.
  owner: domain_b
  tests:
  - stg_olist_reviews
- id: dbt.dim_olist_customers
  label: dim_olist_customers
  kind: dbt
  group: platform
  x: 980
  y: 180
  desc: Customer dimension.
  owner: core
- id: dbt.fct_olist_orders
  label: fct_olist_orders
  kind: dbt
  group: platform
  x: 980
  y: 280
  desc: Central order fact shared by all domains - a breaking change here ripples everywhere (state:modified+).
  owner: core
  tests:
  - fct_olist_orders
- id: dbt.dim_olist_payments
  label: dim_olist_payments
  kind: dbt
  group: platform
  x: 980
  y: 380
  desc: Payment-grain dimension (order total repeated per payment row!).
  owner: domain_a
- id: dbt.dim_olist_reviews
  label: dim_olist_reviews
  kind: dbt
  group: platform
  x: 980
  y: 480
  desc: Review dimension with NPS category.
  owner: domain_b
  tests:
  - assert_domain_b_reviews_delivered
- id: dbt.mart_olist_payment_performance
  label: mart_payment_performance
  kind: dbt
  group: platform
  x: 1260
  y: 380
  desc: 'Finance data product: revenue per month.'
  owner: domain_a
  tests:
  - mart_olist_payment_performance
- id: dbt.mart_olist_customer_satisfaction
  label: mart_customer_satisfaction
  kind: dbt
  group: platform
  x: 1260
  y: 480
  desc: 'Marketing data product: NPS per month.'
  owner: domain_b
  tests:
  - mart_olist_customer_satisfaction
- id: git.feature
  label: feature/* branches
  kind: git
  group: platform
  x: 420
  y: 930
  desc: Feature/bugfix branches (created from dev, squash-merged back).
  owner: platform
- id: git.dev
  label: dev
  kind: git
  group: platform
  x: 620
  y: 930
  desc: Integration branch. Every push runs tag_dev (v1.x.y) + publish to LDV.
  owner: platform
- id: git.release
  label: release/YYYY-Qx
  kind: git
  group: platform
  x: 820
  y: 930
  desc: Quarterly release branch; unapproved features are reverted here only.
  owner: platform
- id: git.main
  label: main
  kind: git
  group: platform
  x: 1020
  y: 930
  desc: Production. Promoted with merge-base reset + --no-ff; tag_main -> YYYY-Qx.N.
  owner: platform
- id: ci.verify
  label: GitLab CI verify
  kind: ci
  group: platform
  x: 820
  y: 1030
  desc: verify_feature_to_dev / verify_release_branch / verify_release_to_main.
