- id: airflow.daily_load
  label: dbt_daily_load
  kind: airflow
  group: platform
  x: 1220
  y: 930
  desc: Airflow daily dbt build (pauses during a release).
  owner: platform
- id: airflow.release
  label: dbt_release
  kind: airflow
  group: platform
  x: 1220
  y: 1030
  desc: 'Airflow release DAG: pause daily load, step builds, reload, accumulated state.'
  owner: platform
- id: db.dev
  label: SingleStore LDV
  kind: db
  group: platform
  x: 1430
  y: 930
  desc: analytics_dev + model databases (Domain A+B landed).
  owner: platform
- id: db.prod
  label: SingleStore PRD
  kind: db
  group: platform
  x: 1430
  y: 1030
  desc: analytics_prod (Domain B withheld until delivered).
  owner: platform
