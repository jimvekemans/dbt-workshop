sprint:
  days_step: 1
  days:
  - day: 1
    title: Sprint start - feeds deliver on time
    milestone: Sprint planning
    sim:
      team.webapp:
        health: ok
      team.kafka:
        health: ok
      team.drive:
        health: ok
      channel.webapp:
        health: ok
      channel.kafka:
        health: ok
      channel.drive:
        health: ok
      team.platform:
        health: ok
      team.core:
        health: ok
      team.domain_a:
        health: ok
      team.domain_b:
        health: ok
      landing.raw_olist_orders:
        health: ok
      landing.raw_olist_customers:
        health: ok
      landing.raw_olist_order_payments:
        health: ok
      landing.raw_olist_order_reviews:
        health: ok
      team.carrier:
        health: ok
      team.web:
        health: ok
      channel.carrier:
        health: ok
      channel.web:
        health: ok
      landing.raw_carrier_tracking_events:
        health: ok
      landing.raw_web_events:
        health: ok
      airflow.levers:
        health: ok
    live:
    - action: trickle
      env: both
      days: 1
    - action: airflow_trigger
      env: dev
      dag: dbt_daily_load
      conf:
        manual_run_override: true
      allow_failure: true
  - day: 2
    title: 'Daily load: staging models build'
    live_note: only the trickle runs; the LDV daily load runs on day 1 (and the PRD one on day 10)
    sim:
      dbt.stg_olist_orders:
        health: ok
      dbt.stg_olist_customers:
        health: ok
      dbt.stg_olist_payments:
        health: ok
      dbt.stg_olist_reviews:
        health: ok
      airflow.daily_load:
        health: ok
      db.dev:
        health: ok
      dbt.stg_carrier_tracking_events:
        health: ok
      dbt.stg_web_events:
        health: ok
    live:
    - action: trickle
      env: both
      days: 1
  - day: 3
    title: Core + domain models build; feature branches open
    live_note: only the trickle runs; a real feature branch is created by H0 step 2
    sim:
      dbt.dim_olist_customers:
        health: ok
      dbt.fct_olist_orders:
        health: ok
      dbt.dim_olist_payments:
        health: ok
      dbt.dim_olist_reviews:
        health: ok
      git.feature:
        health: ok
      dbt.fct_olist_deliveries:
        health: ok
      dbt.int_web_top_pages:
        health: ok
    live:
    - action: trickle
      env: both
      days: 1
  - day: 4
    title: Marts built; feature MR verified and squash-merged to dev
    live_note: only the trickle runs; the real MR, CI verify and squash-merge are H0 step 2
    sim:
      dbt.mart_olist_payment_performance:
        health: ok
      dbt.mart_olist_customer_satisfaction:
        health: ok
      git.dev:
        health: ok
      ci.verify:
        health: ok
      dbt.mart_olist_management_kpi:
        health: ok
      dbt.mart_web_conversion:
        health: ok
      dbt.mart_web_journeys:
        health: ok
    live:
    - action: trickle
      env: both
      days: 1
  - day: 5
    title: tag_dev tags the squash commit (v1.x.0); LDV is published
    live_note: only the trickle runs; the real tag_dev and LDV publish are H0 step 3
    milestone: tag_dev
    sim:
      git.dev:
        health: ok
    live:
    - action: trickle
      env: both
      days: 1
  - day: 6
    title: Quarterly release branch is cut from dev
    live_note: only the trickle runs; the real release cut is H0 step 4
    milestone: release/2026-Q1
    sim:
      git.release:
        health: ok
    live:
    - action: trickle
      env: both
      days: 1
  - day: 7
    title: verify_release_branch is green on CBT
    live_note: only the trickle runs; the real verify_release_branch is H0 step 4
    milestone: verify
    sim:
      ci.verify:
        health: ok
    live:
    - action: trickle
      env: both
      days: 1
  - day: 8
    title: 'Promote: merge-base reset + --no-ff merge; tag_main -> 2026-Q1.0'
    live_note: only the trickle runs; the real promote and tag_main are H0 step 5
    milestone: tag_main
    sim:
      git.main:
        health: ok
    live:
    - action: trickle
      env: both
      days: 1
  - day: 9
    title: deploy_prd_manual + dbt_release runs on PRD
    live_note: only the trickle runs; the real deploy_prd_manual and dbt_release are H0 step 6
    milestone: dbt_release
    sim:
      airflow.release:
        health: ok
      db.prod:
        health: ok
    live:
    - action: trickle
      env: both
      days: 1
  - day: 10
    title: Reports, metrics and forecasts are refreshed
    milestone: Sprint review
    sim:
      exposure.finance_revenue_report:
        health: ok
      exposure.marketing_nps_dashboard:
        health: ok
      exposure.management_kpi_forecast:
        health: ok
      consumer.finance:
        health: ok
      consumer.marketing:
        health: ok
      consumer.management:
        health: ok
      exposure.management_delivery_kpi:
        health: ok
    live:
    - action: trickle
      env: both
      days: 1
    - action: airflow_trigger
      env: prod
      dag: dbt_daily_load
      conf:
        manual_run_override: true
      allow_failure: true
