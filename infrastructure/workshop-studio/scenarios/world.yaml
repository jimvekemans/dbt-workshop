# Workshop Studio world: nodes (positions are canvas px), edges, and the 10-day happy-flow sprint timeline.
# `sim:` blocks animate the map offline; `live:` blocks run against the stack when Live mode is on.
groups:
- id: sources
  label: ① Source teams
  subtitle: deliver the raw feeds
  x: 0
  y: 0
  w: 350
  h: 900
- id: platform
  label: ② Our data platform
  subtitle: 4 engineering teams · GitLab · Airflow · SingleStore
  x: 390
  y: 0
  w: 1290
  h: 1230
- id: consumers
  label: ③ Consumers
  subtitle: reports, metrics, forecasts
  x: 1720
  y: 0
  w: 380
  h: 700
nodes:
- id: team.webapp
  label: Webapp team
  kind: source_team
  group: sources
  x: 15
  y: 90
  desc: 'Owns the webshop: orders + customers (CDC feed).'
- id: team.kafka
  label: Kafka team
  kind: source_team
  group: sources
  x: 15
  y: 260
  desc: Owns the payments topic (Domain A source).
- id: team.drive
  label: Mounted-drive team
  kind: source_team
  group: sources
  x: 15
  y: 430
  desc: Drops review files on a mounted drive (Domain B source).
- id: channel.webapp
  label: Webapp feed
  kind: channel
  group: sources
  x: 185
  y: 90
  desc: orders + customers landing in raw_olist_orders / raw_olist_customers.
  knobs:
  - key: enabled
    label: Channel delivers
    type: bool
    default: true
    live:
      action: set_channel
      env: prod
      channel: webapp
      field: enabled
  - key: delay_batches
    label: Delay (batches)
    type: int
    default: 0
    min: 0
    max: 5
    live:
      action: set_channel
      env: prod
      channel: webapp
      field: delay_batches
  - key: duplicate_pct
    label: Duplicate % of batch
    type: int
    default: 0
    min: 0
    max: 100
    live:
      action: set_channel
      env: prod
      channel: webapp
      field: duplicate_pct
  - key: partial_pct
    label: Only % of batch lands
    type: int
    default: 100
    min: 10
    max: 100
    live:
      action: set_channel
      env: prod
      channel: webapp
      field: partial_pct
  - key: null_key_pct
    label: NULL business keys %
    type: int
    default: 0
    min: 0
    max: 50
    live:
      action: set_channel
      env: prod
      channel: webapp
      field: null_key_pct
  - key: schema_variant
    label: Source contract
    type: select
    default: v1
    options:
    - v1
    - v2
    live:
      action: set_channel
      env: prod
      channel: webapp
      field: schema_variant
