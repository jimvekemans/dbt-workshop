  knobs:
  - key: enabled
    label: Channel delivers
    type: bool
    default: true
    live:
      action: set_channel
      env: prod
      channel: carrier
      field: enabled
  - key: delay_batches
    label: Delay (batches)
    type: int
    default: 0
    min: 0
    max: 5
    live:
      action: set_channel
      env: prod
      channel: carrier
      field: delay_batches
  - key: duplicate_pct
    label: Duplicate % of batch
    type: int
    default: 0
    min: 0
    max: 100
    live:
      action: set_channel
      env: prod
      channel: carrier
      field: duplicate_pct
  - key: partial_pct
    label: Only % of batch lands
    type: int
    default: 100
    min: 10
    max: 100
    live:
      action: set_channel
      env: prod
      channel: carrier
      field: partial_pct
  - key: null_key_pct
    label: NULL business keys %
    type: int
    default: 0
    min: 0
    max: 50
    live:
      action: set_channel
      env: prod
      channel: carrier
      field: null_key_pct
  - key: schema_variant
    label: Payload format (API)
    type: select
    default: v1
    options:
    - v1
    - v2
    live:
      action: set_channel
      env: prod
      channel: carrier
      field: schema_variant
  - key: late_pct
    label: Late scans %
    type: int
    default: 0
    min: 0
    max: 90
    live:
      action: set_channel
      env: prod
      channel: carrier
      field: late_pct
