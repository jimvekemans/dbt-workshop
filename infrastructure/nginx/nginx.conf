events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    server {
        listen 8081;
        location / { root /usr/share/nginx/html/dev; index index.html; }
    }
    server {
        listen 8082;
        location / { root /usr/share/nginx/html/val; index index.html; }
    }
    server {
        listen 8086;
        location / { root /usr/share/nginx/html/prd; index index.html; }
    }
}
