# The workshop stack. Run it through the root Makefile (make up | bootstrap | reset | ...), which passes this file and
# this folder as the project directory; relative paths below are relative to infrastructure/compose/.
# .env next to this file holds GITLAB_CLIENT_ID / GITLAB_CLIENT_SECRET (written by bootstrap).
#
# Self-contained stack: project name pinned (compose would otherwise use the folder name "compose"), every
# container, volume and the network carry a workshop prefix, and the host ports avoid the usual ones (a personal
# SingleStore on 3306 / its UI on 8080 keeps running next to this stack). Inside workshop_net the service names and
# aliases (singlestore, mysql, gitlab.local) are the host names - containers are only addressed by name for
# docker exec/inspect (bootstrap, reset, CI deploy).
# Three environments (dev, val, prd): one Airflow + one state volume + one dbt docs site each, one shared SingleStore
# with separate databases per environment.
# Host ports, overridable from the environment:
#   WORKSHOP_S2_PORT (23306)  WORKSHOP_S2_UI_PORT (8083)  WORKSHOP_MAILPIT_PORT (8025)
#   WORKSHOP_AIRFLOW_DEV_PORT (8088)  WORKSHOP_AIRFLOW_VAL_PORT (8089)  WORKSHOP_AIRFLOW_PRD_PORT (8090)
# dbt docs sites: dev 8081, val 8082, prd 8086. Management commands (bootstrap, reset) run in the `manager` service.
name: dbt-workshop

# Upstream images are pinned to exact versions (bump deliberately and rerun a fresh bootstrap): pulled from Docker Hub
# (gitlab/gitlab-ce, gitlab/gitlab-runner, mysql, nginx, alpine, mailpit) and ghcr.io (singlestoredb-dev). Only airflow,
# manager, workshop-studio and the dbt base/dev images (built by `make images`) are built here.
configs:
  gitlab_omnibus:
    file: ../gitlab/gitlab.rb

networks:
  workshop_net:
    name: workshop_net
    driver: bridge

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  mysql_data:
  # SingleStore data directory (/data in the singlestoredb-dev image)
  s2_data:
    name: workshop_s2_data
  # The state of each environment: dags/, docs/, mnt_dbt/ (the "PVC"). Docker volumes, not host folders: filled by the
  # CI deploy job (through the docker socket); mounted by subpath below. Fixed names, because Airflow (dbt runner
  # containers) and the CI deploy job mount them by name: WORKSHOP_STATE_VOLUME.
  workshop_dev:
    name: workshop_dev
  workshop_val:
    name: workshop_val
  workshop_prd:
    name: workshop_prd
  studio_state:
    name: workshop_studio_state

x-airflow-common: &airflow-common
  build: ../airflow
  image: workshop-airflow:latest
  pull_policy: build
  restart: on-failure
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # A fixed key for the settings Airflow stores encrypted (Variables such as dbt_image_tag). Without it every
    # container makes up its own key when it is created, and after a recreate (`make up`, a compose change) the
    # stored settings can no longer be read: "Variable dbt_image_tag does not exist". Workshop-only value.
    AIRFLOW__CORE__FERNET_KEY: "cejtyZZF5JHUBwJP9mcWsBojOAz45Tz6VVX965dYBj0="
    # The same reason for the key that signs sign-in sessions: with a made-up key per container everybody is signed
    # out whenever an Airflow is recreated. Workshop-only value.
    AIRFLOW__API_AUTH__JWT_SECRET: "CAjI8VsdQiTXWYbPOM5Bz3d1vtdnZ2TDVuujXUew-bo="
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 30
    # Tasks talk to the API server inside the container (port 8080). Without this they follow AIRFLOW__API__BASE_URL, which
    # is the *published* host port (8088-8090) -> "Connection refused" and no task ever runs.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
    AIRFLOW__WEBSERVER__CONFIG_FILE: /opt/airflow/webserver_config.py
    PYTHONPATH: /opt/airflow/dags
    DOCKER_NETWORK: workshop_net
    # pinned for the docker CLI in the Airflow image (volume subpath mounts need >= 1.45; Docker 29 rejects < 1.44)
    DOCKER_API_VERSION: "1.47"
    SINGLESTORE_HOST: singlestore
    SINGLESTORE_PASS: CiServicePwd2026!
    DBT_REPORT_SMTP_HOST: mailpit
    DBT_REPORT_SMTP_PORT: "1025"
    DBT_FAILURE_EMAIL_RECIPIENTS: data-team@workshop.local
    GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-placeholder}
    GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-placeholder}
  # No extra_hosts entry for gitlab.local: the GitLab container carries that name as an alias on workshop_net, so the
  # sign-in callback (Airflow -> http://gitlab.local/oauth/token) goes straight to it. Routing it through the host
  # (host-gateway, port 80) is dropped by host firewalls and made every sign-in hang and fail.
  networks:
    - workshop_net

services:
  # Creates the layout in the state volumes: a subpath mount fails when the subdirectory does not exist yet.
  workshop-state-init:
    image: alpine:3.22
    container_name: workshop-state-init
    restart: "no"
    command:
      - sh
      - -c
      - |
        for e in dev val prd; do
          for d in dags/utils docs mnt_dbt/target mnt_dbt/artifacts; do mkdir -p /workshop_state/$$e/$$d; done
          chmod -R a+rwX /workshop_state/$$e
        done
    volumes:
      - workshop_dev:/workshop_state/dev
      - workshop_val:/workshop_state/val
      - workshop_prd:/workshop_state/prd

  mysql:
    image: mysql:8.4.13
    container_name: workshop-mysql
    restart: on-failure
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --explicit_defaults_for_timestamp=1
    environment:
      MYSQL_ROOT_PASSWORD: airflow_root_password
      MYSQL_USER: airflow
      MYSQL_PASSWORD: airflow_db_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ../airflow/mysql/init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pairflow_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - workshop_net

  singlestore:
    image: ghcr.io/singlestore-labs/singlestoredb-dev:0.2.90
    container_name: workshop-singlestore
    restart: on-failure
    mem_limit: 6g
    environment:
      ROOT_PASSWORD: ${S2_ROOT_PASSWORD:-WorkshopRootPwd123!}
      # Transaction logs are preallocated per partition (default 256 MB / 64 MB per file: 15+ GB for little data).
      # 16 MB keeps the data volume small. Applies to databases created after the container first started.
      SINGLESTORE_SET_GLOBAL_LOG_FILE_SIZE_PARTITIONS: "16777216"
      SINGLESTORE_SET_GLOBAL_LOG_FILE_SIZE_REF_DBS: "16777216"
    ports:
      - "${WORKSHOP_S2_PORT:-23306}:3306"
      - "${WORKSHOP_S2_UI_PORT:-8083}:8080" # SingleStore Studio UI
    volumes:
      # the singlestoredb-dev image keeps its data in /data (was mounted at /var/lib/memsql: nothing was persisted)
      - s2_data:/data
    networks:
      - workshop_net

  # Catches the report and failure mails of the three Airflows (SMTP mailpit:1025, no auth/TLS). Web UI on 8025.
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: workshop-mailpit
    restart: on-failure
    ports:
      - "${WORKSHOP_MAILPIT_PORT:-8025}:8025"
    networks:
      - workshop_net

  gitlab:
    image: gitlab/gitlab-ce:19.5.3-ce.0
    container_name: workshop-gitlab
    restart: on-failure
    hostname: gitlab.local
    mem_limit: 4g
    shm_size: '256m'
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:-WorkshopRootPwd123!}
      # ../gitlab/gitlab.rb (compose config below), applied on every start
      GITLAB_OMNIBUS_CONFIG: "from_file('/omnibus_config.rb')"
    configs:
      - source: gitlab_omnibus
        target: /omnibus_config.rb
    ports:
      - "80:80"
      - "2222:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    networks:
      workshop_net:
        aliases:
          - gitlab.local

  gitlab-runner:
    image: gitlab/gitlab-runner:alpine-v19.5.2
    container_name: workshop-gitlab-runner
    restart: on-failure
    depends_on:
      - gitlab
    # CI jobs reach the state volumes through the docker socket (docker run -v workshop_<env>:/state ...)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - workshop_net

  airflow-dev:
    <<: *airflow-common
    container_name: workshop-airflow-dev
    depends_on:
      mysql:
        condition: service_healthy
      workshop-state-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
      DBT_DEPLOY_TARGET: dev
      WORKSHOP_STATE_VOLUME: workshop_dev
      SINGLESTORE_USER: svc_dev_dbt
      DBT_REPORT_MAIL_FROM: airflow-dev@workshop.local
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+mysqldb://airflow:airflow_db_password@mysql:3306/airflow_dev?charset=utf8mb4
      AIRFLOW__API__BASE_URL: http://localhost:${WORKSHOP_AIRFLOW_DEV_PORT:-8088}
    ports:
      - "${WORKSHOP_AIRFLOW_DEV_PORT:-8088}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../airflow/webserver_config.py:/opt/airflow/webserver_config.py:ro
      - type: volume
        source: workshop_dev
        target: /opt/airflow/dags
        volume: {subpath: dags}
      - type: volume
        source: workshop_dev
        target: /mnt/dbt
        volume: {subpath: mnt_dbt}

  airflow-val:
    <<: *airflow-common
    container_name: workshop-airflow-val
    depends_on:
      mysql:
        condition: service_healthy
      workshop-state-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
      DBT_DEPLOY_TARGET: val
      WORKSHOP_STATE_VOLUME: workshop_val
      SINGLESTORE_USER: svc_val_dbt
      DBT_REPORT_MAIL_FROM: airflow-val@workshop.local
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+mysqldb://airflow:airflow_db_password@mysql:3306/airflow_val?charset=utf8mb4
      AIRFLOW__API__BASE_URL: http://localhost:${WORKSHOP_AIRFLOW_VAL_PORT:-8089}
    ports:
      - "${WORKSHOP_AIRFLOW_VAL_PORT:-8089}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../airflow/webserver_config.py:/opt/airflow/webserver_config.py:ro
      - type: volume
        source: workshop_val
        target: /opt/airflow/dags
        volume: {subpath: dags}
      - type: volume
        source: workshop_val
        target: /mnt/dbt
        volume: {subpath: mnt_dbt}

  airflow-prd:
    <<: *airflow-common
    container_name: workshop-airflow-prd
    depends_on:
      mysql:
        condition: service_healthy
      workshop-state-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
      DBT_DEPLOY_TARGET: prd
      WORKSHOP_STATE_VOLUME: workshop_prd
      SINGLESTORE_USER: svc_prd_dbt
      DBT_REPORT_MAIL_FROM: airflow-prd@workshop.local
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+mysqldb://airflow:airflow_db_password@mysql:3306/airflow_prd?charset=utf8mb4
      AIRFLOW__API__BASE_URL: http://localhost:${WORKSHOP_AIRFLOW_PRD_PORT:-8090}
    ports:
      - "${WORKSHOP_AIRFLOW_PRD_PORT:-8090}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../airflow/webserver_config.py:/opt/airflow/webserver_config.py:ro
      - type: volume
        source: workshop_prd
        target: /opt/airflow/dags
        volume: {subpath: dags}
      - type: volume
        source: workshop_prd
        target: /mnt/dbt
        volume: {subpath: mnt_dbt}

  dbt-docs:
    image: nginx:1.31.8-alpine
    container_name: workshop-dbt-docs
    restart: on-failure
    ports:
      - "8081:8081" # dev dbt docs
      - "8082:8082" # val dbt docs
      - "8086:8086" # prd dbt docs
    depends_on:
      workshop-state-init:
        condition: service_completed_successfully
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - type: volume
        source: workshop_dev
        target: /usr/share/nginx/html/dev
        read_only: true
        volume: {subpath: docs}
      - type: volume
        source: workshop_val
        target: /usr/share/nginx/html/val
        read_only: true
        volume: {subpath: docs}
      - type: volume
        source: workshop_prd
        target: /usr/share/nginx/html/prd
        read_only: true
        volume: {subpath: docs}
    networks:
      - workshop_net

  # Workshop overview: one page with the live state, users and links of every service. Read-only view (docker socket
  # mounted read-only, only GET), no depends_on: it must come up and report while the rest is down. Localhost only.
  overview:
    build: ../overview
    image: workshop-overview:latest
    pull_policy: build
    container_name: workshop-overview
    restart: on-failure
    ports:
      - "127.0.0.1:${WORKSHOP_OVERVIEW_PORT:-8099}:8000"
    environment:
      S2_HOST: singlestore
      S2_ROOT_PWD: ${S2_ROOT_PASSWORD:-WorkshopRootPwd123!}
      GITLAB_URL: http://gitlab.local
      GITLAB_PAT: glpat-workshop-root-token-2026
      WORKSHOP_AIRFLOW_DEV_PORT: ${WORKSHOP_AIRFLOW_DEV_PORT:-8088}
      WORKSHOP_AIRFLOW_VAL_PORT: ${WORKSHOP_AIRFLOW_VAL_PORT:-8089}
      WORKSHOP_AIRFLOW_PRD_PORT: ${WORKSHOP_AIRFLOW_PRD_PORT:-8090}
      WORKSHOP_S2_UI_PORT: ${WORKSHOP_S2_UI_PORT:-8083}
      WORKSHOP_MAILPIT_PORT: ${WORKSHOP_MAILPIT_PORT:-8025}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # where the SingleStore users and the GitLab users get their passwords (shown on the page on demand)
      - ../singlestore:/workshop/singlestore:ro
      - ../manager/bootstrap_stack.py:/workshop/bootstrap_stack.py:ro
    networks:
      - workshop_net

  # Workshop manager: bootstrap / reset, run on demand through the Makefile
  # (`docker compose run --rm -v <repo>:<repo> manager ...`). Profile "manager": `up` never starts it. Orchestrates the stack through the docker socket, talks to it over workshop_net.
  manager:
    build: ../manager
    image: workshop-manager:latest
    pull_policy: build
    profiles: ["manager"]
    restart: "no"
    environment:
      S2_HOST: singlestore
      S2_PORT: "3306"
      S2_ROOT_PWD: ${S2_ROOT_PASSWORD:-WorkshopRootPwd123!}
      GITLAB_URL: http://gitlab.local
      GITLAB_CONTAINER: workshop-gitlab
      RUNNER_CONTAINER: workshop-gitlab-runner
      S2_CONTAINER: workshop-singlestore
      WORKSHOP_AIRFLOW_DEV_PORT: ${WORKSHOP_AIRFLOW_DEV_PORT:-8088}
      WORKSHOP_AIRFLOW_VAL_PORT: ${WORKSHOP_AIRFLOW_VAL_PORT:-8089}
      WORKSHOP_AIRFLOW_PRD_PORT: ${WORKSHOP_AIRFLOW_PRD_PORT:-8090}
      WORKSHOP_S2_PORT: ${WORKSHOP_S2_PORT:-23306}
      WORKSHOP_S2_UI_PORT: ${WORKSHOP_S2_UI_PORT:-8083}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - workshop_net

  # Workshop Studio: the presenter's app. It walks an audience through small scenarios and drives this stack for real
  # (docker socket, GitLab root PAT, SingleStore root). Published on localhost only, never expose it. Content is
  # bind-mounted so scenarios and patches are edited without a rebuild and recordings land in the repo.
  workshop-studio:
    build: ../workshop-studio
    container_name: workshop-studio
    restart: on-failure
    ports:
      - "127.0.0.1:${WORKSHOP_STUDIO_PORT:-8085}:8085"
    environment:
      S2_HOST: singlestore
      S2_PORT: "3306"
      S2_ROOT_PWD: ${S2_ROOT_PASSWORD:-WorkshopRootPwd123!}
      MYSQL_HOST: mysql
      GITLAB_URL: http://gitlab.local
      GITLAB_PAT: glpat-workshop-root-token-2026
      MAILPIT_URL: http://mailpit:8025
      DOCKER_NETWORK: workshop_net
      STUDIO_BASELINE_TAG: ${STUDIO_BASELINE_TAG:-v1.0.0}
      OVERVIEW_URL: http://localhost:8099
      # times in sentences ("Approved on 15 November, 18:06") are written in this zone
      STUDIO_TIME_ZONE: ${TZ:-Europe/Brussels}
      # pinned for the docker CLI in the image (volume subpath mounts need >= 1.45; Docker 29 rejects < 1.44)
      DOCKER_API_VERSION: "1.47"
    depends_on:
      workshop-state-init:
        condition: service_completed_successfully
      # the studio checks and fills the databases as soon as it starts
      singlestore:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workshop_dev:/state/dev:ro
      - workshop_val:/state/val:ro
      - workshop_prd:/state/prd:ro
      - ../../dbt-singlestore-workshop:/workshop/dbt-singlestore-workshop:ro
      - ../singlestore:/workshop/singlestore:ro
      # the recipe of the developer image, shown as code in the "same toolbox" scenario
      - ../dbt-singlestore-dev-image:/workshop/dev-image:ro
      - ../workshop-studio/scenarios:/app/scenarios:ro
      - ../workshop-studio/patches:/app/patches:ro
      - ../workshop-studio/recordings:/app/recordings
      - studio_state:/data
    networks:
      - workshop_net
