[package]
name = "vdp-vaultspeed-cli"
description = "The `vdp-vaultspeed` command: the whole `vdp-release-ui` command line (`vdp` and `release serve`) plus the VaultSpeed module, with the VaultSpeed extension in the release hub."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vdp-vaultspeed"
path = "src/main.rs"
# The binary shares its name with the `vdp-vaultspeed` library, so their rustdoc output would collide.
doc = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
similar.workspace = true
tracing.workspace = true
vdp-cli = { workspace = true, features = ["sources", "release", "sql", "qa"] }
vdp-core.workspace = true
vdp-db.workspace = true
vdp-release-hub.workspace = true
vdp-release-ui-cli.workspace = true
vdp-secrets.workspace = true
vdp-ssh.workspace = true
vdp-vaultspeed.workspace = true
vdp-vaultspeed-dags.workspace = true
vdp-vaultspeed-domain.workspace = true
vdp-vaultspeed-history.workspace = true
vdp-vaultspeed-hub.workspace = true
vdp-vaultspeed-release.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
