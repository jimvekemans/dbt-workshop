[package]
name = "vdp-vaultspeed-cli"
description = "The `vdp-vaultspeed` command: the whole `vdp` command line plus the VaultSpeed module and the release hub with its VaultSpeed extension."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vdp-vaultspeed"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
similar.workspace = true
tracing.workspace = true
vdp-cli = { workspace = true, features = ["sources", "release", "airflow", "sql", "qa", "release-hub"] }
vdp-core.workspace = true
vdp-db.workspace = true
vdp-release-hub.workspace = true
vdp-secrets.workspace = true
vdp-ssh.workspace = true
vdp-vaultspeed.workspace = true
vdp-vaultspeed-dags.workspace = true
vdp-vaultspeed-domain.workspace = true
vdp-vaultspeed-history.workspace = true
vdp-vaultspeed-hub.workspace = true
vdp-vaultspeed-release.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
