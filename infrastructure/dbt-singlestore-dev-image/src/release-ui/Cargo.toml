[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-VDAB-internal"
publish = false

[workspace.dependencies]
# the release UI's backend (the release hub and the announcements it sends)
vdp-release-hub = { path = "crates/vdp-release-hub" }
vdp-notify = { path = "crates/vdp-notify" }
vdp-release-ui-cli = { path = "crates/vdp-release-ui-cli" }

# vdp-rust-utils (the sibling workspace)
vdp-core = { path = "../vdp-rust-utils/crates/vdp-core" }
vdp-secrets = { path = "../vdp-rust-utils/crates/vdp-secrets" }
vdp-dbt = { path = "../vdp-rust-utils/crates/vdp-dbt" }
vdp-git = { path = "../vdp-rust-utils/crates/vdp-git" }
vdp-jira = { path = "../vdp-rust-utils/crates/vdp-jira" }
vdp-release = { path = "../vdp-rust-utils/crates/vdp-release" }
# the `vdp` command line as a library; the features are chosen where it is used
vdp-cli = { path = "../vdp-rust-utils/crates/vdp-cli", default-features = false }

# external
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
tracing = "0.1"
ureq = { version = "3", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Doc prose names products (SingleStore, AppRole, Jira); backticking them hurts readability.
doc_markdown = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# A two-armed `match` reads better than `if let ... else` for Option/Result handling.
single_match_else = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
